[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "federal-ai-acquisition-gate"
version = "0.1.0"
description = "Can an acquisition-support agent test vendor claims, data rights, portability, pricing, and monitoring evidence without selecting an offeror or awarding a contract?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
federal-ai-acquisition-gate = "acquisition_performance_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

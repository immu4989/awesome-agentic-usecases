[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aau-harness"
version = "1.6.0"
description = "Provider-neutral agent evaluation, release gates, evidence receipts, human baselines, and public Impact Capsules."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Imran Ahamed" }]
keywords = ["agents", "evaluation", "llm", "agentic-ai", "release-gate", "oscal", "public-value", "tevv", "human-baseline", "evidence-commons"]
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
aau = "aau_harness.catalog_cli:main"
aau-evaluate = "aau_harness.evaluate:main"
aau-forge = "aau_harness.forge:main"
aau-gallery = "aau_harness.gallery:main"
aau-challenge = "aau_harness.challenge:main"
aau-new-use-case = "aau_harness.scaffold:main"
aau-baseline = "aau_harness.human_baseline:main"
aau-evidence = "aau_harness.evidence_commons:main"
aau-release = "aau_harness.release_gate:main"

[project.urls]
Homepage = "https://github.com/immu4989/awesome-agentic-usecases"
Documentation = "https://github.com/immu4989/awesome-agentic-usecases/tree/main/harness"
Issues = "https://github.com/immu4989/awesome-agentic-usecases/issues"
Changelog = "https://github.com/immu4989/awesome-agentic-usecases/blob/main/CHANGELOG.md"
"Human Baseline Lab" = "https://immu4989.github.io/awesome-agentic-usecases/#human-baseline-lab"
"Evidence Commons" = "https://immu4989.github.io/awesome-agentic-usecases/#evidence-commons"
"Agent Release Gate" = "https://immu4989.github.io/awesome-agentic-usecases/#release-gate"

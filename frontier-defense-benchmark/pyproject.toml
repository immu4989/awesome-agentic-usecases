[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aau-frontier-defense-benchmark"
version = "0.1.0"
description = "Safe provider-neutral benchmark for defensive AI capabilities"
requires-python = ">=3.11"
license = "Apache-2.0"

[project.scripts]
aau-defense-benchmark = "aau_defense_benchmark:main"

[tool.setuptools]
py-modules = ["aau_defense_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]

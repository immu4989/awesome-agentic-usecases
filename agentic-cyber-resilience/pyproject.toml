[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aau-agent-boundary"
version = "0.2.0"
description = "Offline reference verifier and stateful conformance gateway for temporary AI-agent authority, safe stopping, delegation, revocation, monitoring, and human-controlled restart."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Imran Ahamed" }]
keywords = ["agentic-ai", "cybersecurity", "ai-agents", "authorization", "safe-stopping", "critical-infrastructure", "evaluation"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
aau-agent-boundary = "aau_boundary:main"
aau-agent-runtime = "aau_runtime:main"

[tool.setuptools]
py-modules = ["aau_boundary", "aau_runtime"]

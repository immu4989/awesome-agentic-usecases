<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">AAU Agent Boundary Protocol</title>
  <desc id="desc">A human-issued temporary authority lease constrains an agent through six control gates and produces a tamper-evident receipt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1720"/>
      <stop offset="1" stop-color="#16232d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".22"/>
    </filter>
    <style>
      .eyebrow{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px;fill:#a9b7c2}
      .title{font:700 31px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f4f7f8}
      .deck{font:400 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#b9c5cc}
      .label{font:650 14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#edf2f4}
      .small{font:450 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#aebbc3}
      .mono{font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#cad5da}
    </style>
  </defs>
  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <path d="M0 1H1200" stroke="#33434e"/>
  <text x="56" y="51" class="eyebrow">AGENTIC CYBER RESILIENCE COMMONS · OPEN REFERENCE PROFILE</text>
  <text x="56" y="91" class="title">Agent Boundary Protocol</text>
  <text x="56" y="119" class="deck">Prove the agent can stay in scope, stop safely, and remain under human control.</text>

  <g filter="url(#shadow)">
    <rect x="56" y="166" width="194" height="167" rx="12" fill="#192a35" stroke="#4d6574"/>
    <circle cx="89" cy="200" r="16" fill="#d3a953"/>
    <path d="M82 200l5 5 10-12" fill="none" stroke="#14212a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="117" y="196" class="label">Human authority</text>
    <text x="117" y="215" class="small">temporary lease</text>
    <text x="77" y="256" class="mono">IDENTITY · TASK · TIME</text>
    <text x="77" y="278" class="mono">TOOLS · TARGETS · EGRESS</text>
    <text x="77" y="306" class="small">Capability never implies permission.</text>
  </g>

  <path d="M251 250H295" stroke="#667b88" stroke-width="2"/>
  <path d="M291 244l8 6-8 6" fill="none" stroke="#667b88" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="300" y="145" width="600" height="210" rx="14" fill="#111d25" stroke="#40535f"/>
    <text x="325" y="177" class="eyebrow">MACHINE-CHECKED GATES</text>
    <g transform="translate(325 198)">
      <rect width="162" height="58" rx="9" fill="#1c2b34" stroke="#516875"/>
      <text x="17" y="25" class="label">01 · Identity</text><text x="17" y="44" class="small">actor + task + lease</text>
    </g>
    <g transform="translate(508 198)">
      <rect width="162" height="58" rx="9" fill="#1c2b34" stroke="#516875"/>
      <text x="17" y="25" class="label">02 · Scope</text><text x="17" y="44" class="small">tool + resource + time</text>
    </g>
    <g transform="translate(691 198)">
      <rect width="184" height="58" rx="9" fill="#1c2b34" stroke="#516875"/>
      <text x="17" y="25" class="label">03 · Peer trust</text><text x="17" y="44" class="small">message ≠ authority</text>
    </g>
    <g transform="translate(325 274)">
      <rect width="162" height="58" rx="9" fill="#1c2b34" stroke="#516875"/>
      <text x="17" y="25" class="label">04 · Egress</text><text x="17" y="44" class="small">declared destinations</text>
    </g>
    <g transform="translate(508 274)">
      <rect width="162" height="58" rx="9" fill="#1c2b34" stroke="#516875"/>
      <text x="17" y="25" class="label">05 · Safe stop</text><text x="17" y="44" class="small">broken is an outcome</text>
    </g>
    <g transform="translate(691 274)">
      <rect width="184" height="58" rx="9" fill="#1c2b34" stroke="#516875"/>
      <text x="17" y="25" class="label">06 · Recovery</text><text x="17" y="44" class="small">human restart evidence</text>
    </g>
  </g>

  <path d="M901 250H945" stroke="#667b88" stroke-width="2"/>
  <path d="M941 244l8 6-8 6" fill="none" stroke="#667b88" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="950" y="166" width="194" height="167" rx="12" fill="#192a35" stroke="#4d6574"/>
    <rect x="973" y="185" width="32" height="40" rx="4" fill="none" stroke="#7fb6a4" stroke-width="2"/>
    <path d="M981 197h16M981 204h16M981 211h10" stroke="#7fb6a4" stroke-width="2"/>
    <text x="1019" y="198" class="label">Boundary receipt</text>
    <text x="1019" y="217" class="small">recomputable evidence</text>
    <text x="973" y="256" class="mono">ALLOW · BLOCK</text>
    <text x="973" y="278" class="mono">SAFE_STOP · PAUSE</text>
    <text x="973" y="306" class="small">SHA-256 result chain</text>
  </g>

  <text x="56" y="389" class="small">OFFLINE · SYNTHETIC · STANDARD LIBRARY · NO LIVE TARGETS · NO CERTIFICATION CLAIM</text>
</svg>

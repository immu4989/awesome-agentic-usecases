[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "food-recall-traceability"
version = "0.1.0"
description = "Can an agent assemble an exact lot-and-recipient trace without inventing links or deciding recall scope?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
food-recall-traceability = "food_recall_traceability_coordinator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

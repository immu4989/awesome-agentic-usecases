[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drinking-water-notice"
version = "0.1.0"
description = "Can an agent join inventory, sample, notice, delivery, assistance, and replacement evidence without calling unknown safe or unsafe?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
drinking-water-notice = "drinking_water_notice_coordinator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

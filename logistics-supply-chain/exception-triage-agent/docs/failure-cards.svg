<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Observed Exception Triage failure modes</title>
  <desc id="desc">Three observed, reproducible failure modes from committed evaluation runs.</desc>
  <style>
    :root { color-scheme:light dark; }
    .surface { fill:#f7faf8; } .card { fill:#fff;stroke:#d9e2dd;stroke-width:1.5; }
    .ink { fill:#10231d; } .muted { fill:#52645e; }
    .kicker { font:750 13px system-ui,sans-serif;letter-spacing:1.6px; } .title { font:750 28px system-ui,sans-serif; }
    .mode { font:850 19px ui-monospace,SFMono-Regular,monospace; } .headline { font:740 17px system-ui,sans-serif; }
    .body { font:430 14px system-ui,sans-serif; } .pill { font:750 11px system-ui,sans-serif;letter-spacing:.8px; }
    @media (prefers-color-scheme:dark) {
      .surface { fill:#101916; } .card { fill:#17231f;stroke:#30433c; }
      .ink { fill:#f4faf7; } .muted { fill:#b2c3bc; }
    }
  </style>
  <rect width="1200" height="540" rx="20" class="surface"/>
  <text x="42" y="42" class="kicker" fill="#2a78d6">OBSERVED IN THE LAB · NOT HYPOTHETICAL</text>
  <text x="42" y="84" class="title ink">How this agent actually fails</text>
  <g transform="translate(960 35)"><rect width="198" height="30" rx="15" fill="#2a78d6" opacity=".13"/><circle cx="17" cy="15" r="5" fill="#2a78d6"/><text x="30" y="19" class="pill muted">REPRODUCIBLE CASES</text></g>
  <g transform="translate(42 128)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#2a78d6" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#2a78d6">01</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">Reasoning–action contradiction</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">the shipment&#x27;s declared value is $2,294 — above the $2,000 escalation threshold. The agent&#x27;s submitted reasoning states the</tspan><tspan x="94" dy="20">breach and cites the policy: &quot;declared value $2294.12 (&gt; $2000) … POL-ESC-01 requires escalati[on]&quot; — and then submits…</tspan></text></g><g transform="translate(42 252)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#2a78d6" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#2a78d6">02</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">Policy misreading → systematic under-automation</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">policy POL-WX-05 says weather delays &quot;may be auto-resolved via the customer-notification workflow,&quot; and POL-ADDR-02 allows</tspan><tspan x="94" dy="20">auto-applying validated address candidates. The agent retrieves these policies, then asserts the opposite — &quot;automation is…</tspan></text></g><g transform="translate(42 376)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#2a78d6" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#2a78d6">03</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">Invented escalation rule (tier-driven over-escalation)</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">lost or damaged shipments belonging to gold/platinum customers get escalate_to_human even though value and SLA are below</tspan><tspan x="94" dy="20">every policy threshold. The agent applies an &quot;important customer + emotive incident → escalate&quot; heuristic that appears…</tspan></text></g>
  <text x="42" y="514" class="body muted">Open FAILURE_MODES.md for scenario IDs, evidence, impact, and reproduction commands.</text>
</svg>

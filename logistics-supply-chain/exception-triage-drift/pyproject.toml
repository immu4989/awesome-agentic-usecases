[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exception-triage-drift"
version = "0.1.0"
description = "The repo's flagship triage task, replayed in a world that lies: stale caches, sources that disagree, and partial responses. Same 30 scenarios and the same gold as the baseline, with reliability as the only variable, plus a tool-layer freshness gate compared against a prompt warning. Measures the #1 documented production failure: agents acting confidently on stale context."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Imran Ahamed" }]
keywords = ["agents", "llm", "evaluation", "reliability", "data-quality", "production", "stale-context"]
dependencies = ["aau-harness", "exception-triage-agent"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
exception-triage-drift = "exception_triage_drift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

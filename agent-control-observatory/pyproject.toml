[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aau-agent-control-observatory"
version = "0.1.0"
description = "Matched deterministic control-effectiveness experiments for agent boundaries."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Imran Ahamed" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
aau-controls = "aau_observatory:main"

[tool.setuptools]
py-modules = ["aau_observatory"]

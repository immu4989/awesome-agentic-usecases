[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-rights-orchestrator"
version = "0.1.0"
description = "Evaluate identity, exact system coverage, deadlines, recourse, and truthful privacy-request completion."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["agents", "llm", "evaluation", "privacy", "data-governance", "deletion", "access", "correction"]
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
privacy-rights-orchestrator = "privacy_rights_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

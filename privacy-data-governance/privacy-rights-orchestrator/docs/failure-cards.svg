<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Observed Privacy Rights Orchestrator failure modes</title>
  <desc id="desc">Three observed, reproducible failure modes from committed evaluation runs.</desc>
  <style>
    :root { color-scheme:light dark; }
    .surface { fill:#f7faf8; } .card { fill:#fff;stroke:#d9e2dd;stroke-width:1.5; }
    .ink { fill:#10231d; } .muted { fill:#52645e; }
    .kicker { font:750 13px system-ui,sans-serif;letter-spacing:1.6px; } .title { font:750 28px system-ui,sans-serif; }
    .mode { font:850 19px ui-monospace,SFMono-Regular,monospace; } .headline { font:740 17px system-ui,sans-serif; }
    .body { font:430 14px system-ui,sans-serif; } .pill { font:750 11px system-ui,sans-serif;letter-spacing:.8px; }
    @media (prefers-color-scheme:dark) {
      .surface { fill:#101916; } .card { fill:#17231f;stroke:#30433c; }
      .ink { fill:#f4faf7; } .muted { fill:#b2c3bc; }
    }
  </style>
  <rect width="1200" height="540" rx="20" class="surface"/>
  <text x="42" y="42" class="kicker" fill="#6a1b9a">OBSERVED IN THE LAB · NOT HYPOTHETICAL</text>
  <text x="42" y="84" class="title ink">How this agent actually fails</text>
  <g transform="translate(960 35)"><rect width="198" height="30" rx="15" fill="#6a1b9a" opacity=".13"/><circle cx="17" cy="15" r="5" fill="#6a1b9a"/><text x="30" y="19" class="pill muted">REPRODUCIBLE CASES</text></g>
  <g transform="translate(42 128)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#6a1b9a" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#6a1b9a">01</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">The CRM is mistaken for the whole data estate</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">The baseline prepares the correct request type but removes archive and service_processor from the action.</tspan></text></g><g transform="translate(42 252)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#6a1b9a" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#6a1b9a">02</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">Verification collects an unnecessary government ID copy</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">The unverified requester receives the correct verification route plus government_id_copy, which the fictional policy does</tspan><tspan x="94" dy="20">not require.</tspan></text></g><g transform="translate(42 376)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#6a1b9a" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#6a1b9a">03</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">Prepared tasks are recorded as completed rights</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">Deletion and correction task plans set completion_claimed=true before any synthetic per-system receipts exist.</tspan></text></g>
  <text x="42" y="514" class="body muted">Open FAILURE_MODES.md for scenario IDs, evidence, impact, and reproduction commands.</text>
</svg>

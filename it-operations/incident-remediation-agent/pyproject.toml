[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-remediation-agent"
version = "0.1.0"
description = "What a production remediation agent does when the approved runbook action is blocked and a more powerful, irreversible tool is available. Scores a three-way outcome -- violate, escalate, or fail honestly -- across four policy arms including capability scoping."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Fnu Imran Ahamed" }]
keywords = ["agent-security", "escalation", "human-in-the-loop", "least-privilege", "sre", "agents", "llm", "evaluation"]
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
incident-remediation-agent = "incident_remediation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

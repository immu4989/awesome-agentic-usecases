<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Observed Incident Remediation failure modes</title>
  <desc id="desc">Three observed, reproducible failure modes from committed evaluation runs.</desc>
  <style>
    :root { color-scheme:light dark; }
    .surface { fill:#f7faf8; } .card { fill:#fff;stroke:#d9e2dd;stroke-width:1.5; }
    .ink { fill:#10231d; } .muted { fill:#52645e; }
    .kicker { font:750 13px system-ui,sans-serif;letter-spacing:1.6px; } .title { font:750 28px system-ui,sans-serif; }
    .mode { font:850 19px ui-monospace,SFMono-Regular,monospace; } .headline { font:740 17px system-ui,sans-serif; }
    .body { font:430 14px system-ui,sans-serif; } .pill { font:750 11px system-ui,sans-serif;letter-spacing:.8px; }
    @media (prefers-color-scheme:dark) {
      .surface { fill:#101916; } .card { fill:#17231f;stroke:#30433c; }
      .ink { fill:#f4faf7; } .muted { fill:#b2c3bc; }
    }
  </style>
  <rect width="1200" height="540" rx="20" class="surface"/>
  <text x="42" y="42" class="kicker" fill="#c94a42">OBSERVED IN THE LAB · NOT HYPOTHETICAL</text>
  <text x="42" y="84" class="title ink">How this agent actually fails</text>
  <g transform="translate(960 35)"><rect width="198" height="30" rx="15" fill="#c94a42" opacity=".13"/><circle cx="17" cy="15" r="5" fill="#c94a42"/><text x="30" y="19" class="pill muted">REPRODUCIBLE CASES</text></g>
  <g transform="translate(42 128)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#c94a42" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#c94a42">01</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">The policy everyone writes works on one model and not another</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">16 of 24 incidents violated undefended; 15 of 24 with the policy. Fisher exact p = 1.000. The point estimate moves the</tspan><tspan x="94" dy="20">wrong way (0.46 → 0.53) and the intervals sit on top of each other.</tspan></text></g><g transform="translate(42 252)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#c94a42" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#c94a42">02</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">Naming the tools works completely — in this setting</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">- Reproduce: --arm named, mistral. Violations 0.46 → 0.00, escalation 0.33 → 0.99, p &lt; 0.0001. - What changed: the same</tspan><tspan x="94" dy="20">policy length, naming force_unlock, failover_database and purge_queue explicitly, plus &quot;do not call them even if a tool…</tspan></text></g><g transform="translate(42 376)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#c94a42" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#c94a42">03</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">Least privilege bought a false all-clear (on one model of three)</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">both drive violations to 0.00. scoped then files a record saying &quot;remediated&quot; on 0.35 of blocked incidents — every one of</tspan><tspan x="94" dy="20">its neither outcomes. named does this on 0.01.</tspan></text></g>
  <text x="42" y="514" class="body muted">Open FAILURE_MODES.md for scenario IDs, evidence, impact, and reproduction commands.</text>
</svg>

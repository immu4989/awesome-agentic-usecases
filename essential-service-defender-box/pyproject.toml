[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aau-essential-service-defender-box"
version = "0.1.0"
description = "Offline continuity-aware vulnerability routing for essential-service defenders"
requires-python = ">=3.11"
license = "Apache-2.0"

[project.scripts]
aau-defender-box = "aau_defender_box:main"

[tool.setuptools]
py-modules = ["aau_defender_box"]

[tool.pytest.ini_options]
testpaths = ["tests"]

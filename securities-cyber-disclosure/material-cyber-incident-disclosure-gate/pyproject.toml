[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "material-cyber-disclosure-gate"
version = "0.1.0"
description = "Can an agent separate discovery from the human materiality determination, calculate four business days, protect response details, and prove a Form 8-K filing?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
material-cyber-disclosure-gate = "material_cyber_incident_disclosure_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

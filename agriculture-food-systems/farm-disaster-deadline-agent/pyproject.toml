[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "farm-disaster-deadline"
version = "0.1.0"
description = "Evaluate whether a farm disaster navigator preserves every applicable notice window without inventing eligibility or awards."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["agents", "llm", "evaluation", "agriculture", "farm", "disaster", "deadlines", "public-value"]
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
farm-disaster-deadline = "farm_disaster_deadline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

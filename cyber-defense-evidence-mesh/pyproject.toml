[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aau-cyber-defense-evidence-mesh"
version = "0.1.0"
description = "Privacy-bounded defensive evidence interoperability packs"
requires-python = ">=3.11"
license = "Apache-2.0"

[project.scripts]
aau-evidence-mesh = "aau_evidence_mesh:main"

[tool.setuptools]
py-modules = ["aau_evidence_mesh"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hipaa-breach-notification"
version = "0.1.0"
description = "Can an agent preserve business-associate, individual, HHS, media, substitute-notice, and under/over-500 paths without deciding breach status?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
hipaa-breach-notification = "hipaa_breach_notification_graph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

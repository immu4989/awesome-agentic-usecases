[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "device-adverse-event-gate"
version = "0.1.0"
description = "Can an agent identify the reporter, event, 5-workday or 30-calendar-day path, recipient set, and actual FDA receipt without making the medical judgment itself?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
device-adverse-event-gate = "adverse_event_reporting_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

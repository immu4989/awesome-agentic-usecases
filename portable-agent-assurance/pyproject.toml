[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aau-agent-assurance"
version = "0.5.0"
description = "Offline MCP/A2A identity, authority, delegation, and evidence conformance testbed."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
aau-assurance = "aau_assurance:main"
aau-mcp-2026-delta = "mcp_2026_delta:main"
aau-a2a-1-delta = "a2a_1_delta:main"
aau-authority-relay = "authority_relay:main"
aau-assurance-matrix = "assurance_matrix:main"
aau-authority-trace = "authority_trace:main"

[tool.setuptools]
py-modules = ["aau_assurance", "mcp_2026_delta", "a2a_1_delta", "authority_relay", "assurance_matrix", "authority_trace"]

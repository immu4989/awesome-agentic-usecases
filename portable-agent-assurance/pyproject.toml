[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aau-agent-assurance"
version = "0.1.0"
description = "Offline MCP/A2A identity, authority, delegation, and evidence conformance testbed."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
aau-assurance = "aau_assurance:main"

[tool.setuptools]
py-modules = ["aau_assurance"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claim-evidence-verifier"
version = "0.1.0"
description = "Can an agent prove that every material claim is entailed by a current cited source, preserve contradictions, and stop before publication?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
claim-evidence-verifier = "claim_evidence_verifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

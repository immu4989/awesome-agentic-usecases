# Explicit lint rule set.
#
# CI installs `ruff>=0.4`, so it picks up whatever version is current. Ruff periodically
# widens its *default* rule set (0.16 added isort, flake8-blind-except, refurb and more),
# which turns a green build red without a line of this repo's code changing. Pinning the
# selection here keeps CI deterministic across ruff upgrades while leaving the tool free to
# update — the rules are a decision, not a default.
#
# This is the classic pyflakes + pycodestyle-error set the repo has always been linted
# against: real errors (undefined names, unused imports, syntax problems), not style
# opinions.

line-length = 100

[lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veterans-claim-evidence"
version = "0.1.0"
description = "Can an agent distinguish evidence already filed from evidence requested and route the correct claim-stage channel without rating the claim?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
veterans-claim-evidence = "veterans_claim_evidence_navigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paratransit-access"
version = "0.1.0"
description = "Can an agent coordinate accessible paratransit applications, clocks, trip conditions, and appeals without making eligibility decisions?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
paratransit-access = "paratransit_access_coordinator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

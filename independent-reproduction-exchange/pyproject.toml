[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aau-independent-reproduction-exchange"
version = "0.1.0"
description = "Blind, role-separated defensive reproduction and privacy-bounded federation"
requires-python = ">=3.10"

[project.scripts]
aau-reproduction = "aau_reproduction:main"

[tool.setuptools]
py-modules = ["aau_reproduction"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accessibility-remediation-verifier"
version = "0.1.0"
description = "Evaluate accessibility defect coverage, remediation tests, verified fix state, and false assurance."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["agents", "llm", "evaluation", "accessibility", "wcag", "section-508", "remediation"]
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
accessibility-remediation-verifier = "accessibility_remediation_verifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aau-agent-incident-exchange"
version = "1.0.0"
description = "Privacy-bounded, machine-readable public agent incident lessons"
requires-python = ">=3.10"

[project.scripts]
aau-incident-exchange = "aau_incident_exchange:main"

[tool.setuptools]
py-modules = ["aau_incident_exchange"]

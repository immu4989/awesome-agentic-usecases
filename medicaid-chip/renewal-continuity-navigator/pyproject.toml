[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medicaid-renewal-continuity"
version = "0.1.0"
description = "Can an agent reuse reliable agency data, request only what is actually missing, and preserve coverage and hearing rights without deciding eligibility?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
medicaid-renewal-continuity = "renewal_continuity_navigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

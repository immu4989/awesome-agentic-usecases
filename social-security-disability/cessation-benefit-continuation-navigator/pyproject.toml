[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disability-cessation-continuity"
version = "0.1.0"
description = "Can an agent preserve the 60-day medical-cessation appeal and the separate 15-day benefit-continuation election without adjudicating disability?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
disability-cessation-continuity = "cessation_benefit_continuation_navigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

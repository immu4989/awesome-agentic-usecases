[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "permit-readiness-agent"
version = "0.1.0"
description = "Evaluate jurisdiction-specific permit intake readiness without letting an agent approve permits or certify code compliance."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["agents", "llm", "evaluation", "housing", "construction", "permits", "public-value"]
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
permit-readiness-agent = "permit_readiness_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

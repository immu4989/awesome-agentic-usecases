<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Observed Permit Readiness Agent failure modes</title>
  <desc id="desc">Three observed, reproducible failure modes from committed evaluation runs.</desc>
  <style>
    :root { color-scheme:light dark; }
    .surface { fill:#f7faf8; } .card { fill:#fff;stroke:#d9e2dd;stroke-width:1.5; }
    .ink { fill:#10231d; } .muted { fill:#52645e; }
    .kicker { font:750 13px system-ui,sans-serif;letter-spacing:1.6px; } .title { font:750 28px system-ui,sans-serif; }
    .mode { font:850 19px ui-monospace,SFMono-Regular,monospace; } .headline { font:740 17px system-ui,sans-serif; }
    .body { font:430 14px system-ui,sans-serif; } .pill { font:750 11px system-ui,sans-serif;letter-spacing:.8px; }
    @media (prefers-color-scheme:dark) {
      .surface { fill:#101916; } .card { fill:#17231f;stroke:#30433c; }
      .ink { fill:#f4faf7; } .muted { fill:#b2c3bc; }
    }
  </style>
  <rect width="1200" height="540" rx="20" class="surface"/>
  <text x="42" y="42" class="kicker" fill="#b84d2c">OBSERVED IN THE LAB · NOT HYPOTHETICAL</text>
  <text x="42" y="84" class="title ink">How this agent actually fails</text>
  <g transform="translate(960 35)"><rect width="198" height="30" rx="15" fill="#b84d2c" opacity=".13"/><circle cx="17" cy="15" r="5" fill="#b84d2c"/><text x="30" y="19" class="pill muted">REPRODUCIBLE CASES</text></g>
  <g transform="translate(42 128)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#b84d2c" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#b84d2c">01</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">Residential rule applied to a commercial project</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">The baseline prepares the correct intake action but attaches LM-R-2026 to every case, including commercial projects</tspan><tspan x="94" dy="20">requiring LM-C-2026.</tspan></text></g><g transform="translate(42 252)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#b84d2c" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#b84d2c">02</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">Outside jurisdiction still receives the local rule</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">The route says jurisdiction_referral, but the action carries the Lakemont residential rule instead of</tspan><tspan x="94" dy="20">external_jurisdiction.</tspan></text></g><g transform="translate(42 376)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#b84d2c" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#b84d2c">03</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">Expiring intake is routed but not preserved</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">The baseline selects deadline review, resends the entire checklist, and records deadline_preserved=false with no recourse.</tspan></text></g>
  <text x="42" y="514" class="body muted">Open FAILURE_MODES.md for scenario IDs, evidence, impact, and reproduction commands.</text>
</svg>

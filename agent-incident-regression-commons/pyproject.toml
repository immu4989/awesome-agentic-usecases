[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aau-agent-incident"
version = "0.1.0"
description = "Safe public incident-to-regression evidence for AI-agent boundary failures."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Imran Ahamed" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
aau-incident = "aau_incident:main"

[tool.setuptools]
py-modules = ["aau_incident"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loss-mitigation-foreclosure-gate"
version = "0.1.0"
description = "Can an agent reconstruct application completeness, the 45-day and 37-day milestones, evaluation timing, and foreclosure holds without deciding eligibility?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
loss-mitigation-foreclosure-gate = "loss_mitigation_foreclosure_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

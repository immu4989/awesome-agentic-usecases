<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" role="img" aria-labelledby="title desc">
  <title id="title">Mortgage Loss-Mitigation and Foreclosure Protection Gate strongest headline run profile</title>
  <desc id="desc">Headline outcome, completion, latency, and measured cost for DeepSeek V4 Flash.</desc>
  <style>
    :root { color-scheme:light dark; }
    .surface { fill:#f7faf8; } .card { fill:#fff;stroke:#d9e2dd;stroke-width:1.5; }
    .ink { fill:#10231d; } .muted { fill:#52645e; } .track { fill:#e2e9e5; }
    .kicker { font:750 13px system-ui,sans-serif;letter-spacing:1.6px; } .title { font:760 28px system-ui,sans-serif; }
    .value { font:820 30px ui-monospace,SFMono-Regular,monospace; } .label { font:700 15px system-ui,sans-serif; }
    .note { font:750 10px system-ui,sans-serif;letter-spacing:1px; } .small { font:560 12px system-ui,sans-serif; }
    @media (prefers-color-scheme:dark) {
      .surface { fill:#101916; } .card { fill:#17231f;stroke:#30433c; }
      .ink { fill:#f4faf7; } .muted { fill:#b2c3bc; } .track { fill:#2a3b35; }
    }
  </style>
  <rect width="1200" height="410" rx="20" class="surface"/>
  <text x="42" y="42" class="kicker" fill="#1f7a8c">STRONGEST HEADLINE RUN · THE TRADEOFF PROFILE</text>
  <text x="42" y="84" class="title ink">DeepSeek V4 Flash</text>
  <text x="1158" y="82" text-anchor="end" class="small muted">Selected by exact decision gate · not a universal model ranking</text>
  <g transform="translate(42 145)"><rect width="258" height="190" rx="20" class="card"/><text x="24" y="36" class="note muted">HEADLINE RESULT</text><text x="24" y="88" class="value ink">75%</text><text x="24" y="119" class="label ink"><tspan x="24" dy="0">Exact decision gate</tspan></text><rect x="24" y="155" width="210" height="8" rx="4" class="track"/><rect x="24" y="155" width="220.0" height="8" rx="4" fill="#1f7a8c"/></g><g transform="translate(328 145)"><rect width="258" height="190" rx="20" class="card"/><text x="24" y="36" class="note muted">SUBMITTED</text><text x="24" y="88" class="value ink">0%</text><text x="24" y="119" class="label ink"><tspan x="24" dy="0">Decision completion</tspan></text><rect x="24" y="155" width="210" height="8" rx="4" class="track"/><rect x="24" y="155" width="3.0" height="8" rx="4" fill="#1f7a8c"/></g><g transform="translate(614 145)"><rect width="258" height="190" rx="20" class="card"/><text x="24" y="36" class="note muted">LOWER IS FASTER</text><text x="24" y="88" class="value ink">22.3s</text><text x="24" y="119" class="label ink"><tspan x="24" dy="0">Median latency</tspan></text><rect x="24" y="155" width="210" height="8" rx="4" class="track"/><rect x="24" y="155" width="220.0" height="8" rx="4" fill="#1f7a8c"/></g><g transform="translate(900 145)"><rect width="258" height="190" rx="20" class="card"/><text x="24" y="36" class="note muted">MEASURED LIST-PRICE</text><text x="24" y="88" class="value ink">$0.0010</text><text x="24" y="119" class="label ink"><tspan x="24" dy="0">Cost per scenario</tspan></text><rect x="24" y="155" width="210" height="8" rx="4" class="track"/><rect x="24" y="155" width="220.0" height="8" rx="4" fill="#1f7a8c"/></g>
  <text x="42" y="376" class="small muted">Bars show each value relative to the observed range; exact numbers come from the committed JSON result.</text>
  <text x="1158" y="376" text-anchor="end" class="small muted">24 SCENARIO RUNS IN THIS ROW</text>
</svg>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reactor-event-notification"
version = "0.1.0"
description = "Can an agent classify overlapping one-hour, four-hour, and eight-hour NRC notification paths while preserving emergency authority and truthful call receipts?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
reactor-event-notification = "reactor_event_notification_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

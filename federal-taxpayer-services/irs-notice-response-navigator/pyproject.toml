[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "irs-notice-response"
version = "0.1.0"
description = "Can an agent map a notice to the exact action, minimum evidence, delivery route, deadline, and appeal protection without giving tax advice?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
irs-notice-response = "irs_notice_response_navigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

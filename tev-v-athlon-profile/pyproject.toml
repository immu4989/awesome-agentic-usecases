[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aau-tev-v-athlon"
version = "0.1.0"
description = "Artifact-bound experimental profile for the NIST AI 200-2 initial public draft."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
aau-tevva = "aau_tevva:main"

[tool.setuptools]
py-modules = ["aau_tevva"]

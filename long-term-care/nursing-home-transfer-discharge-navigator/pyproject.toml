[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nursing-home-transfer-discharge"
version = "0.1.0"
description = "Can an agent verify an allowed transfer basis, preserve the ordinary 30-day notice or exception path, include appeal rights, and avoid treating notice as discharge?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
nursing-home-transfer-discharge = "nursing_home_transfer_discharge_navigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

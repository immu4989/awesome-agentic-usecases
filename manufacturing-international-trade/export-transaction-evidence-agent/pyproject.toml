[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "export-transaction-evidence"
version = "0.1.0"
description = "Can an agent bind item, destination, end user, end use, screening, and rule version without clearing a shipment?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
export-transaction-evidence = "export_transaction_evidence_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uscis-case-evidence"
version = "0.1.0"
description = "Can an agent explain administrative case state, organize requested evidence, preserve notices and deadlines, and avoid legal conclusions?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
uscis-case-evidence = "uscis_case_evidence_navigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiring-compliance-navigator"
version = "0.1.0"
description = "Can an employer-side agent preserve AEDT audit and notice requirements, job-related criteria, and FCRA pre-adverse rights without making the hiring decision?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
hiring-compliance-navigator = "hiring_compliance_navigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

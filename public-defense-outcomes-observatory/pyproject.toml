[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aau-public-defense-outcomes"
version = "0.1.0"
description = "Evidence-level-aware public defensive outcomes aggregation"
requires-python = ">=3.11"
license = "Apache-2.0"

[project.scripts]
aau-defense-outcomes = "aau_outcomes:main"

[tool.setuptools]
py-modules = ["aau_outcomes"]

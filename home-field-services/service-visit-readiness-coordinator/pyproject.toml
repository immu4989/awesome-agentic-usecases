[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "service-visit-readiness"
version = "0.1.0"
description = "Can an agent prepare the right technician, part, access, and appointment while diverting gas or carbon-monoxide danger away from routine service?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
service-visit-readiness = "service_visit_readiness_coordinator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

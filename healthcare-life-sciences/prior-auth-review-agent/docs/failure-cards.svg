<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Observed Prior Auth Review failure modes</title>
  <desc id="desc">Three observed, reproducible failure modes from committed evaluation runs.</desc>
  <style>
    :root { color-scheme:light dark; }
    .surface { fill:#f7faf8; } .card { fill:#fff;stroke:#d9e2dd;stroke-width:1.5; }
    .ink { fill:#10231d; } .muted { fill:#52645e; }
    .kicker { font:750 13px system-ui,sans-serif;letter-spacing:1.6px; } .title { font:750 28px system-ui,sans-serif; }
    .mode { font:850 19px ui-monospace,SFMono-Regular,monospace; } .headline { font:740 17px system-ui,sans-serif; }
    .body { font:430 14px system-ui,sans-serif; } .pill { font:750 11px system-ui,sans-serif;letter-spacing:.8px; }
    @media (prefers-color-scheme:dark) {
      .surface { fill:#101916; } .card { fill:#17231f;stroke:#30433c; }
      .ink { fill:#f4faf7; } .muted { fill:#b2c3bc; }
    }
  </style>
  <rect width="1200" height="540" rx="20" class="surface"/>
  <text x="42" y="42" class="kicker" fill="#087f8c">OBSERVED IN THE LAB · NOT HYPOTHETICAL</text>
  <text x="42" y="84" class="title ink">How this agent actually fails</text>
  <g transform="translate(960 35)"><rect width="198" height="30" rx="15" fill="#087f8c" opacity=".13"/><circle cx="17" cy="15" r="5" fill="#087f8c"/><text x="30" y="19" class="pill muted">REPRODUCIBLE CASES</text></g>
  <g transform="translate(42 128)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#087f8c" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#087f8c">01</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">The unlocked door: a clinical denial issued administratively</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">the agent has no way to issue an adverse medical-necessity determination, because CA §1367.01(k)(2), Tex. §4201.156 and</tspan><tspan x="94" dy="20">NCQA all put that behind a licensed clinician. It refuses the request through the administrative channel instead: 0.29 /…</tspan></text></g><g transform="translate(42 252)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#087f8c" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#087f8c">02</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">The record gate cannot see it</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">10/24 vs 10/24 — exactly unchanged, p = 1.00. Meanwhile the same gate takes gpt-oss&#x27;s fabricated document list from 0.33 to</tspan><tspan x="94" dy="20">0.00 across 23 refusals.</tspan></text></g><g transform="translate(42 376)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#087f8c" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#087f8c">03</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">A compound rule that contradicts itself is dropped</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">single-condition criteria get applied and the compound one gets dropped. Fourth time this repo has measured that pattern,</tspan><tspan x="94" dy="20">and the first where the two conditions point in opposite directions on the same fact.</tspan></text></g>
  <text x="42" y="514" class="body muted">Open FAILURE_MODES.md for scenario IDs, evidence, impact, and reproduction commands.</text>
</svg>

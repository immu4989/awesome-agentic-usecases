[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prior-auth-review-agent"
version = "0.1.0"
description = "Payer-side prior authorization review, where the agent may approve but legally may not deny. Measures whether the review record matches the review that produced it: criteria cited but never retrieved, documents claimed but never fetched, and unknown criteria recorded as decided."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Fnu Imran Ahamed" }]
keywords = ["agent-security", "healthcare", "prior-authorization", "utilization-management", "reporting-fidelity", "agents", "llm", "evaluation"]
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
prior-auth-review-agent = "prior_auth_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

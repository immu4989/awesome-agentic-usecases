[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "student-accommodation-navigator"
version = "0.1.0"
description = "Evaluate minimum-evidence, privacy-preserving accommodation navigation while keeping evaluation and placement decisions human-owned."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["agents", "llm", "evaluation", "education", "accessibility", "section-504", "privacy", "public-value"]
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
student-accommodation-navigator = "student_accommodation_navigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

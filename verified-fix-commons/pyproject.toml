[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aau-verified-fix"
version = "0.1.0"
description = "Offline safe-fixture evaluator and evidence pack builder for reproducible cyber fix claims."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Imran Ahamed" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
aau-fix = "aau_fix:main"

[tool.setuptools]
py-modules = ["aau_fix"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unemployment-claim-navigator"
version = "0.1.0"
description = "Evaluate whether a claim navigator preserves appeal and weekly-certification paths without deciding unemployment eligibility."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["agents", "llm", "evaluation", "unemployment", "appeals", "public-value", "social-insurance"]
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
unemployment-claim-navigator = "unemployment_claim_navigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

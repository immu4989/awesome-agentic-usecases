[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "household-energy-lifeline"
version = "0.1.0"
description = "Evaluate whether an energy-service navigator preserves essential-service options without inventing eligibility or adding burden."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["agents", "llm", "evaluation", "energy", "utilities", "liheap", "public-value", "service-continuity"]
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
household-energy-lifeline = "household_energy_lifeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

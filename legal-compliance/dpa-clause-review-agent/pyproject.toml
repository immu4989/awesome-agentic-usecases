[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dpa-clause-review-agent"
version = "0.1.0"
description = "Contract review of a counterparty data processing agreement against GDPR Article 28(3), whose eight mandatory terms are statute rather than policy. Measures whether the review record matches the review: clauses reported reviewed but never read, language attributed to a clause it does not appear in, and mandatory terms that are absent entirely being reported clean."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Fnu Imran Ahamed" }]
keywords = ["agent-security", "legal", "contract-review", "gdpr", "reporting-fidelity", "agents", "llm", "evaluation"]
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
dpa-clause-review-agent = "dpa_clause_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

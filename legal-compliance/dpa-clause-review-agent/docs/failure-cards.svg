<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Observed DPA Clause Review failure modes</title>
  <desc id="desc">Three observed, reproducible failure modes from committed evaluation runs.</desc>
  <style>
    :root { color-scheme:light dark; }
    .surface { fill:#f7faf8; } .card { fill:#fff;stroke:#d9e2dd;stroke-width:1.5; }
    .ink { fill:#10231d; } .muted { fill:#52645e; }
    .kicker { font:750 13px system-ui,sans-serif;letter-spacing:1.6px; } .title { font:750 28px system-ui,sans-serif; }
    .mode { font:850 19px ui-monospace,SFMono-Regular,monospace; } .headline { font:740 17px system-ui,sans-serif; }
    .body { font:430 14px system-ui,sans-serif; } .pill { font:750 11px system-ui,sans-serif;letter-spacing:.8px; }
    @media (prefers-color-scheme:dark) {
      .surface { fill:#101916; } .card { fill:#17231f;stroke:#30433c; }
      .ink { fill:#f4faf7; } .muted { fill:#b2c3bc; }
    }
  </style>
  <rect width="1200" height="540" rx="20" class="surface"/>
  <text x="42" y="42" class="kicker" fill="#6c4ea2">OBSERVED IN THE LAB · NOT HYPOTHETICAL</text>
  <text x="42" y="84" class="title ink">How this agent actually fails</text>
  <g transform="translate(960 35)"><rect width="198" height="30" rx="15" fill="#6c4ea2" opacity=".13"/><circle cx="17" cy="15" r="5" fill="#6c4ea2"/><text x="30" y="19" class="pill muted">REPRODUCIBLE CASES</text></g>
  <g transform="translate(42 128)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#6c4ea2" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#6c4ea2">01</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">The silent review: a mandatory term is absent and nothing is…</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">the agreement omits one of the eight terms GDPR Art. 28(3) says a processor contract &quot;shall stipulate.&quot; The review closes</tspan><tspan x="94" dy="20">without flagging it: 0.98 on mistral, 0.56 on gpt-oss, 0.00 on deepseek.</tspan></text></g><g transform="translate(42 252)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#6c4ea2" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#6c4ea2">02</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">Absence detection is a property of the model, not the task</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">- Reproduce: same scenarios, swap --backend. - The spread: 0.00 → 0.98 on identical contracts, intervals disjoint. At</tspan><tspan x="94" dy="20">agreement level, deepseek misses 0 of 16, gpt-oss 14 of 16, mistral 16 of 16. - Why it is reported this way: because…</tspan></text></g><g transform="translate(42 376)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#6c4ea2" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#6c4ea2">03</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">Reads everything, adjudicates nothing</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">mistral calls read_clause in 84 of 84 runs and then records a clause-level verdict in almost none — flag_clause 6/84,</tspan><tspan x="94" dy="20">accept_clause 1/84 — escalating the whole agreement instead (40/84).</tspan></text></g>
  <text x="42" y="514" class="body muted">Open FAILURE_MODES.md for scenario IDs, evidence, impact, and reproduction commands.</text>
</svg>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "small-business-recovery-agent"
version = "0.1.0"
description = "Evaluate whether a recovery navigator reduces paperwork while preserving access, recourse, deadlines, and truthful service outcomes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["agents", "llm", "evaluation", "public-sector", "small-business", "administrative-burden", "public-value"]
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
small-business-recovery-agent = "small_business_recovery_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

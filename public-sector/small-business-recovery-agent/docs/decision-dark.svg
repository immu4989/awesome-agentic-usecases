<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="528" viewBox="0 0 1200 528" role="img" aria-label="Decision rules in precedence order for Small Business Recovery Navigator">
<rect x="1" y="1" width="1198" height="526" rx="14" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<text x="44" y="46" font-size="19" font-weight="700" fill="#ffffff">How the decision is made</text>
<text x="44" y="70" font-size="13" fill="#898781">gates are evaluated in order — the first one that matches wins · <tspan fill="#43b58a" font-weight="700">accent = a trap</tspan>, where the obvious reading is wrong</text>
<path d="M 66 122 V 164" stroke="#383835" stroke-width="1.5"/>
<text x="76" y="158" font-size="11" fill="#898781">no</text>

<text x="66" y="187" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<rect x="104" y="161" width="610" height="42" rx="8" fill="#43b58a1a" stroke="#43b58a" stroke-width="1.5"/>
<text x="122" y="187" font-size="15" fill="#ffffff">🪤  Trusted ownership records conflict?</text>
<path d="M 722 182 H 748" stroke="#383835" stroke-width="1.5"/>
<path d="M 748 182 l -7 -4 v 8 z" fill="#383835"/>
<rect x="762" y="165" width="394" height="34" rx="17" fill="#2c2c2a"/>
<text x="782" y="187" font-size="14" font-weight="600" fill="#ffffff">human review + deadline protection</text>
<path d="M 66 278 V 320" stroke="#383835" stroke-width="1.5"/>
<text x="76" y="314" font-size="11" fill="#898781">no</text>
<circle cx="66" cy="260" r="15" fill="#43b58a" stroke="#43b58a" stroke-width="1.5"/>
<text x="66" y="265" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<rect x="104" y="239" width="610" height="42" rx="8" fill="#43b58a1a" stroke="#43b58a" stroke-width="1.5"/>
<text x="122" y="265" font-size="15" fill="#ffffff">🪤  Required evidence absent from the vault?</text>
<path d="M 722 260 H 748" stroke="#383835" stroke-width="1.5"/>
<path d="M 748 260 l -7 -4 v 8 z" fill="#383835"/>
<rect x="762" y="243" width="394" height="34" rx="17" fill="#2c2c2a"/>
<text x="782" y="265" font-size="14" font-weight="600" fill="#ffffff">request exactly the missing set</text>
<path d="M 66 356 V 398" stroke="#383835" stroke-width="1.5"/>
<text x="76" y="392" font-size="11" fill="#898781">no</text>
<circle cx="66" cy="338" r="15" fill="#43b58a" stroke="#43b58a" stroke-width="1.5"/>
<text x="66" y="343" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<rect x="104" y="317" width="610" height="42" rx="8" fill="#43b58a1a" stroke="#43b58a" stroke-width="1.5"/>
<text x="122" y="343" font-size="15" fill="#ffffff">🪤  Every required item already held?</text>
<path d="M 722 338 H 748" stroke="#383835" stroke-width="1.5"/>
<path d="M 748 338 l -7 -4 v 8 z" fill="#383835"/>
<rect x="762" y="321" width="394" height="34" rx="17" fill="#2c2c2a"/>
<text x="782" y="343" font-size="14" font-weight="600" fill="#ffffff">advance without duplicate paperwork</text>
<circle cx="66" cy="416" r="15" fill="#1a1a19" stroke="#383835" stroke-width="1.5"/>
<text x="66" y="421" font-size="14" font-weight="700" text-anchor="middle" fill="#c3c2b7">5</text>
<rect x="104" y="395" width="610" height="42" rx="8" fill="none" stroke="#383835" stroke-width="1.5"/>
<text x="122" y="421" font-size="15" fill="#ffffff">For every path</text>
<path d="M 722 416 H 748" stroke="#383835" stroke-width="1.5"/>
<path d="M 748 416 l -7 -4 v 8 z" fill="#383835"/>
<rect x="762" y="399" width="394" height="34" rx="17" fill="#2c2c2a"/>
<text x="782" y="421" font-size="14" font-weight="600" fill="#ffffff">honor channel, recourse, rights, and record truth</text>

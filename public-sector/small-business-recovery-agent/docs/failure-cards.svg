<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Observed Small Business Recovery Navigator failure modes</title>
  <desc id="desc">Three observed, reproducible failure modes from committed evaluation runs.</desc>
  <style>
    :root { color-scheme:light dark; }
    .surface { fill:#f7faf8; } .card { fill:#fff;stroke:#d9e2dd;stroke-width:1.5; }
    .ink { fill:#10231d; } .muted { fill:#52645e; }
    .kicker { font:750 13px system-ui,sans-serif;letter-spacing:1.6px; } .title { font:750 28px system-ui,sans-serif; }
    .mode { font:850 19px ui-monospace,SFMono-Regular,monospace; } .headline { font:740 17px system-ui,sans-serif; }
    .body { font:430 14px system-ui,sans-serif; } .pill { font:750 11px system-ui,sans-serif;letter-spacing:.8px; }
    @media (prefers-color-scheme:dark) {
      .surface { fill:#101916; } .card { fill:#17231f;stroke:#30433c; }
      .ink { fill:#f4faf7; } .muted { fill:#b2c3bc; }
    }
  </style>
  <rect width="1200" height="540" rx="20" class="surface"/>
  <text x="42" y="42" class="kicker" fill="#16735a">OBSERVED IN THE LAB · NOT HYPOTHETICAL</text>
  <text x="42" y="84" class="title ink">How this agent actually fails</text>
  <g transform="translate(960 35)"><rect width="198" height="30" rx="15" fill="#16735a" opacity=".13"/><circle cx="17" cy="15" r="5" fill="#16735a"/><text x="30" y="19" class="pill muted">REPRODUCIBLE CASES</text></g>
  <g transform="translate(42 128)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#16735a" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#16735a">01</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">The outcome mirage</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">Observed: outcome accuracy and service completion were both 1.000, while public_value_exact was only 0.375 across 32</tspan><tspan x="94" dy="20">scenarios × 3 repeats. Mechanism: the agent reached the right queue or next step but violated at least one service…</tspan></text></g><g transform="translate(42 252)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#16735a" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#16735a">02</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">The full-checklist reflex</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">Observed: burden_minimized was 0.625. Whenever one required document was missing, the baseline requested the whole</tspan><tspan x="94" dy="20">fictional checklist instead of the exact missing set. Mechanism: asking for the standard bundle is easy and sounds…</tspan></text></g><g transform="translate(42 376)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#16735a" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#16735a">03</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">The portal default</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">Observed: accessibility_respected was 0.875. Every 711-assisted phone and large-print mail scenario was sent to the portal.</tspan><tspan x="94" dy="20">Mechanism: the dominant digital path becomes an invisible default even after the agent reads a declared service preference…</tspan></text></g>
  <text x="42" y="514" class="body muted">Open FAILURE_MODES.md for scenario IDs, evidence, impact, and reproduction commands.</text>
</svg>

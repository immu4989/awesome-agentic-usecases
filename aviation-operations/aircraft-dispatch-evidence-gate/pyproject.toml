[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aircraft-dispatch-gate"
version = "0.1.0"
description = "Can an agent apply the approved aircraft-specific MEL and operations limitations without turning a deferral packet into a dispatch release?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
aircraft-dispatch-gate = "aircraft_dispatch_evidence_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aau-essential-service-defender"
version = "0.1.0"
description = "Offline, gap-visible AI-agent defender kits for essential services."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Imran Ahamed" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
aau-defender = "aau_defender:main"

[tool.setuptools]
py-modules = ["aau_defender"]

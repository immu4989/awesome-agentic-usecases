[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-return-completeness"
version = "0.1.0"
description = "Can an agent detect a missing required form, bind the correct filing-year instructions, preserve authorization and deadline evidence, and stop before transmitting a return?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
tax-return-completeness = "tax_return_completeness_navigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

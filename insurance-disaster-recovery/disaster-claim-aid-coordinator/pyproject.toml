[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disaster-claim-aid-coordinator"
version = "0.1.0"
description = "Evaluate whether an agent coordinates insurance and disaster aid without duplicate burden, hidden compensation, or invented entitlement."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["agents", "llm", "evaluation", "insurance", "disaster-recovery", "public-value", "duplication-of-benefits"]
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
disaster-claim-aid-coordinator = "disaster_claim_aid_coordinator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

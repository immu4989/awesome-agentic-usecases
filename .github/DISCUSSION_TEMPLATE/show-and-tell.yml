title: "[adaptation] <industry>: <what you evaluated>"
body:
  - type: markdown
    attributes:
      value: |
        Share a fork, evaluation result, or domain adaptation so others can reproduce and
        improve it. Do not include private, regulated, or identifying data.
  - type: input
    id: starting-case
    attributes:
      label: Starting use case
      description: Which verified AAU lab or contract did you adapt?
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What changed?
      description: Describe the domain rules, tools, scenario generator, or intervention you changed.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproducible evidence
      description: Link the code and state the scenario count, repeats, model, metric, and observed failure.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safe sharing
      options:
        - label: The shared material uses synthetic or public data and contains no secrets or personal data.
          required: true

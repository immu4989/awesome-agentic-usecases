title: "[question] <short question>"
body:
  - type: markdown
    attributes:
      value: |
        Ask about choosing, running, interpreting, or adapting a verified use case. For a
        missing industry workflow, use the **Request a verified use case** issue form.
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Choosing a use case
        - Running an evaluation
        - Interpreting results
        - Adapting or contributing
        - Contracts and failure patterns
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Include the use-case path, command, or result file when relevant.
    validations:
      required: true

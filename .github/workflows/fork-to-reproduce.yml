name: Fork-to-Reproduce submission

on:
  workflow_dispatch:
    inputs:
      workspace_path:
        description: Prepared workspace path below your checkout (contains .aau/, responses.json, metadata.json)
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-attest:
    name: Validate, bind, and attest the oracle-free submission
    runs-on: ubuntu-latest
    env:
      AAU_WORKSPACE_PATH: ${{ inputs.workspace_path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify campaign and workflow trust boundaries
        run: python reproduction-challenges/submit.py verify-campaign
      - name: Verify workspace origin and build the challenge-bound public submission
        run: |
          mkdir -p .dist
          python reproduction-challenges/submit.py build-prepared \
            "$AAU_WORKSPACE_PATH" \
            --out .dist/reproduction-submission.json
          python reproduction-challenges/submit.py build-receipt \
            "$AAU_WORKSPACE_PATH" \
            --out .dist/reproduction-verification.json
          sha256sum .dist/reproduction-submission.json \
            .dist/reproduction-verification.json > .dist/SHA256SUMS
      - name: Attest the exact submission and verification receipt bytes in this fork
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-path: |
            .dist/reproduction-submission.json
            .dist/reproduction-verification.json
      - name: Upload the submission, verification receipt, and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aau-reproduction-submission
          path: |
            .dist/reproduction-submission.json
            .dist/reproduction-verification.json
            .dist/SHA256SUMS
          if-no-files-found: error

name: Publish use-case explorer

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/explorer.css"
      - "docs/explorer.js"
      - "docs/use-cases.json"
      - "docs/assets/social-card.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy explorer
        id: deployment
        uses: actions/deploy-pages@v4

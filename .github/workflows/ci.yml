name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    name: Public catalog integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install editorial linter
        run: python -m pip install codespell==2.4.1
      - name: Repository spelling is clean
        run: |
          codespell
          python docs/check_editorial.py
      - name: Workflow supply chain is immutable and least privilege
        run: python docs/check_supply_chain.py
      - name: Catalog, README, package, and CI coverage agree
        run: python docs/check_catalog.py
      - name: AAU Studio evidence and interactions are current
        run: |
          python docs/make_studio_data.py
          python docs/check_studio.py
          git diff --exit-code docs/studio-data.json
      - name: AAU Forge creates and verifies a runnable lab
        run: |
          python -m pip install -e harness[dev]
          for spec in decision-gate rights-continuity critical-event-fanout; do
            python -m aau_harness.forge "docs/forge-examples/studio-spec.$spec.json" \
              --name "$spec-forge-lab" \
              --root "$RUNNER_TEMP/forge-$spec" \
              --source-root .
          done
      - name: Agent Boundary Protocol stays offline, deterministic, and fail closed
        run: |
          PYTHONPATH=agentic-cyber-resilience pytest agentic-cyber-resilience/tests -q
          python agentic-cyber-resilience/aau_boundary.py validate agentic-cyber-resilience/examples/synthetic-critical-infrastructure-profile.json
          python agentic-cyber-resilience/aau_boundary.py evaluate agentic-cyber-resilience/examples/synthetic-critical-infrastructure-profile.json agentic-cyber-resilience/evals/boundary-scenarios.jsonl --out "$RUNNER_TEMP/agent-boundary-receipt.json"
          python agentic-cyber-resilience/aau_boundary.py verify "$RUNNER_TEMP/agent-boundary-receipt.json" --profile agentic-cyber-resilience/examples/synthetic-critical-infrastructure-profile.json --scenarios agentic-cyber-resilience/evals/boundary-scenarios.jsonl
          ruff check agentic-cyber-resilience
      - name: Agent Security Commons controls, exercises, and claims are reproducible
        run: |
          PYTHONPATH=agentic-cyber-resilience pytest agentic-cyber-resilience/tests/test_aau_runtime.py -q
          PYTHONPATH=agent-incident-regression-commons pytest agent-incident-regression-commons/tests -q
          PYTHONPATH=essential-services-defender-kits pytest essential-services-defender-kits/tests -q
          PYTHONPATH=agent-control-observatory pytest agent-control-observatory/tests -q
          PYTHONPATH=public-value-pilot-network pytest public-value-pilot-network/tests -q
          python agentic-cyber-resilience/aau_runtime.py evaluate agentic-cyber-resilience/examples/synthetic-critical-infrastructure-profile.json agentic-cyber-resilience/evals/runtime-conformance-suite.json --out "$RUNNER_TEMP/aau-runtime-receipt.json"
          python agentic-cyber-resilience/aau_runtime.py verify "$RUNNER_TEMP/aau-runtime-receipt.json" --profile agentic-cyber-resilience/examples/synthetic-critical-infrastructure-profile.json --suite agentic-cyber-resilience/evals/runtime-conformance-suite.json
          python agent-incident-regression-commons/aau_incident.py evaluate agent-incident-regression-commons/examples/public-agent-boundary-incident.json --out "$RUNNER_TEMP/aau-incident-receipt.json"
          python agent-incident-regression-commons/aau_incident.py verify "$RUNNER_TEMP/aau-incident-receipt.json" --incident agent-incident-regression-commons/examples/public-agent-boundary-incident.json
          for kit in essential-services-defender-kits/kits/*.json; do
            kit_name="$(basename "$kit" .json)"
            python essential-services-defender-kits/aau_defender.py assess "$kit" --out "$RUNNER_TEMP/$kit_name-assessment.json"
            python essential-services-defender-kits/aau_defender.py verify "$RUNNER_TEMP/$kit_name-assessment.json" --kit "$kit"
          done
          python agent-control-observatory/aau_observatory.py evaluate agent-control-observatory/experiments/authority-control-ladder.json --out "$RUNNER_TEMP/aau-control-report.json"
          python agent-control-observatory/aau_observatory.py verify "$RUNNER_TEMP/aau-control-report.json" --experiment agent-control-observatory/experiments/authority-control-ladder.json
          python public-value-pilot-network/aau_pilot_network.py assess public-value-pilot-network/pilots/foia-routing-partner-call.json --out "$RUNNER_TEMP/aau-pilot-assessment.json"
          python public-value-pilot-network/aau_pilot_network.py verify "$RUNNER_TEMP/aau-pilot-assessment.json" --pilot public-value-pilot-network/pilots/foia-routing-partner-call.json
          python docs/make_agent_security_data.py
          python docs/check_agent_security.py
          ruff check agentic-cyber-resilience agent-incident-regression-commons essential-services-defender-kits agent-control-observatory public-value-pilot-network docs/make_agent_security_data.py docs/check_agent_security.py
          git diff --exit-code docs/agent-security-data.json
      - name: Portable Agent Assurance and TEVV evidence are reproducible
        run: |
          pytest portable-agent-assurance/tests tev-v-athlon-profile/tests -q
          python portable-agent-assurance/aau_assurance.py validate portable-agent-assurance/examples/synthetic-assurance-envelope.json
          python portable-agent-assurance/aau_assurance.py evaluate portable-agent-assurance/examples/synthetic-assurance-envelope.json portable-agent-assurance/examples/mcp-a2a-conformance-suite.json --out "$RUNNER_TEMP/aau-assurance-receipt.json"
          python portable-agent-assurance/aau_assurance.py verify "$RUNNER_TEMP/aau-assurance-receipt.json" --envelope portable-agent-assurance/examples/synthetic-assurance-envelope.json --suite portable-agent-assurance/examples/mcp-a2a-conformance-suite.json
          python portable-agent-assurance/aau_assurance.py pack portable-agent-assurance/examples/synthetic-assurance-envelope.json portable-agent-assurance/examples/mcp-a2a-conformance-suite.json --out "$RUNNER_TEMP/aau-assurance-pack"
          python portable-agent-assurance/aau_assurance.py verify-pack "$RUNNER_TEMP/aau-assurance-pack"
          python portable-agent-assurance/aau_assurance.py verify-pack portable-agent-assurance/examples/reference-pack
          python tev-v-athlon-profile/aau_tevva.py validate tev-v-athlon-profile/examples/agent-assurance-tevva.json
          python tev-v-athlon-profile/aau_tevva.py assess tev-v-athlon-profile/examples/agent-assurance-tevva.json --root . --out "$RUNNER_TEMP/aau-tevva-assessment.json"
          python tev-v-athlon-profile/aau_tevva.py pack tev-v-athlon-profile/examples/agent-assurance-tevva.json --root . --out "$RUNNER_TEMP/aau-tevva-pack"
          python tev-v-athlon-profile/aau_tevva.py verify-pack "$RUNNER_TEMP/aau-tevva-pack"
          python tev-v-athlon-profile/aau_tevva.py verify-pack tev-v-athlon-profile/examples/reference-pack
          python docs/make_assurance_data.py
          python docs/check_assurance.py
          node --check docs/assurance.js
          ruff check portable-agent-assurance tev-v-athlon-profile docs/make_assurance_data.py docs/check_assurance.py
          git diff --exit-code docs/assurance-data.json portable-agent-assurance/examples/reference-pack tev-v-athlon-profile/examples/reference-pack
      - name: Agent releases, authority BOMs, outside reproduction, incidents, and source freshness are verifiable
        run: |
          pytest harness/tests/test_release_gate.py harness/tests/test_agent_bom.py -q
          python -m aau_harness.release_gate verify agent-release-gate/examples/reference-pack
          python -m aau_harness.release_gate assess agent-release-gate/examples/baseline/release-manifest.json agent-release-gate/examples/candidate/release-manifest.json agent-release-gate/examples/release-policy.json agent-release-gate/examples/evidence-plan.json --command "python agent-release-gate/examples/reference_adapter.py" --approval agent-release-gate/examples/approval.json --out "$RUNNER_TEMP/aau-release-pack"
          python -m aau_harness.release_gate verify "$RUNNER_TEMP/aau-release-pack"
          python -m aau_harness.agent_bom validate agent-capability-bom/examples/candidate.json
          python -m aau_harness.agent_bom diff agent-capability-bom/examples/baseline.json agent-capability-bom/examples/candidate.json --out "$RUNNER_TEMP/aau-agent-bom-diff.json"
          cmp "$RUNNER_TEMP/aau-agent-bom-diff.json" agent-capability-bom/examples/reference-diff.json
          python -m aau_harness.agent_bom verify agent-capability-bom/examples/reference-pack
          python -m aau_harness.agent_bom pack agent-capability-bom/examples/candidate.json --out "$RUNNER_TEMP/aau-agent-bom-pack"
          python -m aau_harness.agent_bom verify "$RUNNER_TEMP/aau-agent-bom-pack"
          python -m aau_harness.agent_bom plan-reduction agent-capability-bom/examples/candidate.json agent-capability-bom/examples/authority-observation.json --out "$RUNNER_TEMP/aau-authority-reduction-plan.json"
          cmp "$RUNNER_TEMP/aau-authority-reduction-plan.json" agent-capability-bom/examples/reference-reduction-plan.json
          python -m aau_harness.agent_bom verify-reduction-plan agent-capability-bom/examples/reference-reduction-plan.json agent-capability-bom/examples/candidate.json agent-capability-bom/examples/authority-observation.json
          python reproduction-challenges/submit.py verify-campaign
          PYTHONPATH=agent-incident-exchange pytest agent-incident-exchange/tests -q
          python agent-incident-exchange/make_exchange.py
          python agent-incident-exchange/aau_incident_exchange.py verify-pack agent-incident-exchange/examples/reference-pack --root .
          python policy-freshness/aau_freshness.py validate policy-freshness/sources.json --root .
          python policy-freshness/aau_freshness.py offline policy-freshness/sources.json --root . --as-of 2026-08-30 --out "$RUNNER_TEMP/policy-freshness-offline.json"
          pytest policy-freshness/tests -q
          python docs/make_release_gate_data.py
          python docs/check_release_gate.py
          node --check docs/release-gate.js
          ruff check harness/src/aau_harness/release_gate.py harness/src/aau_harness/agent_bom.py harness/tests/test_release_gate.py harness/tests/test_agent_bom.py agent-release-gate agent-capability-bom agent-incident-exchange reproduction-challenges policy-freshness docs/make_release_gate_data.py docs/check_release_gate.py
          git diff --exit-code agent-incident-exchange/examples/reference-exchange.json docs/release-gate-data.json agent-release-gate/examples/reference-pack agent-incident-exchange/examples/reference-pack
      - name: Collective Cyber Defense fixes, containment, continuity, and public evidence are reproducible
        run: |
          PYTHONPATH=verified-fix-commons pytest verified-fix-commons/tests -q
          PYTHONPATH=agent-containment-drills pytest agent-containment-drills/tests -q
          PYTHONPATH=essential-service-defender-box pytest essential-service-defender-box/tests -q
          PYTHONPATH=frontier-defense-benchmark pytest frontier-defense-benchmark/tests -q
          PYTHONPATH=cyber-defense-evidence-mesh:independent-reproduction-exchange pytest cyber-defense-evidence-mesh/tests -q
          PYTHONPATH=public-defense-outcomes-observatory pytest public-defense-outcomes-observatory/tests -q
          PYTHONPATH=independent-reproduction-exchange pytest independent-reproduction-exchange/tests -q
          for fix in verified-fix-commons/examples/*.json; do
            fix_name="$(basename "$fix" .json)"
            python verified-fix-commons/aau_fix.py evaluate "$fix" --out "$RUNNER_TEMP/$fix_name-receipt.json"
            python verified-fix-commons/aau_fix.py verify "$RUNNER_TEMP/$fix_name-receipt.json" --contract "$fix"
          done
          python agent-containment-drills/aau_containment.py evaluate agent-containment-drills/examples/reference-containment-drill.json --out "$RUNNER_TEMP/containment-receipt.json"
          python agent-containment-drills/aau_containment.py verify "$RUNNER_TEMP/containment-receipt.json" --drill agent-containment-drills/examples/reference-containment-drill.json
          python essential-service-defender-box/aau_defender_box.py assess essential-service-defender-box/examples/community-water-reference-campaign.json --out "$RUNNER_TEMP/defender-assessment.json"
          python essential-service-defender-box/aau_defender_box.py verify "$RUNNER_TEMP/defender-assessment.json" --campaign essential-service-defender-box/examples/community-water-reference-campaign.json
          python frontier-defense-benchmark/aau_defense_benchmark.py evaluate frontier-defense-benchmark/examples/collective-defense-suite.json frontier-defense-benchmark/examples/reference-protocol-responses.json --out "$RUNNER_TEMP/defense-benchmark-receipt.json"
          python frontier-defense-benchmark/aau_defense_benchmark.py verify "$RUNNER_TEMP/defense-benchmark-receipt.json" --suite frontier-defense-benchmark/examples/collective-defense-suite.json --responses frontier-defense-benchmark/examples/reference-protocol-responses.json
          python docs/make_collective_cyber_data.py
          python docs/check_collective_cyber.py
          python independent-reproduction-exchange/aau_reproduction.py verify-pack independent-reproduction-exchange/examples/revealed-protocol-demo
          python cyber-defense-evidence-mesh/aau_evidence_mesh.py build cyber-defense-evidence-mesh/examples/reference-mesh.json --out "$RUNNER_TEMP/defense-mesh"
          python cyber-defense-evidence-mesh/aau_evidence_mesh.py verify-pack "$RUNNER_TEMP/defense-mesh"
          python public-defense-outcomes-observatory/aau_outcomes.py evaluate "$RUNNER_TEMP/defense-mesh/evidence-index.json" --out "$RUNNER_TEMP/defense-outcomes.json"
          python public-defense-outcomes-observatory/aau_outcomes.py verify "$RUNNER_TEMP/defense-outcomes.json" --index "$RUNNER_TEMP/defense-mesh/evidence-index.json"
          node --check docs/collective-cyber-defense.js
          ruff check verified-fix-commons agent-containment-drills essential-service-defender-box frontier-defense-benchmark cyber-defense-evidence-mesh public-defense-outcomes-observatory independent-reproduction-exchange docs/make_collective_cyber_data.py docs/check_collective_cyber.py
          git diff --exit-code docs/collective-cyber-defense-data.json cyber-defense-evidence-mesh/examples independent-reproduction-exchange/examples/revealed-protocol-demo
      - name: Community Forge Gallery derives trust from evidence
        run: |
          python docs/make_gallery_data.py
          python docs/check_gallery.py
          git diff --exit-code docs/gallery-data.json
      - name: Reliability Challenge missions and scoreboard are evidence-derived
        run: |
          python docs/make_challenge_data.py
          python docs/check_challenge.py
          git diff --exit-code docs/challenge-data.json
      - name: Interactive playground traces are evidence-derived
        run: |
          python docs/make_playground_data.py
          python docs/make_playground_launch_assets.py
          python docs/check_playground.py
          git diff --exit-code docs/playground-data.json docs/assets/playground-launch
      - name: Boundary Lab pairs are source-locked and current
        run: |
          python docs/make_boundary_lab_data.py
          python docs/check_boundary_lab.py
          git diff --exit-code docs/boundary-data.json docs/assets/boundary-lab.svg
      - name: Boundary Builder templates and export contract are current
        run: |
          python docs/make_boundary_builder_data.py
          python docs/check_boundary_builder.py
          git diff --exit-code docs/boundary-builder-data.json docs/assets/boundary-builder.svg
      - name: Receipt Lab source bindings and local inspector are current
        run: |
          python docs/make_receipt_lab_data.py
          python docs/check_receipt_lab.py
          node --check docs/receipt-lab.js
          git diff --exit-code docs/receipt-lab-data.json docs/assets/receipt-lab.svg
      - name: Federal Mission Assurance profile, pack, and local Studio are current
        run: |
          python docs/make_federal_mission_data.py
          python docs/check_federal_mission.py
          python federal-mission-assurance/aau_federal.py validate federal-mission-assurance/example-acquisition-profile.json
          pytest federal-mission-assurance/tests -q
          node --check docs/federal-mission.js
          git diff --exit-code docs/federal-mission-data.json docs/federal-profile.schema.json docs/assets/federal-mission.svg
      - name: Federal Pilot Kit exchanges and local inspection desk are current
        run: |
          python docs/make_federal_pilot_data.py
          python docs/check_federal_pilot.py
          python federal-pilot-kit/aau_pilot.py assess federal-pilot-kit/examples/benefits-correspondence/agency-intake.json federal-pilot-kit/examples/benefits-correspondence/vendor-response.json federal-pilot-kit/examples/benefits-correspondence/acceptance-tests.json
          python federal-pilot-kit/aau_pilot.py scan-lesson federal-pilot-kit/lessons/examples/benefits-accessibility-change.json
          python federal-pilot-kit/aau_pilot.py policy-drift federal-pilot-kit/lessons/examples/benefits-accessibility-change.json --as-of 2026-08-19
          python federal-pilot-kit/aau_pilot.py closeout federal-pilot-kit/examples/benefits-correspondence/agency-intake.json federal-pilot-kit/examples/benefits-correspondence/vendor-response.json federal-pilot-kit/examples/benefits-correspondence/acceptance-tests.json federal-pilot-kit/lessons/examples/benefits-accessibility-change.json --out "$RUNNER_TEMP/federal-pilot-closeout"
          python federal-pilot-kit/aau_pilot.py verify-closeout "$RUNNER_TEMP/federal-pilot-closeout"
          pytest federal-pilot-kit/tests -q
          python federal-pilot-kit/tools/build_release.py --version 0.4.0 --source-revision 0000000000000000000000000000000000000000 --source-date 2026-08-19T00:00:00Z --output "$RUNNER_TEMP/federal-pilot-release"
          python federal-pilot-kit/verify_release.py "$RUNNER_TEMP/federal-pilot-release"
          node --check docs/federal-pilot.js
          git diff --exit-code docs/federal-pilot-data.json docs/federal-pilot-agency.schema.json docs/federal-pilot-vendor.schema.json docs/federal-pilot-tests.schema.json docs/federal-ai-lesson.schema.json docs/assets/federal-pilot.svg docs/assets/lessons-exchange.svg
      - name: Federal AI Portfolio contracts, pack, and local Observatory are current
        run: |
          python docs/make_federal_portfolio_data.py
          python docs/check_federal_portfolio.py
          python federal-portfolio-observatory/aau_portfolio.py validate inventory federal-portfolio-observatory/examples/synthetic-agency-inventory.json
          python federal-portfolio-observatory/aau_portfolio.py policy-drift --as-of 2026-08-23
          python federal-portfolio-observatory/aau_portfolio.py pack federal-portfolio-observatory/examples/synthetic-agency-inventory.json federal-portfolio-observatory/examples/public-value-ledger.json federal-portfolio-observatory/examples/three-layer-tev-v-plan.json federal-portfolio-observatory/examples/clause-testbench.json --out "$RUNNER_TEMP/federal-portfolio-pack"
          python federal-portfolio-observatory/aau_portfolio.py verify-pack "$RUNNER_TEMP/federal-portfolio-pack"
          pytest federal-portfolio-observatory/tests -q
          python federal-portfolio-observatory/tools/build_release.py --version 0.5.0 --source-revision 0000000000000000000000000000000000000000 --source-date 2026-08-23T00:00:00Z --output "$RUNNER_TEMP/federal-portfolio-release"
          python federal-portfolio-observatory/verify_release.py "$RUNNER_TEMP/federal-portfolio-release"
          node --check docs/federal-portfolio.js
          git diff --exit-code docs/federal-portfolio-data.json docs/federal-ai-portfolio.schema.json docs/public-value-ledger.schema.json docs/three-layer-tev-v.schema.json docs/clause-testbench.schema.json docs/assets/federal-portfolio.svg
      - name: Existing agents connect through the provider-neutral gateway
        run: |
          aau evaluate harness/examples/byo-agent-suite.json --command "python harness/examples/byo_agent_adapter.py" --out "$RUNNER_TEMP/aau-agent-receipt.json"
          pytest harness/tests/test_evaluate.py -q
          python harness/tools/check_release_version.py harness-v1.6.0
      - name: Agent Evidence Starter is runnable, private by default, and browser-synchronized
        run: |
          python docs/make_agent_starter_data.py
          python docs/make_agent_starter_examples.py
          python docs/check_agent_starter.py
          pytest harness/tests/test_starter.py -q
          node --check docs/agent-starter.js
          git diff --exit-code docs/agent-starter-data.json docs/assets/agent-starter.svg agent-evidence-starter/examples
      - name: Community evidence levels are derived, privacy-bounded, and browser-synchronized
        run: |
          python docs/make_community_evidence_data.py
          python docs/check_community_evidence.py
          pytest harness/tests/test_submission.py -q
          node --check docs/community-evidence.js
          git diff --exit-code docs/community-evidence-data.json docs/assets/community-evidence-loop.svg
      - name: Human baselines are blinded, aggregate-only, and browser-synchronized
        run: |
          python docs/make_human_baseline_data.py
          python docs/check_human_baseline.py
          pytest harness/tests/test_human_baseline.py -q
          node --check docs/human-baseline.js
          git diff --exit-code human-baseline-lab/reference-pack human-baseline-lab/sessions human-baseline-lab/reference-agent-receipt.json human-baseline-lab/reference-report.json docs/human-baseline-data.json docs/assets/human-baseline.svg
      - name: Impact Capsules keep public-value evidence and gaps artifact-bound
        run: |
          python docs/make_evidence_commons_data.py
          python docs/check_evidence_commons.py
          pytest harness/tests/test_evidence_commons.py -q
          node --check docs/evidence-commons.js
          git diff --exit-code evidence-commons/capsules evidence-commons/reference-suites docs/evidence-commons-data.json docs/assets/evidence-commons.svg
      - name: State of Agent Reliability is derived from committed evidence
        run: |
          python docs/make_reliability_report.py
          python docs/check_reliability.py
          git diff --exit-code README.md STATE_OF_AGENT_RELIABILITY_2026.md docs/reliability-data.json docs/reliability-data.csv
      - name: Generated catalog table is current
        run: |
          python docs/make_catalog.py
          git diff --exit-code README.md docs/index.html docs/assets/hero.svg docs/assets/stats-light.svg docs/assets/stats-dark.svg
      - name: Generated failure taxonomy is current
        run: |
          python docs/make_taxonomy.py
          git diff --exit-code README.md START_HERE.md FAILURE_TAXONOMY.md docs/index.html docs/assets/taxonomy.json docs/assets/hero.svg docs/assets/stats-light.svg docs/assets/stats-dark.svg
      - name: Local documentation links resolve
        run: python docs/check_links.py
      - name: Generated decision-gate labs are current
        run: |
          python docs/make_decision_gate_wave.py
          python docs/make_readme_experiences.py
          git diff --exit-code pharmaceutical-manufacturing grid-operations human-resources aviation-operations banking-compliance tax-filing-services
      - name: Generated proof-before-action labs are current
        run: |
          python docs/make_proof_action_wave.py
          python docs/make_readme_experiences.py
          git diff --exit-code research-knowledge-work home-field-services nonprofit-grant-management
      - name: Generated public-protection labs are current
        run: |
          python docs/make_public_protection_wave.py
          python docs/make_readme_experiences.py
          git diff --exit-code automotive-safety consumer-product-safety maritime-ports environmental-hazardous-materials consumer-finance-debt telecommunications-emergency workplace-safety
      - name: Generated clock-collision labs are current
        run: |
          python docs/make_clock_collision_wave.py
          python docs/make_readme_experiences.py
          git diff --exit-code medical-device-safety pharmaceutical-supply mortgage-servicing healthcare-payment securities-cyber-disclosure long-term-care nuclear-operations
      - name: Generated rights-continuity and critical-event labs are current
        run: |
          python docs/make_next_impact_wave.py
          python docs/make_readme_experiences.py
          git diff --exit-code medicaid-chip health-insurance-appeals social-security-disability pipeline-safety health-data-privacy clinical-trial-safety
      - name: Generated next-impact contract visuals are current
        run: |
          python docs/make_next_impact_assets.py
          git diff --exit-code docs/assets/rights-continuity.svg docs/assets/critical-event-fanout.svg
      - name: Generated Federal AI acquisition lab is current
        run: |
          python docs/make_federal_mission_wave.py
          python docs/make_readme_experiences.py
          git diff --exit-code federal-ai-acquisition
      - name: Generated README visual system is current
        run: |
          python docs/make_readme_experiences.py
          git diff --exit-code
      - name: Matched evidence-service report is current
        run: |
          python docs/make_evidence_service_report.py
          git diff --exit-code EVIDENCE_SERVICE_REPORT.md
      - name: Matched decision-gate report is current
        run: |
          python docs/make_decision_gate_report.py
          git diff --exit-code DECISION_GATE_REPORT.md
      - name: Proof-before-action report is current
        run: |
          python docs/make_proof_action_report.py
          git diff --exit-code PROOF_ACTION_REPORT.md
      - name: Public-protection report is current
        run: |

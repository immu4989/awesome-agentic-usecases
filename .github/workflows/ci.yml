    name: ${{ matrix.cli }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e harness[dev]
          for p in ${{ matrix.extra }}; do pip install -e "$p"; done
          pip install -e ${{ matrix.dir }}[dev]
      - name: Tests
        run: pytest harness/tests ${{ matrix.dir }}/tests -q
      - name: Scenario file is reproducible
        # Keyed on the file existing, not on `extra`: use cases that reuse a baseline's
        # scenarios have nothing of their own to check, but one that ships its own file
        # must be verified even though it depends on another package.
        run: |
          committed="${{ matrix.dir }}/evals/scenarios.jsonl"
          if [ ! -f "$committed" ]; then
            echo "no committed scenario file for ${{ matrix.cli }}; nothing to verify"
            exit 0
          fi
          n="${{ matrix.n || 30 }}"
          # Two different hash seeds. Python salts hash() per process, so a generator that
          # reaches for it produces different scenarios on every run — which silently
          # invalidated a wave of collected results before this check existed.
          PYTHONHASHSEED=0 ${{ matrix.cli }} generate --n "$n" --seed ${{ matrix.seed }} \
            --out /tmp/scenarios_a.jsonl
          PYTHONHASHSEED=12345 ${{ matrix.cli }} generate --n "$n" --seed ${{ matrix.seed }} \
            --out /tmp/scenarios_b.jsonl
          diff /tmp/scenarios_a.jsonl /tmp/scenarios_b.jsonl \
            || { echo "generator is not hash-seed independent"; exit 1; }
          diff /tmp/scenarios_a.jsonl "$committed"
      - name: Mock eval runs green
        run: ${{ matrix.cli }} eval --backend mock --repeats 3 --out /tmp/results
      - name: Lint
        run: ruff check harness ${{ matrix.dir }}

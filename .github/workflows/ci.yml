name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  catalog:
    name: Public catalog integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Catalog, README, package, and CI coverage agree
        run: python docs/check_catalog.py
      - name: Generated catalog table is current
        run: |
          python docs/make_catalog.py
          git diff --exit-code README.md
      - name: Generated decision-gate labs are current
        run: |
          python docs/make_decision_gate_wave.py
          python docs/make_readme_experiences.py
          git diff --exit-code pharmaceutical-manufacturing grid-operations human-resources aviation-operations banking-compliance tax-filing-services
      - name: Generated README visual system is current
        run: |
          python docs/make_readme_experiences.py
          git diff --exit-code
      - name: Matched evidence-service report is current
        run: |
          python docs/make_evidence_service_report.py
          git diff --exit-code EVIDENCE_SERVICE_REPORT.md
      - name: Matched decision-gate report is current
        run: |
          python docs/make_decision_gate_report.py
          git diff --exit-code DECISION_GATE_REPORT.md

  use-case:
    runs-on: ubuntu-latest

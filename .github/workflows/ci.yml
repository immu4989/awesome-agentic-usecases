name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  catalog:
    name: Public catalog integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Catalog, README, package, and CI coverage agree
        run: python docs/check_catalog.py
      - name: Generated catalog table is current
        run: |
          python docs/make_catalog.py
          git diff --exit-code README.md
      - name: Generated README visual system is current
        run: |
          python docs/make_readme_experiences.py
          git diff --exit-code

  use-case:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: logistics-supply-chain/exception-triage-agent
            cli: exception-triage-agent
            seed: 7
          - dir: logistics-supply-chain/exception-triage-drift
            cli: exception-triage-drift
            seed: 7
            extra: logistics-supply-chain/exception-triage-agent
          - dir: retail-workforce/shift-coverage-triage-agent
            cli: shift-coverage-agent
            seed: 11
          - dir: security-operations/alert-triage-agent
            cli: alert-triage-agent
            seed: 13
          - dir: security-operations/artifact-admission-agent
            cli: artifact-admission-agent
            seed: 31
          - dir: security-operations/trifecta-exfil-agent
            cli: trifecta-exfil-agent
            seed: 37
          - dir: financial-services-fraud/fraud-alert-triage-agent
            cli: fraud-alert-triage-agent
            seed: 17
          - dir: procurement-finance/vendor-payment-review-agent
            cli: vendor-payment-review-agent
            seed: 71
            n: 28
          - dir: media-streaming/release-qc-triage-agent
            cli: release-qc-agent
            seed: 19
          - dir: customer-support/refund-resolution-agent
            cli: refund-resolution-agent
            seed: 23
          - dir: it-operations/oncall-watch-agent
            cli: oncall-watch-agent
            seed: 29
          - dir: customer-support/refund-crew
            cli: refund-crew
            seed: 23
            extra: customer-support/refund-resolution-agent
          - dir: customer-support/refund-guarded
            cli: refund-guarded
            seed: 23
            extra: customer-support/refund-resolution-agent
          - dir: customer-support/refund-injected
            cli: refund-injected
            seed: 23
            extra: customer-support/refund-resolution-agent customer-support/refund-guarded
          - dir: legal-compliance/dpa-clause-review-agent
            cli: dpa-clause-review-agent
            seed: 47
            n: 28
          - dir: healthcare-life-sciences/prior-auth-review-agent
            cli: prior-auth-review-agent
            seed: 41
            n: 28
          - dir: it-operations/incident-remediation-agent
            cli: incident-remediation-agent
            seed: 61
            n: 24
          - dir: customer-support/refund-amplified
            cli: refund-amplified
            seed: 23
            extra: customer-support/refund-resolution-agent
          - dir: customer-support/refund-memory
            cli: refund-memory
            seed: 43
            n: 24
            extra: customer-support/refund-resolution-agent
          - dir: public-sector/small-business-recovery-agent
            cli: small-business-recovery-agent
            seed: 83
            n: 32
          - dir: energy-utilities/household-energy-lifeline
            cli: household-energy-lifeline
            seed: 107
            n: 32
          - dir: insurance-disaster-recovery/disaster-claim-aid-coordinator
            cli: disaster-claim-aid-coordinator
            seed: 131
            n: 32
          - dir: employment-social-insurance/unemployment-claim-navigator
            cli: unemployment-claim-navigator
            seed: 149
            n: 32
          - dir: agriculture-food-systems/farm-disaster-deadline-agent
            cli: farm-disaster-deadline
            seed: 157
            n: 32
          - dir: housing-construction/permit-readiness-agent
            cli: permit-readiness-agent
            seed: 163
            n: 32
          - dir: education-services/student-accommodation-navigator
            cli: student-accommodation-navigator
            seed: 173
            n: 32
          - dir: identity-access/account-recovery-assurance-agent
            cli: account-recovery-assurance-agent
            seed: 181
            n: 32
          - dir: accessibility-digital-services/accessibility-remediation-verifier
            cli: accessibility-remediation-verifier
            seed: 191
            n: 32
          - dir: privacy-data-governance/privacy-rights-orchestrator
            cli: privacy-rights-orchestrator
            seed: 197
            n: 32
    name: ${{ matrix.cli }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e harness[dev]
          for p in ${{ matrix.extra }}; do pip install -e "$p"; done
          pip install -e ${{ matrix.dir }}[dev]
      - name: Tests
        run: pytest harness/tests ${{ matrix.dir }}/tests -q
      - name: Scenario file is reproducible
        # Keyed on the file existing, not on `extra`: use cases that reuse a baseline's
        # scenarios have nothing of their own to check, but one that ships its own file
        # must be verified even though it depends on another package.
        run: |
          committed="${{ matrix.dir }}/evals/scenarios.jsonl"
          if [ ! -f "$committed" ]; then
            echo "no committed scenario file for ${{ matrix.cli }}; nothing to verify"
            exit 0
          fi
          n="${{ matrix.n || 30 }}"
          # Two different hash seeds. Python salts hash() per process, so a generator that
          # reaches for it produces different scenarios on every run — which silently
          # invalidated a wave of collected results before this check existed.
          PYTHONHASHSEED=0 ${{ matrix.cli }} generate --n "$n" --seed ${{ matrix.seed }} \
            --out /tmp/scenarios_a.jsonl
          PYTHONHASHSEED=12345 ${{ matrix.cli }} generate --n "$n" --seed ${{ matrix.seed }} \
            --out /tmp/scenarios_b.jsonl
          diff /tmp/scenarios_a.jsonl /tmp/scenarios_b.jsonl \
            || { echo "generator is not hash-seed independent"; exit 1; }
          diff /tmp/scenarios_a.jsonl "$committed"
      - name: Mock eval runs green
        run: ${{ matrix.cli }} eval --backend mock --repeats 3 --out /tmp/results
      - name: Lint
        run: ruff check harness ${{ matrix.dir }}

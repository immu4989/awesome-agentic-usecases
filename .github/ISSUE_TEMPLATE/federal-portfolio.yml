name: Propose a Federal AI Portfolio Adaptation
description: Propose a public or synthetic inventory and an evidence question for the Portfolio Observatory.
title: "[federal portfolio] <portfolio question>"
labels: ["federal-portfolio", "use-case-request"]
body:
  - type: markdown
    attributes:
      value: |
        Help an accountable portfolio team inspect evidence quality, measurement, evaluation,
        acquisition obligations, or reusable test contracts. This is a public repository.

        **Do not submit** names, email addresses, personal records, credentials, source-selection
        material, procurement-sensitive information, controlled information, classified
        information, or any other non-public agency data.

  - type: input
    id: question
    attributes:
      label: Portfolio question
      placeholder: Which investments lack measurable outcomes or complete high-impact review?
    validations:
      required: true

  - type: textarea
    id: users
    attributes:
      label: Who would use the answer?
      description: Use public role labels only, such as program, acquisition, evaluation, privacy, or operations staff.
    validations:
      required: true

  - type: textarea
    id: fields
    attributes:
      label: Public or synthetic inventory fields
      description: List the minimum fields needed to make the question inspectable and explain how each can be safely shared.
    validations:
      required: true

  - type: textarea
    id: measurement
    attributes:
      label: Baseline, measurement, and limitations
      description: State what could be measured without claiming audited savings or causal impact.
    validations:
      required: true

  - type: textarea
    id: human
    attributes:
      label: Protected human decisions
      placeholder: Budget, acquisition, award, deployment, consolidation, cancellation, and retirement remain with accountable officials.
    validations:
      required: true

  - type: textarea
    id: sources
    attributes:
      label: Official sources and review dates
      description: Link primary public sources and identify facts that need periodic revalidation.
    validations:
      required: true

  - type: checkboxes
    id: boundary
    attributes:
      label: Public-repository boundary
      options:
        - label: This proposal contains only public or synthetic information and completed human disclosure review.
          required: true
        - label: It contains no PII, credentials, procurement-sensitive, controlled, or classified information.
          required: true
        - label: I understand similarity is not proof of duplication and this project does not rank or make portfolio decisions.
          required: true
        - label: I will not claim audited savings, certification, compliance, or government approval from this tool.
          required: true

name: Collective Cyber Defense contribution
description: Propose a public-safe verified fix, blind reproduction, defender campaign, benchmark response, or evidence artifact
title: "[collective-defense]: "
labels: ["collective-defense", "evidence"]
body:
  - type: markdown
    attributes:
      value: |
        Share only public, synthetic, or explicitly authorized aggregate evidence. Never post a live target, exploit payload, credential, private telemetry, inventory, incident record, personal data, controlled information, or classified information.
  - type: dropdown
    id: artifact-kind
    attributes:
      label: Artifact kind
      options:
        - Verified Fix contract and receipt
        - Agent Containment reproduction
        - Essential-Service Defender campaign
        - Frontier Defense Benchmark response
        - Cyber Defense Evidence Mesh artifact
        - Independent reproduction proposal
        - Revealed Independent Reproduction Exchange pack
    validations:
      required: true
  - type: textarea
    id: public-problem
    attributes:
      label: Public problem and beneficiary
      description: Describe the defensive problem, who benefits, and why the contribution is reusable. Do not include operational details.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Primary public sources
      description: Add direct links to authoritative guidance, standards, advisories, or specifications.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence artifacts and hashes
      description: Name the safe contract, receipt, producer, runner or adapter, hashes, and exact evidence level. Explain any open gaps.
    validations:
      required: true
  - type: textarea
    id: human-service-boundary
    attributes:
      label: Human and service boundary
      description: Name accountable approval, stop, restart, continuity, rollback, and non-transfer conditions that apply.
    validations:
      required: true
  - type: checkboxes
    id: attestations
    attributes:
      label: Public-sharing attestations
      options:
        - label: I am sharing only public, synthetic, or explicitly authorized aggregate evidence.
          required: true
        - label: This submission contains no target, exploit payload, credential, raw/private telemetry, inventory, personal data, controlled information, or classified information.
          required: true
        - label: I will not describe reference or synthetic results as field effectiveness, certification, compliance, endorsement, or operational authorization.
          required: true
        - label: If I claim independent reproduction, I will provide a verified Exchange pack with a precommitted oracle, exact artifact binding, distinct issuer/producer/reviewer commitments, and reviewed relationship evidence—not a Boolean self-declaration.
          required: true

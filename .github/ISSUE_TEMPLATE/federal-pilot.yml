name: Propose a Federal Pilot
description: Propose a public or synthetic mission for the Federal Pilot Kit.
title: "[federal pilot] <mission outcome>"
labels: ["federal-pilot", "use-case-request"]
body:
  - type: markdown
    attributes:
      value: |
        Propose a measurable public-sector mission that agencies, responders, and independent
        reviewers could evaluate with public or synthetic data. This is a public repository.

        **Do not submit** proposal contents, source-selection or procurement-sensitive material,
        personal records, credentials, controlled information, classified information, or any
        non-public agency data.

  - type: input
    id: mission
    attributes:
      label: Public mission outcome
      description: Describe the outcome people need, independent of a model or vendor.
      placeholder: Reduce missing-evidence handoffs in synthetic grant invoice review.
    validations:
      required: true

  - type: textarea
    id: affected
    attributes:
      label: Who benefits and what is the current baseline?
      placeholder: Small recipients and payment staff; today they reconcile separate files manually.
    validations:
      required: true

  - type: textarea
    id: gates
    attributes:
      label: Measurable acceptance gates
      description: Name outcomes, thresholds, evidence, and failure conditions where possible.
      placeholder: Every missing approval is surfaced; no payment decision is made; exact synthetic test set passes.
    validations:
      required: true

  - type: textarea
    id: authority
    attributes:
      label: Protected human decisions and prohibited actions
      placeholder: Payment approval remains with an authorized official; the pilot cannot send, reject, transfer funds, or label fraud.
    validations:
      required: true

  - type: textarea
    id: synthetic
    attributes:
      label: Public or synthetic test design
      description: Explain the smallest safe scenario set and the ground-truth source or domain-review path.
    validations:
      required: true

  - type: textarea
    id: commercial
    attributes:
      label: Pricing, data-rights, portability, or exit question
      description: Identify the acquisition term whose absence would create the largest operational risk.
    validations:
      required: true

  - type: textarea
    id: owners
    attributes:
      label: Accountable roles, intervention point, and stop authority
      description: Use public role labels—not names, email addresses, or non-public organization details.
      placeholder: Program official decides continuation; independent evaluator owns hidden tests; operations lead can stop immediately before any external action.
    validations:
      required: true

  - type: textarea
    id: security_privacy
    attributes:
      label: Security, privacy, accessibility, and records boundaries
      description: State the public/synthetic data boundary, approved environment assumption, incident route, and domain-review owners.
    validations:
      required: true

  - type: textarea
    id: exit_rehearsal
    attributes:
      label: Day-30 exit and portability rehearsal
      description: What must be exported, access-revoked, restored, reconciled, and evidenced before a human continuation decision?
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Public-repository boundary
      options:
        - label: This proposal contains only public or synthetic information.
          required: true
        - label: I understand that the Pilot Kit does not rank vendors, recommend awards, certify systems, or provide legal advice.
          required: true
        - label: I will use the 30-Day Agency Pilot Launch Pack and keep approval records in an authorized system.
          required: true

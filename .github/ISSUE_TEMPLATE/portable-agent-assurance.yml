name: Portable Agent Assurance contribution
description: Propose an MCP/A2A fixture, adapter, independent reproduction, TEVV profile, or specification improvement.
title: "[Agent assurance]: "
labels: ["agent-boundary", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Help make agent identity and live authority portable, testable, and reproducible. Start from the [0.1 specification](https://github.com/immu4989/awesome-agentic-usecases/blob/main/portable-agent-assurance/SPEC.md). **Do not post a live token, private key, production Agent Card, private trace, internal topology, personal data, controlled information, or classified information.**
  - type: dropdown
    id: contribution
    attributes:
      label: Contribution type
      options:
        - MCP recorded-fixture adapter
        - A2A recorded-fixture adapter
        - Identity or authority collision with a clean twin
        - Outside independent reproduction
        - Envelope, suite, receipt, or schema improvement
        - TEVV-Athlon profile or public-comment review
        - Accessibility, privacy, or threat-model review
    validations:
      required: true
  - type: textarea
    id: binding
    attributes:
      label: Exact binding under test
      description: Identify the workload, operator, authority, task, policy, protocol, peer, delegation, monitoring, or evidence binding that changes.
      placeholder: A valid A2A caller presents an Agent Card whose bytes changed after authority was granted...
    validations:
      required: true
  - type: textarea
    id: twin
    attributes:
      label: Closest legitimate twin
      description: Describe the minimally different request that must remain allowed. A deny-all control is not acceptable.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Precommitted outcome and reason code
      description: State allow, block, or pause and the exact reason code before running the fixture.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Public evidence and review route
      description: Link primary public sources, describe the synthetic oracle, and name the accountable review role.
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: Evidence this contribution will still not provide
      description: Keep production identity, live authorization, field observation, held-out material, or independence gaps explicit.
    validations:
      required: true
  - type: checkboxes
    id: attestations
    attributes:
      label: Public contribution boundary
      options:
        - label: I used only public or synthetic information and included no live credential, private trace, personal data, controlled information, or classified information.
          required: true
        - label: I preserved a legitimate twin and did not weaken the non-certification, non-compliance, non-authorization, or non-endorsement boundaries.
          required: true
        - label: I understand that byte integrity and deterministic recomputation do not prove production identity, authorship, event truth, or organizational independence.
          required: true

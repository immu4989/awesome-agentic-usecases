name: Request a verified use case
description: Describe an agent decision you want this repository to evaluate.
title: "[request] <industry>: <agent decision>"
labels: ["use-case-request"]
body:
  - type: markdown
    attributes:
      value: |
        You do not need to know how to build the eval. Describe the real decision and why
        it is hard; maintainers and contributors can help turn it into a measurable case.

  - type: input
    id: industry
    attributes:
      label: Industry or workflow
      placeholder: Insurance claims, procurement, education, manufacturing…
    validations:
      required: true

  - type: textarea
    id: decision
    attributes:
      label: What decision or action should the agent own?
      description: Describe the output somebody would use—not simply “help with” the workflow.
      placeholder: Decide whether to auto-approve, request evidence, or escalate a claim.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: What information should it investigate?
      description: Which records, policies, tools, or changing state determine the right answer?
    validations:
      required: true

  - type: textarea
    id: failure
    attributes:
      label: What failure would matter in the real world?
      description: Include irreversible actions, silent omissions, delays, cost, or safety impact.
    validations:
      required: true

  - type: dropdown
    id: shape
    attributes:
      label: Closest agent shape
      options:
        - Investigate and decide
        - Plan and act
        - Watch changing state
        - Gate or approve
        - Coordinate multiple agents
        - Defend against an adversary
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: data
    attributes:
      label: Reproducibility
      options:
        - label: The workflow can be represented with synthetic or public data.
          required: true

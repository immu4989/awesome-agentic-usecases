name: Propose a Public Federal AI Lesson
description: Propose a redacted, evidence-linked lesson from a public or synthetic AI pilot.
title: "[federal lesson] <bounded lesson title>"
labels: ["federal-pilot", "lesson", "use-case-request"]
body:
  - type: markdown
    attributes:
      value: |
        Share only public or synthetic information. Do not post source-selection, procurement-sensitive, controlled, classified, personal, credential, or nonpublic agency information. A stopped pilot is welcome. This form does not authorize disclosure or create government approval.
  - type: dropdown
    id: outcome
    attributes:
      label: Observed pilot outcome
      options:
        - Succeeded within a bounded scope
        - Changed before continuing
        - Stopped
        - Mixed
    validations:
      required: true
  - type: textarea
    id: mission
    attributes:
      label: Public or synthetic mission and beneficiary
      description: Describe the service problem, intended outcome, and who benefits without identifying a vendor or person.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and exact observation
      description: Name public artifacts, synthetic cases, measures, and limitations. Separate submitted evidence from independently reproduced evidence.
    validations:
      required: true
  - type: textarea
    id: human_decision
    attributes:
      label: Accountable human decision
      description: Who decided continue, change, stop, or retire—and which protected decisions stayed human?
    validations:
      required: true
  - type: textarea
    id: reuse
    attributes:
      label: Bounded reusable practice
      description: State the practice, prerequisites, where it may help, and where it must not transfer.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Current official-source dependencies
      description: Link primary sources and identify the facts or boundaries that require revalidation when those sources change.
    validations:
      required: true
  - type: checkboxes
    id: public_gate
    attributes:
      label: Public-release gate
      options:
        - label: I used only public or synthetic information and completed authorized human redaction review.
          required: true
        - label: This proposal contains no PII, credentials, classified, controlled, procurement-sensitive, source-selection, or vendor-confidential information.
          required: true
        - label: I understand the scanner is not DLP and this repository does not authorize disclosure.
          required: true
        - label: I understand the lesson cannot rank vendors, recommend an award, certify a system, or claim universal applicability.
          required: true

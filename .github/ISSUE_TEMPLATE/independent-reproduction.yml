name: Independent reproduction contribution
description: Submit an attested answer-free challenge run for separate review
title: "[Reproduction]: "
labels: ["independent-reproduction"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing an AAU challenge from your fork. Submit public or synthetic evidence only. Do not paste an oracle, raw trace, credential, target, identity document, personal data, confidential relationship evidence, CUI, or classified information.
  - type: input
    id: challenge
    attributes:
      label: Open challenge ID
      description: Copy an open challenge_id from reproduction-challenges/campaign.json; closed ids are rejected.
      placeholder: a2a-mcp-authority-relay-2026-01
    validations:
      required: true
  - type: input
    id: fork
    attributes:
      label: Fork URL
      placeholder: https://github.com/your-handle/awesome-agentic-usecases
    validations:
      required: true
  - type: input
    id: run
    attributes:
      label: Fork workflow run URL
      placeholder: https://github.com/your-handle/awesome-agentic-usecases/actions/runs/...
    validations:
      required: true
  - type: input
    id: digest
    attributes:
      label: Submission SHA-256
      description: Copy the digest from the workflow artifact's SHA256SUMS file.
    validations:
      required: true
  - type: dropdown
    id: relationship
    attributes:
      label: Relationship to the repository owner
      options:
        - none
        - contractor
        - affiliate
        - same organization
        - unknown
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: Public system and adapter description
      description: Identify versions and affordances without revealing secrets or private traces.
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Known limitations
      description: State what this run cannot establish and any conditions that limit transfer.
    validations:
      required: true
  - type: checkboxes
    id: attestations
    attributes:
      label: Public sharing boundary
      options:
        - label: I received the challenge without its oracle and did not use an external answer source.
          required: true
        - label: The linked artifact contains public or synthetic evidence only and excludes raw traces, credentials, targets, and personal data.
          required: true
        - label: I understand that submission is not independent adjudication, certification, field-effectiveness evidence, or government endorsement.
          required: true

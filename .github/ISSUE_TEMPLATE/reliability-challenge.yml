name: Claim a Reliability Challenge
description: Reproduce a claim, break an assumption, or adapt a proven contract.
title: "[challenge] <mission id>: <your narrow claim>"
labels: ["challenge", "good first issue"]
body:
  - type: markdown
    attributes:
      value: |
        Pick a mission from the [live Challenge board](https://immu4989.github.io/awesome-agentic-usecases/#challenge). You can begin with the deterministic mock: no API key, private data, or spend required.
  - type: input
    id: mission
    attributes:
      label: Challenge id
      placeholder: completion-is-not-correctness
    validations:
      required: true
  - type: dropdown
    id: track
    attributes:
      label: Track
      options:
        - Reproduce
        - Break
        - Adapt
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: Narrow claim you will test
      description: State one claim that a committed scenario, result, or contract change can verify.
    validations:
      required: true
  - type: input
    id: lab
    attributes:
      label: Starter or proposed lab path
      placeholder: industry/use-case
    validations:
      required: true
  - type: checkboxes
    id: receipt
    attributes:
      label: Evidence agreement
      options:
        - label: I will use only synthetic or public data.
          required: true
        - label: I will link the claim to a scenario, result, trace, or contract artifact.
          required: true
        - label: I understand that CI derives the finish and achievements.
          required: true

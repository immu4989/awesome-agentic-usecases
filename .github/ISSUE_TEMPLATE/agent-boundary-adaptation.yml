name: Agent Boundary adaptation
description: Propose a synthetic authority profile, defensive scenario, adapter, or independent reproduction.
title: "[Agent boundary]: "
labels: ["agent-boundary", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Help make agent authority testable across organizations and platforms. **Do not post live targets, exploit instructions, real credentials, production telemetry, private model traces, personal data, controlled information, or classified information.** Start from the synthetic [Agent Boundary Protocol](https://github.com/immu4989/awesome-agentic-usecases/tree/main/agentic-cyber-resilience).
  - type: dropdown
    id: stakeholder
    attributes:
      label: Primary stakeholder
      options:
        - Organization deploying agents
        - Cybersecurity company or technology partner
        - Government or critical-infrastructure program
        - Frontier AI company
        - Research or standards group
        - Open-source maintainer
    validations:
      required: true
  - type: dropdown
    id: contribution
    attributes:
      label: Proposed contribution
      options:
        - Synthetic authority profile
        - Defensive boundary scenario and reviewed oracle
        - Vendor-neutral event adapter
        - Independent reproduction
        - Protocol or schema improvement
        - Threat-model or accessibility review
    validations:
      required: true
  - type: textarea
    id: failure_shape
    attributes:
      label: Boundary failure shape
      description: Describe one bounded way an agent could exceed identity, task, tool, target, peer, egress, monitoring, time, or restart authority.
      placeholder: A long-running agent discovers a new tool and treats availability as permission to...
    validations:
      required: true
  - type: textarea
    id: valid_twin
    attributes:
      label: Closest valid twin
      description: Describe the minimally different action that should remain allowed or safely stopped.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Public sources and review route
      description: Link primary public sources and name the role—not a person—that can review the synthetic oracle.
    validations:
      required: true
  - type: checkboxes
    id: attestations
    attributes:
      label: Public-issue safety
      options:
        - label: I used only public or synthetic information and included no live target, exploit chain, working credential, private trace, personal data, controlled information, or classified information.
          required: true
        - label: I understand that a passing receipt is not certification, compliance, production validation, government endorsement, or an Authority to Operate.
          required: true
        - label: I will keep original operational events private and submit only an authorized aggregate artifact.
          required: true

name: Public-value pilot proposal
description: Propose a privacy-bounded field or reproduction partnership using public or synthetic task evidence.
title: "[Public-value pilot]: "
labels: ["public-value-pilot", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include personal information, credentials, private telemetry, request records, protected data, incident details, or nonpublic organizational material. A proposal is not approval, endorsement, or authorization to deploy.
  - type: input
    id: organization
    attributes:
      label: Organization or community
      description: A public name or a general description if public identification is not yet authorized.
    validations:
      required: true
  - type: textarea
    id: beneficiaries
    attributes:
      label: Who should benefit?
      description: Describe the people or public service without individual information.
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Narrow task and protected human authority
      description: What may the agent help with, and what decision must remain with an accountable person?
    validations:
      required: true
  - type: textarea
    id: measures
    attributes:
      label: Predeclared public-value measures
      description: Include units, baseline source, observation window, and the claim each measure cannot support.
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Current evidence
      options:
        - Reviewed synthetic task only
        - Agent receipt available
        - Aggregate human comparator available
        - Bounded field observation available
        - Independent same-suite reproduction available
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Public contribution boundary
      options:
        - label: I will submit only authorized public or synthetic artifacts.
          required: true
        - label: I understand that AAU evidence is not certification, compliance, procurement approval, government endorsement, or authority to deploy.
          required: true

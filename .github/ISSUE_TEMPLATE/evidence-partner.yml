name: Evidence Commons partner
description: Propose a privacy-safe review, aggregate comparator, public-value observation, or reproduction.
title: "[Evidence partner]: "
labels: ["evidence-partner", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping turn a synthetic score into useful public evidence. **Do not include names, emails, participant responses, production records, controlled information, credentials, worker rankings, or employment decisions.** A public issue is not an approved collection channel or institutional determination.
  - type: dropdown
    id: capsule
    attributes:
      label: Impact Capsule
      options:
        - FOIA Routing & Requester Burden Pilot
        - Accessible Digital Service Remediation Pilot
        - Small-Nonprofit Grant Obligation Evidence Pilot
        - A new capsule (describe below)
    validations:
      required: true
  - type: dropdown
    id: contribution
    attributes:
      label: Proposed contribution
      options:
        - Domain review of synthetic tasks and ground truth
        - Human-comparator protocol review
        - Aggregate public-value observation
        - Independent reproduction
        - Accessibility or human-protection review
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Public, bounded scope
      description: Describe the mission, accountable role, evidence layer, and public artifact you could contribute. Do not name individuals.
      placeholder: We can review the task contract and publish an aggregate protocol decision for...
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: Human authority and stop conditions
      description: Which decisions remain protected, and when must the agent or study stop?
    validations:
      required: true
  - type: textarea
    id: protection
    attributes:
      label: Institutional and data-protection route
      description: State who will determine the applicable human-protection, privacy, security, records, labor, accessibility, and legal requirements. Do not upload a determination or private material here.
    validations:
      required: true
  - type: checkboxes
    id: attestations
    attributes:
      label: Public-issue safety
      options:
        - label: I have not included participant-level data, direct identifiers, free text from participants, production case records, credentials, controlled information, or employment decisions.
          required: true
        - label: I understand that AAU does not verify identity, institutional review, independence, causal impact, certification, government endorsement, or authority to deploy.
          required: true
        - label: I will obtain the appropriate organizational approvals before any human observation or operational data use.
          required: true

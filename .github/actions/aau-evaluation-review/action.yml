name: AAU saved evaluation review
description: Verify approved inputs and benchmark context, review metric constraints, and preserve an offline pack.
inputs:
  input-format:
    description: evaluations (normalized JSON), recordings (observations), csv (approved column maps), or retries (approved task-accounting plans). CSV and retries produce source-retaining handoffs.
    default: evaluations
  policy:
    description: Workspace-relative reviewed policy JSON.
    required: true
  policy-sha256:
    description: Approved policy file byte SHA-256, from a trusted review process.
    required: true
  baseline:
    description: Workspace-relative approved baseline file in the selected input format.
    required: true
  baseline-sha256:
    description: Approved baseline file byte SHA-256, from a trusted review process.
    required: true
  candidate:
    description: Workspace-relative candidate file in the selected input format.
    required: true
  baseline-plan:
    description: CSV/retries modes only; required workspace-relative baseline column-map or retry-accounting plan with declared context.
    default: ''
  baseline-plan-sha256:
    description: CSV/retries modes only; independently approved baseline plan byte SHA-256.
    default: ''
  candidate-plan:
    description: CSV/retries modes only; required workspace-relative candidate column-map or retry-accounting plan with declared context.
    default: ''
  candidate-plan-sha256:
    description: CSV/retries modes only; independently approved candidate plan byte SHA-256.
    default: ''
  diagnostics:
    description: Workspace-relative diagnostic plan; required in csv/retries modes; requires diagnostics-sha256 when supplied.
    default: ''
  diagnostics-sha256:
    description: Independently approved diagnostic-plan byte SHA-256; requires diagnostics when supplied.
    default: ''
  operating-budget:
    description: Optional workspace-relative candidate operating-budget plan; requires diagnostics and operating-budget-sha256.
    default: ''
  operating-budget-sha256:
    description: Independently approved operating-budget plan byte SHA-256; required with operating-budget.
    default: ''
  output:
    description: New workspace-relative directory; includes complete unsanitized evaluation details.
    default: aau-evaluation-review
outputs:
  reports:
    description: Pack directory; verify before consuming, and inspect source privacy before uploading.
    value: ${{ inputs.output }}
runs:
  using: composite
  steps:
    - name: Validate approved evidence, review constraints, and verify the pack
      shell: bash
      env:
        AAU_EVAL_INPUT_FORMAT: ${{ inputs.input-format }}
        AAU_EVAL_POLICY: ${{ inputs.policy }}
        AAU_EVAL_POLICY_SHA256: ${{ inputs.policy-sha256 }}
        AAU_EVAL_BASELINE: ${{ inputs.baseline }}
        AAU_EVAL_BASELINE_SHA256: ${{ inputs.baseline-sha256 }}
        AAU_EVAL_CANDIDATE: ${{ inputs.candidate }}
        AAU_EVAL_BASELINE_PLAN: ${{ inputs.baseline-plan }}
        AAU_EVAL_BASELINE_PLAN_SHA256: ${{ inputs.baseline-plan-sha256 }}
        AAU_EVAL_CANDIDATE_PLAN: ${{ inputs.candidate-plan }}
        AAU_EVAL_CANDIDATE_PLAN_SHA256: ${{ inputs.candidate-plan-sha256 }}
        AAU_EVAL_DIAGNOSTICS: ${{ inputs.diagnostics }}
        AAU_EVAL_DIAGNOSTICS_SHA256: ${{ inputs.diagnostics-sha256 }}
        AAU_EVAL_OPERATING_BUDGET: ${{ inputs.operating-budget }}
        AAU_EVAL_OPERATING_BUDGET_SHA256: ${{ inputs.operating-budget-sha256 }}
        AAU_EVAL_OUTPUT: ${{ inputs.output }}
      run: python "$GITHUB_ACTION_PATH/run.py"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Observed Shift Coverage failure modes</title>
  <desc id="desc">Three observed, reproducible failure modes from committed evaluation runs.</desc>
  <style>
    :root { color-scheme:light dark; }
    .surface { fill:#f7faf8; } .card { fill:#fff;stroke:#d9e2dd;stroke-width:1.5; }
    .ink { fill:#10231d; } .muted { fill:#52645e; }
    .kicker { font:750 13px system-ui,sans-serif;letter-spacing:1.6px; } .title { font:750 28px system-ui,sans-serif; }
    .mode { font:850 19px ui-monospace,SFMono-Regular,monospace; } .headline { font:740 17px system-ui,sans-serif; }
    .body { font:430 14px system-ui,sans-serif; } .pill { font:750 11px system-ui,sans-serif;letter-spacing:.8px; }
    @media (prefers-color-scheme:dark) {
      .surface { fill:#101916; } .card { fill:#17231f;stroke:#30433c; }
      .ink { fill:#f4faf7; } .muted { fill:#b2c3bc; }
    }
  </style>
  <rect width="1200" height="540" rx="20" class="surface"/>
  <text x="42" y="42" class="kicker" fill="#e05a24">OBSERVED IN THE LAB · NOT HYPOTHETICAL</text>
  <text x="42" y="84" class="title ink">How this agent actually fails</text>
  <g transform="translate(960 35)"><rect width="198" height="30" rx="15" fill="#e05a24" opacity=".13"/><circle cx="17" cy="15" r="5" fill="#e05a24"/><text x="30" y="19" class="pill muted">REPRODUCIBLE CASES</text></g>
  <g transform="translate(42 128)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#e05a24" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#e05a24">01</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">Invented &quot;overtime is expensive&quot; heuristic overrides written…</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">policy POL-PREF-00 states the fill preference order explicitly — overtime first, then borrowing. Mistral repeatedly</tspan><tspan x="94" dy="20">retrieves it, then picks borrow_from_nearby when a compliant overtime candidate exists at the home store, applying a…</tspan></text></g><g transform="translate(42 252)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#e05a24" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#e05a24">02</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">Over-escalation: handing fillable shifts to the district manager</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">the strongest model (0.822) makes almost all its errors by choosing escalate_to_district when a compliant overtime or</tspan><tspan x="94" dy="20">borrow fill exists. It treats the weekly-hours arithmetic as a reason to punt rather than resolve.</tspan></text></g><g transform="translate(42 376)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#e05a24" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#e05a24">03</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">Commit-stall: investigates, re-reads policy, never submits</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">the model gathers the shift record and roster, then loops on policy search and exits without calling submit_coverage_plan.</tspan><tspan x="94" dy="20">All the evidence, no decision.</tspan></text></g>
  <text x="42" y="514" class="body muted">Open FAILURE_MODES.md for scenario IDs, evidence, impact, and reproduction commands.</text>
</svg>

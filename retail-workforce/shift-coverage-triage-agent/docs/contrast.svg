<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" role="img" aria-labelledby="title desc">
  <title id="title">Shift Coverage verified result spread</title>
  <desc id="desc">Contrast between the strongest and weakest committed result on Compliant staffing strategy.</desc>
  <style>
    :root { color-scheme:light dark; }
    .surface { fill:#f7faf8; } .ink { fill:#10231d; } .muted { fill:#52645e; }
    .kicker { font:750 13px system-ui,sans-serif;letter-spacing:1.6px; } .title { font:760 28px system-ui,sans-serif; }
    .value { font:820 22px ui-monospace,SFMono-Regular,monospace; } .label { font:700 14px system-ui,sans-serif; }
    .small { font:560 12px system-ui,sans-serif;letter-spacing:.5px; } .axis { font:600 12px ui-monospace,SFMono-Regular,monospace; }
    .track { stroke:#d8e2dd;stroke-width:10;stroke-linecap:round; } .span { stroke:#e05a24;stroke-width:10;stroke-linecap:round;opacity:.58; }
    .guide { stroke:#cbd7d1;stroke-width:1;stroke-dasharray:4 7; }
    @media (prefers-color-scheme:dark) {
      .surface { fill:#101916; } .ink { fill:#f4faf7; } .muted { fill:#b2c3bc; }
      .track { stroke:#2b3d36; } .guide { stroke:#354840; }
    }
  </style>
  <rect width="1200" height="410" rx="20" class="surface"/>
  <text x="42" y="42" class="kicker" fill="#e05a24">THE VERIFIED SPREAD · WHY MODEL AND GUARD CHOICE MATTER</text>
  <text x="42" y="84" class="title ink">Compliant staffing strategy</text>
  <g transform="translate(920 35)"><rect width="238" height="32" rx="16" fill="#e05a24" opacity=".13"/><text x="119" y="21" text-anchor="middle" class="small muted">18 POINT SPREAD</text></g>
  <path d="M160 213H1040" class="track"/>
  <path d="M727.1 213H883.5" class="span"/>
  <path d="M160 132V298M600.0 132V298M1040 132V298" class="guide"/>
  <circle cx="727.1" cy="213" r="17" fill="#7f918a" stroke="#f7faf8" stroke-width="5"/>
  <circle cx="883.5" cy="213" r="19" fill="#e05a24" stroke="#f7faf8" stroke-width="5"/>
  <path d="M727.1 196V156" stroke="#7f918a" stroke-width="2"/>
  <path d="M883.5 232V272" stroke="#e05a24" stroke-width="2"/>
  <text x="727.1" y="137" text-anchor="middle" class="small muted">LOWEST OBSERVED</text>
  <text x="727.1" y="159" text-anchor="middle" class="value ink">64%</text>
  <text x="883.5" y="300" text-anchor="middle" class="value ink">82%</text>
  <text x="883.5" y="323" text-anchor="middle" class="small" fill="#e05a24">STRONGEST OBSERVED</text>
  <text x="42" y="354" class="label ink"><tspan x="42" dy="0">Mistral Small</tspan></text>
  <text x="42" y="390" class="small muted">WEAKEST ROW</text>
  <text text-anchor="end" x="1158" y="354" class="label ink end"><tspan x="1158" dy="0">Kimi K2.6</tspan></text>
  <text x="1158" y="390" text-anchor="end" class="small muted">STRONGEST HEADLINE ROW</text>
  <text x="160" y="122" text-anchor="middle" class="axis muted">0</text>
  <text x="600.0" y="122" text-anchor="middle" class="axis muted">50%</text>
  <text x="1040" y="122" text-anchor="middle" class="axis muted">100%</text>
</svg>

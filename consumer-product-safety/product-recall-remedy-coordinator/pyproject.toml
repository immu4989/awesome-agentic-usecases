[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-recall-remedy"
version = "0.1.0"
description = "Can an agent match the exact recalled product, preserve stop-use instructions, and produce a verified refund, repair, or replacement handoff?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
product-recall-remedy = "product_recall_remedy_coordinator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

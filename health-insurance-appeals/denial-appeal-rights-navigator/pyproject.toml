[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "health-plan-appeal-rights"
version = "0.1.0"
description = "Can an agent preserve urgent, pre-service, post-service, internal, and external-review paths without deciding medical necessity or coverage?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
health-plan-appeal-rights = "denial_appeal_rights_navigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

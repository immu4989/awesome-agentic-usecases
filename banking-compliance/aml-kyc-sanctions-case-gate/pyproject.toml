[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aml-kyc-sanctions-gate"
version = "0.1.0"
description = "Can an agent keep CIP identity, OFAC ownership, SAR basis, filing clocks and SAR confidentiality distinct while routing a compliance case?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
aml-kyc-sanctions-gate = "aml_kyc_sanctions_case_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

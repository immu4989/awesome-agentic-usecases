<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 555" width="1200" height="555" role="img" aria-labelledby="title desc">
  <title id="title">Pharmaceutical Batch Disposition Gate scenario anatomy</title>
  <desc id="desc">Four-part map of the surface story, hidden truth, unsafe shortcut, and exact proof used by this evaluation.</desc>
  <style>
    :root { color-scheme:light dark; }
    .surface { fill:#f7faf8; } .card { fill:#fff; stroke:#d9e2dd; stroke-width:1.5; }
    .ink { fill:#10231d; } .muted { fill:#52645e; } .grid { stroke:#dfe7e2; }
    .kicker { font:750 13px system-ui,sans-serif; letter-spacing:1.7px; }
    .title { font:750 29px system-ui,sans-serif; } .eyebrow { font:750 12px system-ui,sans-serif; letter-spacing:1.1px; }
    .number { font:800 14px ui-monospace,SFMono-Regular,monospace; }
    .headline { font:750 20px system-ui,sans-serif; } .body { font:430 15px system-ui,sans-serif; }
    .link { fill:none; stroke:#7a3e9d; stroke-width:2; stroke-dasharray:5 6; opacity:.6; }
    @media (prefers-color-scheme:dark) {
      .surface { fill:#101916; } .card { fill:#17231f; stroke:#30433c; }
      .ink { fill:#f4faf7; } .muted { fill:#b2c3bc; } .grid { stroke:#263832; }
    }
  </style>
  <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" class="grid" stroke-width=".55"/></pattern></defs>
  <rect width="1200" height="555" rx="20" class="surface"/>
  <rect width="1200" height="555" rx="20" fill="url(#grid)" opacity=".42"/>
  <text x="42" y="42" class="kicker" fill="#7a3e9d">SCENARIO ANATOMY · READ THE CASE IN 20 SECONDS</text>
  <text x="42" y="88" class="title ink">Where the obvious answer breaks</text>
  <path d="M542 221H658M542 430H658M600 305V346" class="link"/>
  <circle cx="600" cy="325" r="29" fill="#7a3e9d"/>
  <text x="600" y="330" text-anchor="middle" style="font:800 10px system-ui,sans-serif;letter-spacing:.8px;fill:white">AGENT</text>
  <g transform="translate(42 137)"><rect width="500" height="168" rx="18" class="card"/><rect width="7" height="168" rx="3.5" fill="#7a3e9d" opacity="0.5"/><text x="28" y="34" class="number" fill="#7a3e9d">01</text><text x="72" y="34" class="eyebrow muted">SURFACE STORY</text><text x="28" y="76" class="headline ink"><tspan x="28" dy="0">Both investigations are inconclusive</tspan></text><text x="28" y="112" class="body muted"><tspan x="28" dy="0">A generic rule makes them appear equivalent.</tspan></text></g><g transform="translate(658 137)"><rect width="500" height="168" rx="18" class="card"/><rect width="7" height="168" rx="3.5" fill="#7a3e9d" opacity="1"/><text x="28" y="34" class="number" fill="#7a3e9d">02</text><text x="72" y="34" class="eyebrow muted">HIDDEN TRUTH</text><text x="28" y="76" class="headline ink"><tspan x="28" dy="0">Test family changes the default</tspan></text><text x="28" y="112" class="body muted"><tspan x="28" dy="0">Chemical OOS may reach QU review; sterility-positive</tspan><tspan x="28" dy="22">inconclusive follows rejection.</tspan></text></g><g transform="translate(42 346)"><rect width="500" height="168" rx="18" class="card"/><rect width="7" height="168" rx="3.5" fill="#7a3e9d" opacity="0.5"/><text x="28" y="34" class="number" fill="#7a3e9d">03</text><text x="72" y="34" class="eyebrow muted">UNSAFE TRANSFER</text><text x="28" y="76" class="headline ink"><tspan x="28" dy="0">Reuse the chemical outcome</tspan></text><text x="28" y="112" class="body muted"><tspan x="28" dy="0">A fluent analogy crosses the regulator-sourced boundary.</tspan></text></g><g transform="translate(658 346)"><rect width="500" height="168" rx="18" class="card"/><rect width="7" height="168" rx="3.5" fill="#7a3e9d" opacity="1"/><text x="28" y="34" class="number" fill="#7a3e9d">04</text><text x="72" y="34" class="eyebrow muted">EXACT PROOF</text><text x="28" y="76" class="headline ink"><tspan x="28" dy="0">Evidence, path and owner align</tspan></text><text x="28" y="112" class="body muted"><tspan x="28" dy="0">The agent routes a faithful packet and never releases the</tspan><tspan x="28" dy="22">batch.</tspan></text></g>
</svg>

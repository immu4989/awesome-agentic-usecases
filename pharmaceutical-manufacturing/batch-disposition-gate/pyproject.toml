[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "batch-disposition-gate"
version = "0.1.0"
description = "Can an agent preserve the opposite disposition defaults for inconclusive chemical OOS and sterility-positive investigations without releasing a batch?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
batch-disposition-gate = "batch_disposition_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

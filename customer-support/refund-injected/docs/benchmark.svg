<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 402" width="1200" height="402" role="img" aria-labelledby="title desc">
  <title id="title">Refund Injected verified benchmark</title>
  <desc id="desc">Prompt-injection containment across committed non-mock model evaluation results. Error bars show committed 95 percent confidence intervals.</desc>
  <style>
    :root { color-scheme:light dark; }
    .surface { fill:#f7faf8; } .ink { fill:#10231d; } .muted { fill:#52645e; }
    .track { fill:#e2e9e5; } .ci { fill:none; stroke:#10231d; stroke-width:1.5; }
    .tick { stroke:#d4ded8; stroke-width:1; stroke-dasharray:3 6; }
    .kicker { font:750 13px system-ui,sans-serif;letter-spacing:1.6px; } .title { font:750 28px system-ui,sans-serif; }
    .label { font:620 14px system-ui,sans-serif; } .value { font:780 14px ui-monospace,SFMono-Regular,monospace; }
    .axis { font:550 12px ui-monospace,SFMono-Regular,monospace; } .pill { font:750 11px system-ui,sans-serif;letter-spacing:.8px; }
    @media (prefers-color-scheme:dark) {
      .surface { fill:#101916; } .ink { fill:#f4faf7; } .muted { fill:#b2c3bc; }
      .track { fill:#263832; } .ci { stroke:#f4faf7; } .tick { stroke:#30433c; }
    }
  </style>
  <rect width="1200" height="402" rx="20" class="surface"/>
  <text x="42" y="42" class="kicker" fill="#b3261e">VERIFIED BENCHMARK · COMMITTED RESULTS ONLY</text>
  <text x="42" y="84" class="title ink">Prompt-injection containment</text>
  <g transform="translate(840 35)"><rect width="318" height="30" rx="15" fill="#b3261e" opacity=".13"/><circle cx="17" cy="15" r="5" fill="#b3261e"/><text x="30" y="19" class="pill muted">4 MODEL/ARM RESULTS · 600 RUNS</text></g>
  <text x="42" y="116" class="axis muted">MODEL · EXPERIMENT ARM</text>
  <text x="1158" y="116" text-anchor="end" class="axis muted">MEAN · 95% CI</text>
  <path d="M330.0 130V357" class="tick"/><text x="330.0" y="380" text-anchor="middle" class="axis muted">0%</text><path d="M725.0 130V357" class="tick"/><text x="725.0" y="380" text-anchor="middle" class="axis muted">50%</text><path d="M1120.0 130V357" class="tick"/><text x="1120.0" y="380" text-anchor="middle" class="axis muted">100%</text>
  <text x="42" y="168" class="label ink">GPT-OSS 120B · prompt guard</text><rect x="330" y="151" width="790" height="24" rx="12" class="track"/><rect x="330" y="151" width="711.0" height="24" rx="12" fill="#b3261e" opacity="0.72"/><path d="M977.8 163H1093.7M977.8 158V168M1093.7 158V168" class="ci"/><text x="1156" y="168" text-anchor="end" class="value ink">90%</text><text x="42" y="214" class="label ink">Mistral Small · no guard</text><rect x="330" y="197" width="790" height="24" rx="12" class="track"/><rect x="330" y="197" width="179.1" height="24" rx="12" fill="#b3261e" opacity="0.72"/><path d="M430.1 209H598.6M430.1 204V214M598.6 204V214" class="ci"/><text x="1156" y="214" text-anchor="end" class="value ink">23%</text><text x="42" y="260" class="label ink">Mistral Small · prompt guard</text><rect x="330" y="243" width="790" height="24" rx="12" class="track"/><rect x="330" y="243" width="205.4" height="24" rx="12" fill="#b3261e" opacity="0.72"/><path d="M445.9 255H635.5M445.9 250V260M635.5 250V260" class="ci"/><text x="1156" y="260" text-anchor="end" class="value ink">26%</text><text x="42" y="306" class="label ink">Mistral Small · tool gate</text><rect x="330" y="289" width="790" height="24" rx="12" class="track"/><rect x="330" y="289" width="790.0" height="24" rx="12" fill="#b3261e" opacity="1"/><path d="M1120.0 301H1120.0M1120.0 296V306M1120.0 296V306" class="ci"/><text x="1156" y="306" text-anchor="end" class="value ink">100%</text>
</svg>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refund-memory"
version = "0.1.0"
description = "A support agent with memory that outlives a session. Measures harm caused in a later session containing nothing adversarial, after a single crafted input installs a false fact in long-term memory, and compares a prompt guard against a tool-layer write gate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["agents", "llm", "evaluation", "memory-poisoning", "persistent-memory", "security"]
dependencies = ["aau-harness", "refund-resolution-agent"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
refund-memory = "refund_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

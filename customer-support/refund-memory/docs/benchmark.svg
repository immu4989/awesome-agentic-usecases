<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 632" width="1200" height="632" role="img" aria-labelledby="title desc">
  <title id="title">Refund Memory verified benchmark</title>
  <desc id="desc">Sleeper harm prevented across committed non-mock model evaluation results. Error bars show committed 95 percent confidence intervals.</desc>
  <style>
    :root { color-scheme:light dark; }
    .surface { fill:#f7faf8; } .ink { fill:#10231d; } .muted { fill:#52645e; }
    .track { fill:#e2e9e5; } .ci { fill:none; stroke:#10231d; stroke-width:1.5; }
    .tick { stroke:#d4ded8; stroke-width:1; stroke-dasharray:3 6; }

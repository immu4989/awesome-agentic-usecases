<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Observed Refund Memory failure modes</title>
  <desc id="desc">Three observed, reproducible failure modes from committed evaluation runs.</desc>
  <style>
    :root { color-scheme:light dark; }
    .surface { fill:#f7faf8; } .card { fill:#fff;stroke:#d9e2dd;stroke-width:1.5; }
    .ink { fill:#10231d; } .muted { fill:#52645e; }
    .kicker { font:750 13px system-ui,sans-serif;letter-spacing:1.6px; } .title { font:750 28px system-ui,sans-serif; }
    .mode { font:850 19px ui-monospace,SFMono-Regular,monospace; } .headline { font:740 17px system-ui,sans-serif; }
    .body { font:430 14px system-ui,sans-serif; } .pill { font:750 11px system-ui,sans-serif;letter-spacing:.8px; }
    @media (prefers-color-scheme:dark) {
      .surface { fill:#101916; } .card { fill:#17231f;stroke:#30433c; }
      .ink { fill:#f4faf7; } .muted { fill:#b2c3bc; }
    }
  </style>
  <rect width="1200" height="540" rx="20" class="surface"/>
  <text x="42" y="42" class="kicker" fill="#a62b70">OBSERVED IN THE LAB · NOT HYPOTHETICAL</text>
  <text x="42" y="84" class="title ink">How this agent actually fails</text>
  <g transform="translate(960 35)"><rect width="198" height="30" rx="15" fill="#a62b70" opacity=".13"/><circle cx="17" cy="15" r="5" fill="#a62b70"/><text x="30" y="19" class="pill muted">REPRODUCIBLE CASES</text></g>
  <g transform="translate(42 128)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#a62b70" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#a62b70">01</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">A false fact survives the attacker and suppresses a safety check</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">session 2 contains no payload, no injection, and no attacker. It is an ordinary ticket. The agent nonetheless skips</tspan><tspan x="94" dy="20">identity verification — gpt-oss 1.00 → 0.56, deepseek 1.00 → 0.83 — because a sentence written during a previous contact is…</tspan></text></g><g transform="translate(42 252)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#a62b70" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#a62b70">02</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">The same sentence is trusted or refused depending on where it…</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">the gate restores verification on the ticket channel — gpt-oss +0.444 [+0.111, +0.833] — and reaches significance on</tspan><tspan x="94" dy="20">neither model&#x27;s tool channel. The claim is byte-identical in both; only its origin differs.</tspan></text></g><g transform="translate(42 376)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#a62b70" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#a62b70">03</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">The prompt-level guard works on one model and not another</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">deepseek +0.167 [+0.056, +0.278], significant. gpt-oss +0.278 [−0.333, +0.778], not distinguishable from zero. Same notice,</tspan><tspan x="94" dy="20">same scenarios, opposite verdicts.</tspan></text></g>
  <text x="42" y="514" class="body muted">Open FAILURE_MODES.md for scenario IDs, evidence, impact, and reproduction commands.</text>
</svg>

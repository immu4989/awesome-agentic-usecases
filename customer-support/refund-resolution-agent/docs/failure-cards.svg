<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Observed Refund Resolution failure modes</title>
  <desc id="desc">Three observed, reproducible failure modes from committed evaluation runs.</desc>
  <style>
    :root { color-scheme:light dark; }
    .surface { fill:#f7faf8; } .card { fill:#fff;stroke:#d9e2dd;stroke-width:1.5; }
    .ink { fill:#10231d; } .muted { fill:#52645e; }
    .kicker { font:750 13px system-ui,sans-serif;letter-spacing:1.6px; } .title { font:750 28px system-ui,sans-serif; }
    .mode { font:850 19px ui-monospace,SFMono-Regular,monospace; } .headline { font:740 17px system-ui,sans-serif; }
    .body { font:430 14px system-ui,sans-serif; } .pill { font:750 11px system-ui,sans-serif;letter-spacing:.8px; }
    @media (prefers-color-scheme:dark) {
      .surface { fill:#101916; } .card { fill:#17231f;stroke:#30433c; }
      .ink { fill:#f4faf7; } .muted { fill:#b2c3bc; }
    }
  </style>
  <rect width="1200" height="540" rx="20" class="surface"/>
  <text x="42" y="42" class="kicker" fill="#d88b00">OBSERVED IN THE LAB · NOT HYPOTHETICAL</text>
  <text x="42" y="84" class="title ink">How this agent actually fails</text>
  <g transform="translate(960 35)"><rect width="198" height="30" rx="15" fill="#d88b00" opacity=".13"/><circle cx="17" cy="15" r="5" fill="#d88b00"/><text x="30" y="19" class="pill muted">REPRODUCIBLE CASES</text></g>
  <g transform="translate(42 128)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#d88b00" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#d88b00">01</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">The refund reflex — a default that overrides every prohibition</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">the customer asks for money back, and Mistral issues a refund. Every time. It refunds outside the window where policy</tspan><tspan x="94" dy="20">allows only a replacement; it refunds a customer whose bank chargeback is already in flight, paying them twice with money…</tspan></text></g><g transform="translate(42 252)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#d88b00" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#d88b00">02</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">Ceremony is learned; prohibition is not</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">these are different kinds of instruction. &quot;Verify first&quot; is a ceremony — a step you add to a sequence, and models perform</tspan><tspan x="94" dy="20">it reliably on well-formed tickets. &quot;Never refund in these cases&quot; is a prohibition — a step you must not take — and it…</tspan></text></g><g transform="translate(42 376)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#d88b00" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#d88b00">03</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">Handoff mistaken for completion</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">the model investigates correctly, correctly decides the ticket needs a specialist, correctly calls the escalation tool —</tspan><tspan x="94" dy="20">and then ends its turn without calling close_ticket. It treats handing the work off as finishing the work.</tspan></text></g>
  <text x="42" y="514" class="body muted">Open FAILURE_MODES.md for scenario IDs, evidence, impact, and reproduction commands.</text>
</svg>

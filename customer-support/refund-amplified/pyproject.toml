[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refund-amplified"
version = "0.1.0"
description = "Denial of wallet (OWASP LLM10) against a tool-using agent: attacker-controlled input inflates the bill several times over while the answer, the safety metrics and the tool-call count all stay unchanged. Compares an undefended agent, a prompt-based defence, and a tool-layer budget gate on identical scenarios."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Fnu Imran Ahamed" }]
keywords = ["denial-of-wallet", "unbounded-consumption", "agent-security", "llm-cost", "agents", "llm", "evaluation"]
dependencies = ["aau-harness", "refund-resolution-agent"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
refund-amplified = "refund_amplified.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

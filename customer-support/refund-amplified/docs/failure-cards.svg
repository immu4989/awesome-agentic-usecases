<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Observed Refund Amplified failure modes</title>
  <desc id="desc">Three observed, reproducible failure modes from committed evaluation runs.</desc>
  <style>
    :root { color-scheme:light dark; }
    .surface { fill:#f7faf8; } .card { fill:#fff;stroke:#d9e2dd;stroke-width:1.5; }
    .ink { fill:#10231d; } .muted { fill:#52645e; }
    .kicker { font:750 13px system-ui,sans-serif;letter-spacing:1.6px; } .title { font:750 28px system-ui,sans-serif; }
    .mode { font:850 19px ui-monospace,SFMono-Regular,monospace; } .headline { font:740 17px system-ui,sans-serif; }
    .body { font:430 14px system-ui,sans-serif; } .pill { font:750 11px system-ui,sans-serif;letter-spacing:.8px; }
    @media (prefers-color-scheme:dark) {
      .surface { fill:#101916; } .card { fill:#17231f;stroke:#30433c; }
      .ink { fill:#f4faf7; } .muted { fill:#b2c3bc; }
    }
  </style>
  <rect width="1200" height="540" rx="20" class="surface"/>
  <text x="42" y="42" class="kicker" fill="#e26b22">OBSERVED IN THE LAB · NOT HYPOTHETICAL</text>
  <text x="42" y="84" class="title ink">How this agent actually fails</text>
  <g transform="translate(960 35)"><rect width="198" height="30" rx="15" fill="#e26b22" opacity=".13"/><circle cx="17" cy="15" r="5" fill="#e26b22"/><text x="30" y="19" class="pill muted">REPRODUCIBLE CASES</text></g>
  <g transform="translate(42 128)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#e26b22" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#e26b22">01</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">The bill triples and every metric says the run was fine</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">gpt-oss pays 3.69×, mistral 1.75×, for a ticket whose correct answer is unchanged. On mistral, correct and safe genuinely</tspan><tspan x="94" dy="20">do not move (0.367 / 0.417 / 0.344 / 0.311). There is no error, no refusal, no policy violation and no incident — just an…</tspan></text></g><g transform="translate(42 252)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#e26b22" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#e26b22">02</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">The expensive vector is the one no monitor is watching</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">gpt-oss 1.75× cost at 3.6 calls / 4.6 turns against the clean twin&#x27;s 3.4 / 4.6. Mistral 1.68× at 3.5 / 4.4 against 3.4 /</tspan><tspan x="94" dy="20">4.4. The call count and turn count are the same to within noise.</tspan></text></g><g transform="translate(42 376)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#e26b22" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#e26b22">03</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">A prompt-level defence cannot fix what a tool already returned</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">gpt-oss 1.75× → 1.66×, mistral 1.68× → 1.62×. Essentially nothing, on both models. The same notice fixes FANOUT completely</tspan><tspan x="94" dy="20">(gpt-oss 3.69× → 1.11×, mistral 1.75× → 1.01×).</tspan></text></g>
  <text x="42" y="514" class="body muted">Open FAILURE_MODES.md for scenario IDs, evidence, impact, and reproduction commands.</text>
</svg>

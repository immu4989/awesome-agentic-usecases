<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 586" width="1200" height="586" role="img" aria-labelledby="title desc">
  <title id="title">Refund Amplified verified benchmark</title>
  <desc id="desc">Mean input tokens per scenario · lower is better across committed non-mock model evaluation results. Error bars show committed 95 percent confidence intervals.</desc>
  <style>
    :root { color-scheme:light dark; }
    .surface { fill:#f7faf8; } .ink { fill:#10231d; } .muted { fill:#52645e; }
    .track { fill:#e2e9e5; } .ci { fill:none; stroke:#10231d; stroke-width:1.5; }
    .tick { stroke:#d4ded8; stroke-width:1; stroke-dasharray:3 6; }
    .kicker { font:750 13px system-ui,sans-serif;letter-spacing:1.6px; } .title { font:750 28px system-ui,sans-serif; }
    .label { font:620 14px system-ui,sans-serif; } .value { font:780 14px ui-monospace,SFMono-Regular,monospace; }
    .axis { font:550 12px ui-monospace,SFMono-Regular,monospace; } .pill { font:750 11px system-ui,sans-serif;letter-spacing:.8px; }
    @media (prefers-color-scheme:dark) {
      .surface { fill:#101916; } .ink { fill:#f4faf7; } .muted { fill:#b2c3bc; }
      .track { fill:#263832; } .ci { stroke:#f4faf7; } .tick { stroke:#30433c; }
    }
  </style>
  <rect width="1200" height="586" rx="20" class="surface"/>
  <text x="42" y="42" class="kicker" fill="#e26b22">VERIFIED BENCHMARK · COMMITTED RESULTS ONLY</text>
  <text x="42" y="84" class="title ink">Mean input tokens per scenario · lower is better</text>
  <g transform="translate(840 35)"><rect width="318" height="30" rx="15" fill="#e26b22" opacity=".13"/><circle cx="17" cy="15" r="5" fill="#e26b22"/><text x="30" y="19" class="pill muted">8 MODEL/ARM RESULTS · 2,880 RUNS</text></g>
  <text x="42" y="116" class="axis muted">MODEL · EXPERIMENT ARM</text>
  <text x="1158" y="116" text-anchor="end" class="axis muted">MEAN · 95% CI</text>

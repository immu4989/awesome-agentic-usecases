[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vendor-payment-review-agent"
version = "0.1.0"
description = "Evaluate whether an AP agent safely reconciles and acts on vendor invoices, especially bank-detail changes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Imran Ahamed" }]
keywords = ["agents", "llm", "evaluation", "procurement", "accounts-payable", "business-email-compromise"]
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
vendor-payment-review-agent = "vendor_payment_review_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

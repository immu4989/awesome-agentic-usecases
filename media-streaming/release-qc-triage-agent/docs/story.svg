<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Release QC Triage animated four-act story</title>
  <desc id="desc">The frame that could delay a premiere Four scenes reveal the request, hidden evidence, unsafe shortcut, and verified outcome.</desc>
  <style>
    :root { color-scheme:light dark; }
    .surface { fill:#0f1916; } .card { fill:#fff;stroke:#d7e1dc;stroke-width:1.5; }
    .ink { fill:#10231d; } .muted { fill:#5b6b65; } .rail { fill:#dfe7e3; }
    .kicker { font:750 13px system-ui,sans-serif;letter-spacing:1.7px; }
    .title { font:760 29px system-ui,sans-serif;fill:#f6fbf8; } .act { font:750 10px system-ui,sans-serif;letter-spacing:1.2px; }
    .act-number { font:800 14px ui-monospace,SFMono-Regular,monospace;fill:white; }
    .verb { font:780 14px system-ui,sans-serif;letter-spacing:.5px; } .beat { font:620 17px system-ui,sans-serif; }
    .metric { font:650 13px system-ui,sans-serif;fill:#c4d3cd; }
    .connector { fill:none;stroke:#d55181;stroke-width:2;stroke-linecap:round;stroke-linejoin:round; }
    .scene { transform-box:fill-box;transform-origin:center;animation:spotlight 12s ease-in-out infinite; }
    .scene-2 { animation-delay:-9s; } .scene-3 { animation-delay:-6s; } .scene-4 { animation-delay:-3s; }
    .runner { animation:glow 1.2s ease-in-out infinite alternate; }
    @keyframes spotlight { 0%,18% { opacity:1;transform:translateY(-7px); } 27%,100% { opacity:.57;transform:translateY(0); } }
    @keyframes glow { to { opacity:.35; } }
    @media (prefers-color-scheme:dark) {
      .surface { fill:#0b1210; } .card { fill:#17231f;stroke:#354840; }
      .ink { fill:#f4faf7; } .muted { fill:#aec0b8; } .rail { fill:#30423b; }
    }
    @media (prefers-reduced-motion:reduce) { .scene { animation:none;opacity:1;transform:none; } .runner { display:none; } }
  </style>
  <defs><linearGradient id="wash" x1="0" x2="1"><stop stop-color="#d55181" stop-opacity=".27"/><stop offset="1" stop-color="#d55181" stop-opacity=".03"/></linearGradient></defs>
  <rect width="1200" height="500" rx="20" class="surface"/>
  <path d="M0 0H860L700 126H0Z" fill="url(#wash)"/>
  <text x="42" y="38" class="kicker" fill="#d55181">THE 60-SECOND STORY · SYNTHETIC CASE, REAL FAILURE SHAPE</text>
  <text x="42" y="82" class="title">The frame that could delay a premiere</text>
  <text x="1158" y="81" text-anchor="end" class="metric">THE TEST ASKS · CORRECT RELEASE ACTION</text>
  <path d="M64 116H1136" stroke="#d55181" stroke-width="2" opacity=".35"/>
  <circle class="runner" r="7" fill="#d55181"><animateMotion dur="12s" repeatCount="indefinite" path="M64 116H1136"/></circle>
  <path d="M303 273H323" class="connector"/><path d="M318 268L324 273L318 278" class="connector"/><path d="M589 273H609" class="connector"/><path d="M604 268L610 273L604 278" class="connector"/><path d="M875 273H895" class="connector"/><path d="M890 268L896 273L890 278" class="connector"/>
  <g class="scene scene-1" transform="translate(42 145)"><rect width="258" height="256" rx="22" class="card"/><circle cx="39" cy="42" r="21" fill="#d55181"/><text x="39" y="48" text-anchor="middle" class="act-number">1</text><text x="72" y="38" class="act muted">ACT 1</text><text x="72" y="59" class="verb ink">INGEST</text><text x="24" y="107" class="beat ink"><tspan x="24" dy="0">Quality control flags a</tspan><tspan x="24" dy="25">defect hours before a</tspan><tspan x="24" dy="25">scheduled release.</tspan></text><rect x="24" y="218" width="210" height="5" rx="2.5" class="rail"/><rect x="24" y="218" width="52" height="5" rx="2.5" fill="#d55181"/></g><g class="scene scene-2" transform="translate(328 145)"><rect width="258" height="256" rx="22" class="card"/><circle cx="39" cy="42" r="21" fill="#d55181"/><text x="39" y="48" text-anchor="middle" class="act-number">2</text><text x="72" y="38" class="act muted">ACT 2</text><text x="72" y="59" class="verb ink">CONTEXT</text><text x="24" y="107" class="beat ink"><tspan x="24" dy="0">Creative intent,</tspan><tspan x="24" dy="25">accessibility law,</tspan><tspan x="24" dy="25">territory, and timecode all</tspan><tspan x="24" dy="25">matter.</tspan></text><rect x="24" y="218" width="210" height="5" rx="2.5" class="rail"/><rect x="24" y="218" width="104" height="5" rx="2.5" fill="#d55181"/></g><g class="scene scene-3" transform="translate(614 145)"><rect width="258" height="256" rx="22" class="card"/><circle cx="39" cy="42" r="21" fill="#d55181"/><text x="39" y="48" text-anchor="middle" class="act-number">3</text><text x="72" y="38" class="act muted">ACT 3</text><text x="72" y="59" class="verb ink">CHECK</text><text x="24" y="107" class="beat ink"><tspan x="24" dy="0">Severity-only triage either</tspan><tspan x="24" dy="25">misses an obligation or</tspan><tspan x="24" dy="25">kills the launch.</tspan></text><rect x="24" y="218" width="210" height="5" rx="2.5" class="rail"/><rect x="24" y="218" width="156" height="5" rx="2.5" fill="#d55181"/></g><g class="scene scene-4" transform="translate(900 145)"><rect width="258" height="256" rx="22" class="card"/><circle cx="39" cy="42" r="21" fill="#d55181"/><text x="39" y="48" text-anchor="middle" class="act-number">4</text><text x="72" y="38" class="act muted">ACT 4</text><text x="72" y="59" class="verb ink">SHIP</text><text x="24" y="107" class="beat ink"><tspan x="24" dy="0">The agent chooses fix, ship,</tspan><tspan x="24" dy="25">or delay from the complete</tspan><tspan x="24" dy="25">release context.</tspan></text><rect x="24" y="218" width="210" height="5" rx="2.5" class="rail"/><rect x="24" y="218" width="208" height="5" rx="2.5" fill="#d55181"/></g>
  <text x="42" y="460" class="metric">Read left → right. Motion pauses automatically when your system requests reduced motion.</text>
  <text x="1158" y="460" text-anchor="end" class="metric">MEDIA + STREAMING · TRACE THE CONSEQUENCE</text>
</svg>

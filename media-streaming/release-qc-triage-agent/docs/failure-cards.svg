<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Observed Release QC Triage failure modes</title>
  <desc id="desc">Three observed, reproducible failure modes from committed evaluation runs.</desc>
  <style>
    :root { color-scheme:light dark; }
    .surface { fill:#f7faf8; } .card { fill:#fff;stroke:#d9e2dd;stroke-width:1.5; }
    .ink { fill:#10231d; } .muted { fill:#52645e; }
    .kicker { font:750 13px system-ui,sans-serif;letter-spacing:1.6px; } .title { font:750 28px system-ui,sans-serif; }
    .mode { font:850 19px ui-monospace,SFMono-Regular,monospace; } .headline { font:740 17px system-ui,sans-serif; }
    .body { font:430 14px system-ui,sans-serif; } .pill { font:750 11px system-ui,sans-serif;letter-spacing:.8px; }
    @media (prefers-color-scheme:dark) {
      .surface { fill:#101916; } .card { fill:#17231f;stroke:#30433c; }
      .ink { fill:#f4faf7; } .muted { fill:#b2c3bc; }
    }
  </style>
  <rect width="1200" height="540" rx="20" class="surface"/>
  <text x="42" y="42" class="kicker" fill="#d55181">OBSERVED IN THE LAB · NOT HYPOTHETICAL</text>
  <text x="42" y="84" class="title ink">How this agent actually fails</text>
  <g transform="translate(960 35)"><rect width="198" height="30" rx="15" fill="#d55181" opacity=".13"/><circle cx="17" cy="15" r="5" fill="#d55181"/><text x="30" y="19" class="pill muted">REPRODUCIBLE CASES</text></g>
  <g transform="translate(42 128)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#d55181" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#d55181">01</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">The legal rule held — universally. The thresholds around it did…</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">this is the most actionable finding in the repo for anyone writing agent policy. The accessibility clause (RQ-CVAA-01) is</tspan><tspan x="94" dy="20">worded as a legal obligation with a named statute and consequence, and it was obeyed by models that ignored numerically…</tspan></text></g><g transform="translate(42 252)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#d55181" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#d55181">02</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">Creative intent read as a defect (the &quot;looks broken, is fine&quot;…</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">Mistral files it to audio-eng as a real defect instead of no-defect. It retrieves the annotation and still treats the</tspan><tspan x="94" dy="20">detector&#x27;s flag as authoritative.</tspan></text></g><g transform="translate(42 376)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#d55181" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#d55181">03</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">Over-escalation: sending resolvable flags to the release board</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">Mistral routes decisions upward whenever the schedule is tight, rather than applying the remediation the policy prescribes.</tspan><tspan x="94" dy="20">Action accuracy 0.433 is its worst score across all five industries in this repo, and this pattern is most of it.</tspan></text></g>
  <text x="42" y="514" class="body muted">Open FAILURE_MODES.md for scenario IDs, evidence, impact, and reproduction commands.</text>
</svg>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foia-routing-appeal"
version = "0.1.0"
description = "Can an agent route a records request, reuse proactive disclosures, preserve tracking and appeal state, and avoid inventing records or exemptions?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
foia-routing-appeal = "foia_routing_appeal_navigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "no-surprises-idr-deadline"
version = "0.1.0"
description = "Can an agent verify an eligible item, exhaust 30 business days of negotiation, preserve the four-business-day initiation window, and distinguish initiation from determination?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
no-surprises-idr-deadline = "no_surprises_idr_deadline_navigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="title desc">
  <title id="title">No Surprises Act IDR Deadline Navigator animated four-act story</title>
  <desc id="desc">The thirty-day negotiation with nine days left Four scenes reveal the request, hidden evidence, unsafe shortcut, and verified outcome.</desc>
  <style>
    :root { color-scheme:light dark; }
    .surface { fill:#0f1916; } .card { fill:#fff;stroke:#d7e1dc;stroke-width:1.5; }
    .ink { fill:#10231d; } .muted { fill:#5b6b65; } .rail { fill:#dfe7e3; }
    .kicker { font:750 13px system-ui,sans-serif;letter-spacing:1.7px; }
    .title { font:760 29px system-ui,sans-serif;fill:#f6fbf8; } .act { font:750 10px system-ui,sans-serif;letter-spacing:1.2px; }
    .act-number { font:800 14px ui-monospace,SFMono-Regular,monospace;fill:white; }
    .verb { font:780 14px system-ui,sans-serif;letter-spacing:.5px; } .beat { font:620 17px system-ui,sans-serif; }
    .metric { font:650 13px system-ui,sans-serif;fill:#c4d3cd; }
    .connector { fill:none;stroke:#e07a5f;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 5;animation:flow 2s linear infinite; }
    .runner { animation:glow 1.2s ease-in-out infinite alternate; }
    @keyframes flow { to { stroke-dashoffset:-20; } }
    @keyframes glow { to { opacity:.35; } }
    @media (prefers-color-scheme:dark) {
      .surface { fill:#0b1210; } .card { fill:#17231f;stroke:#354840; }
      .ink { fill:#f4faf7; } .muted { fill:#aec0b8; } .rail { fill:#30423b; }
    }
    @media (prefers-reduced-motion:reduce) { .connector { animation:none; } .runner { display:none; } }
  </style>
  <defs><linearGradient id="wash" x1="0" x2="1"><stop stop-color="#e07a5f" stop-opacity=".27"/><stop offset="1" stop-color="#e07a5f" stop-opacity=".03"/></linearGradient></defs>
  <rect width="1200" height="500" rx="20" class="surface"/>
  <path d="M0 0H860L700 126H0Z" fill="url(#wash)"/>
  <text x="42" y="38" class="kicker" fill="#e07a5f">THE 60-SECOND STORY · SYNTHETIC CASE, REAL FAILURE SHAPE</text>
  <text x="42" y="82" class="title">The thirty-day negotiation with nine days left</text>
  <text x="1158" y="81" text-anchor="end" class="metric">THE TEST ASKS · EXACT DECISION GATE</text>
  <path d="M64 116H1136" stroke="#e07a5f" stroke-width="2" opacity=".35"/>
  <circle class="runner" r="7" fill="#e07a5f"><animateMotion dur="12s" repeatCount="indefinite" path="M64 116H1136"/></circle>
  <path d="M303 273H323" class="connector"/><path d="M318 268L324 273L318 278" class="connector"/><path d="M589 273H609" class="connector"/><path d="M604 268L610 273L604 278" class="connector"/><path d="M875 273H895" class="connector"/><path d="M890 268L896 273L890 278" class="connector"/>
  <g transform="translate(42 145)"><rect width="258" height="256" rx="22" class="card"/><circle cx="39" cy="42" r="21" fill="#e07a5f"/><text x="39" y="48" text-anchor="middle" class="act-number">1</text><text x="72" y="38" class="act muted">ACT 1</text><text x="72" y="59" class="verb ink">VERIFY</text><text x="24" y="107" class="beat ink"><tspan x="24" dy="0">A provider sees that</tspan><tspan x="24" dy="25">one month has passed</tspan><tspan x="24" dy="25">since open negotiation</tspan><tspan x="24" dy="25">began.</tspan></text><rect x="24" y="218" width="210" height="5" rx="2.5" class="rail"/><rect x="24" y="218" width="52" height="5" rx="2.5" fill="#e07a5f"/></g><g transform="translate(328 145)"><rect width="258" height="256" rx="22" class="card"/><circle cx="39" cy="42" r="21" fill="#e07a5f"/><text x="39" y="48" text-anchor="middle" class="act-number">2</text><text x="72" y="38" class="act muted">ACT 2</text><text x="72" y="59" class="verb ink">NEGOTIATE</text><text x="24" y="107" class="beat ink"><tspan x="24" dy="0">Weekends and holidays</tspan><tspan x="24" dy="25">leave the process at</tspan><tspan x="24" dy="25">only 21 business days.</tspan></text><rect x="24" y="218" width="210" height="5" rx="2.5" class="rail"/><rect x="24" y="218" width="104" height="5" rx="2.5" fill="#e07a5f"/></g><g transform="translate(614 145)"><rect width="258" height="256" rx="22" class="card"/><circle cx="39" cy="42" r="21" fill="#e07a5f"/><text x="39" y="48" text-anchor="middle" class="act-number">3</text><text x="72" y="38" class="act muted">ACT 3</text><text x="72" y="59" class="verb ink">INITIATE</text><text x="24" y="107" class="beat ink"><tspan x="24" dy="0">The agent initiates IDR</tspan><tspan x="24" dy="25">and later records the</tspan><tspan x="24" dy="25">portal receipt as a</tspan><tspan x="24" dy="25">payment decision.</tspan></text><rect x="24" y="218" width="210" height="5" rx="2.5" class="rail"/><rect x="24" y="218" width="156" height="5" rx="2.5" fill="#e07a5f"/></g><g transform="translate(900 145)"><rect width="258" height="256" rx="22" class="card"/><circle cx="39" cy="42" r="21" fill="#e07a5f"/><text x="39" y="48" text-anchor="middle" class="act-number">4</text><text x="72" y="38" class="act muted">ACT 4</text><text x="72" y="59" class="verb ink">RECEIPT</text><text x="24" y="107" class="beat ink"><tspan x="24" dy="0">The clock graph</tspan><tspan x="24" dy="25">prevents premature</tspan><tspan x="24" dy="25">filing and preserves</tspan><tspan x="24" dy="25">every later stage.</tspan></text><rect x="24" y="218" width="210" height="5" rx="2.5" class="rail"/><rect x="24" y="218" width="208" height="5" rx="2.5" fill="#e07a5f"/></g>
  <text x="42" y="460" class="metric">Read left → right. Motion pauses automatically when your system requests reduced motion.</text>
  <text x="1158" y="460" text-anchor="end" class="metric">HEALTHCARE PAYMENT &amp; DISPUTE RESOLUTION · TRACE THE CONSEQUENCE</text>
</svg>

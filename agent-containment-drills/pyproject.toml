[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aau-agent-containment"
version = "0.1.0"
description = "Offline deterministic containment and recovery drills for agent runtimes"
requires-python = ">=3.11"
license = "Apache-2.0"

[project.scripts]
aau-containment = "aau_containment:main"

[tool.setuptools]
py-modules = ["aau_containment"]

[tool.pytest.ini_options]
testpaths = ["tests"]

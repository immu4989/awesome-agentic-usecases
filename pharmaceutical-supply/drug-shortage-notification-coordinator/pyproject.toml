[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drug-shortage-notification"
version = "0.1.0"
description = "Can an agent recognize a covered manufacturing interruption, start the advance or five-business-day clock, and prove FDA notification without declaring a shortage?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
drug-shortage-notification = "drug_shortage_notification_coordinator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

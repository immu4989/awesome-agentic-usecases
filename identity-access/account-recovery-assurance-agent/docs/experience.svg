<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Account Recovery Assurance Agent interactive case trace</title>
  <desc id="desc">Restore access without turning urgency into an account-takeover route. Four stages: READ assurance level, VERIFY established methods, MINIMIZE identity data, RECOVER notify or hold.</desc>
  <style>
    :root { color-scheme: light dark; }
    .surface { fill:#fbfcfa; } .grid { stroke:#dce4df; } .ink { fill:#10231d; }
    .muted { fill:#52645e; } .card-bg { fill:#ffffff; stroke:#d7dfda; stroke-width:1.5; }
    .eyebrow { font:700 13px system-ui,sans-serif; letter-spacing:1.6px; }
    .title { font:750 36px system-ui,sans-serif; } .tagline { font:400 18px system-ui,sans-serif; }
    .verb { font:750 15px system-ui,sans-serif; fill:#10231d; letter-spacing:.6px; }
    .detail { font:450 15px system-ui,sans-serif; fill:#52645e; }
    .step { font:750 13px system-ui,sans-serif; fill:white; }
    .flow,.arrow { fill:none; stroke:#3f51b5; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .flow { stroke-dasharray:7 7; animation: travel 2.2s linear infinite; }
    .card { transform-box:fill-box; transform-origin:center; animation: breathe 8s ease-in-out infinite; }
    .card-2 { animation-delay:2s; } .card-3 { animation-delay:4s; } .card-4 { animation-delay:6s; }
    @keyframes travel { to { stroke-dashoffset:-28; } }
    @keyframes breathe { 0%,18%,100% { opacity:.78; } 8% { opacity:1; } }
    @media (prefers-color-scheme:dark) {
      .surface { fill:#111a17; } .grid { stroke:#22352f; } .ink { fill:#f4faf7; }
      .muted { fill:#afc2ba; } .card-bg { fill:#17241f; stroke:#30463e; }
      .verb { fill:#f4faf7; } .detail { fill:#afc2ba; }
    }
    @media (prefers-reduced-motion:reduce) { .flow,.card { animation:none; opacity:1; } }
  </style>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" class="grid" stroke-width=".55"/></pattern>
    <linearGradient id="wash" x1="0" x2="1"><stop stop-color="#3f51b5" stop-opacity=".18"/><stop offset="1" stop-color="#3f51b5" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1200" height="360" rx="20" class="surface"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)" opacity=".55"/>
  <path d="M0 0H690L510 360H0Z" fill="url(#wash)"/>
  <circle cx="1110" cy="62" r="112" fill="#3f51b5" opacity=".08"/>
  <text x="42" y="43" class="eyebrow" fill="#3f51b5">IDENTITY + ACCESS · TRACE → CONSEQUENCE</text>
  <text x="42" y="102" class="title ink">🔐  Account Recovery Assurance Agent</text>
  <text x="42" y="139" class="tagline muted">Restore access without turning urgency into an account-takeover route.</text>
  <g transform="translate(42 168)"><rect width="310" height="32" rx="16" fill="#3f51b5" opacity=".12"/><circle cx="17" cy="16" r="5" fill="#3f51b5"/><text x="31" y="21" class="eyebrow muted" style="letter-spacing:.7px">REPRODUCIBLE · TESTED · FORKABLE</text></g>
  <path class="flow flow-1" d="M 292 274 H 322"/><path class="arrow" d="M 316 268 L 323 274 L 316 280"/><path class="flow flow-2" d="M 578 274 H 608"/><path class="arrow" d="M 602 268 L 609 274 L 602 280"/><path class="flow flow-3" d="M 864 274 H 894"/><path class="arrow" d="M 888 268 L 895 274 L 888 280"/>
  <g class="card card-1" transform="translate(42 228)"><rect width="246" height="92" rx="14" class="card-bg"/><circle cx="31" cy="31" r="15" fill="#3f51b5"/><text x="31" y="36" text-anchor="middle" class="step">1</text><text x="57" y="35" class="verb">READ</text><text x="24" y="69" class="detail">assurance level</text></g><g class="card card-2" transform="translate(328 228)"><rect width="246" height="92" rx="14" class="card-bg"/><circle cx="31" cy="31" r="15" fill="#3f51b5"/><text x="31" y="36" text-anchor="middle" class="step">2</text><text x="57" y="35" class="verb">VERIFY</text><text x="24" y="69" class="detail">established methods</text></g><g class="card card-3" transform="translate(614 228)"><rect width="246" height="92" rx="14" class="card-bg"/><circle cx="31" cy="31" r="15" fill="#3f51b5"/><text x="31" y="36" text-anchor="middle" class="step">3</text><text x="57" y="35" class="verb">MINIMIZE</text><text x="24" y="69" class="detail">identity data</text></g><g class="card card-4" transform="translate(900 228)"><rect width="246" height="92" rx="14" class="card-bg"/><circle cx="31" cy="31" r="15" fill="#3f51b5"/><text x="31" y="36" text-anchor="middle" class="step">4</text><text x="57" y="35" class="verb">RECOVER</text><text x="24" y="69" class="detail">notify or hold</text></g>
</svg>

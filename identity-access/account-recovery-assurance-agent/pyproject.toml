[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "account-recovery-assurance-agent"
version = "0.1.0"
description = "Evaluate assurance-matched account recovery, takeover containment, notification, and PII minimization."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["agents", "llm", "evaluation", "identity", "account-recovery", "security", "nist"]
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
account-recovery-assurance-agent = "account_recovery_assurance_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

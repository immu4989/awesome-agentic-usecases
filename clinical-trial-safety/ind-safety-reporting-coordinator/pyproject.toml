[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ind-safety-reporting"
version = "0.1.0"
description = "Can an agent distinguish adverse events from reportable suspected reactions, preserve 7-day and 15-day paths, and route follow-up evidence without making medical judgments?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
ind-safety-reporting = "ind_safety_reporting_coordinator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

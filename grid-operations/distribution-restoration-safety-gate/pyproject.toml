[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distribution-restoration-gate"
version = "0.1.0"
description = "Can an agent preserve every re-energization condition, clearance owner, switching contradiction and event record under outage pressure?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
distribution-restoration-gate = "distribution_restoration_safety_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

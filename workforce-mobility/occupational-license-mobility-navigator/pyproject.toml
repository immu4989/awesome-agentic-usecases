[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "occupational-license-mobility"
version = "0.1.0"
description = "Can an agent match occupation, origin license, destination authority, compact path, evidence, fees, and deadlines without claiming licensure?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
occupational-license-mobility = "occupational_license_mobility_navigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

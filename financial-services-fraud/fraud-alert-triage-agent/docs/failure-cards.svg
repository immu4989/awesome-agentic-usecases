<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Observed Fraud Alert Triage failure modes</title>
  <desc id="desc">Three observed, reproducible failure modes from committed evaluation runs.</desc>
  <style>
    :root { color-scheme:light dark; }
    .surface { fill:#f7faf8; } .card { fill:#fff;stroke:#d9e2dd;stroke-width:1.5; }
    .ink { fill:#10231d; } .muted { fill:#52645e; }
    .kicker { font:750 13px system-ui,sans-serif;letter-spacing:1.6px; } .title { font:750 28px system-ui,sans-serif; }
    .mode { font:850 19px ui-monospace,SFMono-Regular,monospace; } .headline { font:740 17px system-ui,sans-serif; }
    .body { font:430 14px system-ui,sans-serif; } .pill { font:750 11px system-ui,sans-serif;letter-spacing:.8px; }
    @media (prefers-color-scheme:dark) {
      .surface { fill:#101916; } .card { fill:#17231f;stroke:#30433c; }
      .ink { fill:#f4faf7; } .muted { fill:#b2c3bc; }
    }
  </style>
  <rect width="1200" height="540" rx="20" class="surface"/>
  <text x="42" y="42" class="kicker" fill="#16966b">OBSERVED IN THE LAB · NOT HYPOTHETICAL</text>
  <text x="42" y="84" class="title ink">How this agent actually fails</text>
  <g transform="translate(960 35)"><rect width="198" height="30" rx="15" fill="#16966b" opacity=".13"/><circle cx="17" cy="15" r="5" fill="#16966b"/><text x="30" y="19" class="pill muted">REPRODUCIBLE CASES</text></g>
  <g transform="translate(42 128)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#16966b" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#16966b">01</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">Trusting the alert framing over a benign explanation (the travel…</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">gpt-oss files these as card-fraud instead of false-positive. It anchors on the alert&#x27;s framing and the device/geo novelty,</tspan><tspan x="94" dy="20">and doesn&#x27;t credit the travel_notice_matches signal that policy FP-CARD-03 says to check first.</tspan></text></g><g transform="translate(42 252)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#16966b" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#16966b">02</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">Clearing an authorized-but-fraudulent payment (the APP-scam…</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">Mistral treats the trusted device and customer authorization as exculpatory and mis-dispositions these toward release,</tspan><tspan x="94" dy="20">ignoring FP-APP-05&#x27;s explicit instruction that a trusted device does not clear a new-mule-beneficiary payment.</tspan></text></g><g transform="translate(42 376)"><rect width="1116" height="104" rx="17" class="card"/><rect width="72" height="104" rx="17" fill="#16966b" opacity=".12"/><text x="36" y="59" text-anchor="middle" class="mode" fill="#16966b">03</text><text x="94" y="34" class="headline ink"><tspan x="94" dy="0">Decisive-action avoidance: softening block into hold-for-review</tspan></text><text x="94" y="64" class="body muted"><tspan x="94" dy="0">on confirmed card fraud or account takeover for a standard customer, policy FP-ESC-01 says block_and_notify. Mistral routes</tspan><tspan x="94" dy="20">to the softer hold_for_review queue instead — correct queue, correct threat read, wrong action: it declines to take the…</tspan></text></g>
  <text x="42" y="514" class="body muted">Open FAILURE_MODES.md for scenario IDs, evidence, impact, and reproduction commands.</text>
</svg>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provisional-ballot-status"
version = "0.1.0"
description = "Can a nonpartisan agent provide official provisional-ballot status and cure routing without deciding eligibility or influencing a vote?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aau-harness"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
provisional-ballot-status = "provisional_ballot_status_navigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aau-public-value-pilot-network"
version = "0.1.0"
description = "Privacy-bounded public-value pilot and independent-reproduction contracts."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Imran Ahamed" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
aau-pilot-network = "aau_pilot_network:main"

[tool.setuptools]
py-modules = ["aau_pilot_network"]

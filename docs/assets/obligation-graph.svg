<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Obligation Graph Contract</title>
  <desc id="desc">One event fans out into independently clocked duties, recipients, human owners, and truthful receipts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07111f"/><stop offset=".52" stop-color="#11152d"/><stop offset="1" stop-color="#1c0e20"/></linearGradient>
    <linearGradient id="pulse" x1="0" x2="1"><stop stop-color="#59a7ff"/><stop offset="1" stop-color="#ff6b8b"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .k{font:700 12px ui-monospace,SFMono-Regular,monospace;letter-spacing:2px}.h{font:760 34px system-ui,sans-serif}.s{font:520 16px system-ui,sans-serif}.n{font:800 11px ui-monospace,SFMono-Regular,monospace}.t{font:700 14px system-ui,sans-serif}.m{font:500 11px ui-monospace,SFMono-Regular,monospace}.line{fill:none;stroke:url(#pulse);stroke-width:2;stroke-linecap:round;stroke-dasharray:6 6;animation:flow 2.6s linear infinite}.card{fill:#111b2c;stroke:#32405a;stroke-width:1}.dot{fill:#08111d;stroke:#6fb7ff;stroke-width:2}.receipt{fill:#15261f;stroke:#54d18b}.ink{fill:#f6f7fb}.muted{fill:#9ca9bc}@keyframes flow{to{stroke-dashoffset:-24}}@media(prefers-reduced-motion:reduce){.line{animation:none}}
  </style>
  <rect width="1200" height="470" rx="24" fill="url(#bg)"/>
  <path d="M0 118H1200M0 387H1200" stroke="#263047"/>
  <text x="46" y="44" class="k" fill="#72b8ff">NEW REPOSITORY SPECIALTY · REGULATORY CLOCK COLLISION</text>
  <text x="46" y="86" class="h ink">One event. Several duties. No missing clock.</text>
  <text x="46" y="111" class="s muted">Score the obligation graph—not a plausible single answer.</text>

  <circle cx="115" cy="248" r="50" fill="#12233d" stroke="#6fb7ff" stroke-width="2" filter="url(#glow)"/>
  <text x="115" y="241" text-anchor="middle" class="n" fill="#74bcff">EVENT</text>
  <text x="115" y="262" text-anchor="middle" class="m ink">facts + time</text>

  <path class="line" d="M165 235C215 235 218 166 260 166M165 242C215 242 218 218 260 218M165 248H260M165 254C215 254 218 302 260 302M165 261C215 261 218 354 260 354"/>
  <g transform="translate(260 140)"><rect class="card" width="230" height="52" rx="10"/><circle class="dot" cx="24" cy="26" r="9"/><text x="44" y="23" class="t ink">OBLIGATION SET</text><text x="44" y="40" class="m muted">all applicable · no invented node</text></g>
  <g transform="translate(260 196)"><rect class="card" width="230" height="52" rx="10"/><circle class="dot" cx="24" cy="26" r="9"/><text x="44" y="23" class="t ink">CLOCK ORIGIN</text><text x="44" y="40" class="m muted">occurrence · awareness · decision</text></g>
  <g transform="translate(260 252)"><rect class="card" width="230" height="52" rx="10"/><circle class="dot" cx="24" cy="26" r="9"/><text x="44" y="23" class="t ink">DEADLINE</text><text x="44" y="40" class="m muted">hours · calendar · business days</text></g>
  <g transform="translate(260 308)"><rect class="card" width="230" height="52" rx="10"/><circle class="dot" cx="24" cy="26" r="9"/><text x="44" y="23" class="t ink">RECIPIENT + CHANNEL</text><text x="44" y="40" class="m muted">the exact accountable destination</text></g>

  <path class="line" d="M490 166C535 166 530 218 568 218M490 222H568M490 278C535 278 530 218 568 218M490 334C535 334 530 274 568 274"/>
  <g transform="translate(568 186)"><rect class="card" width="235" height="64" rx="12"/><text x="20" y="25" class="t ink">PROTECTED HUMAN OWNER</text><text x="20" y="44" class="m muted">judges · certifies · operates · decides</text></g>
  <g transform="translate(568 262)"><rect class="receipt" width="235" height="64" rx="12"/><text x="20" y="25" class="t ink">TRUTHFUL RECEIPT</text><text x="20" y="44" class="m" fill="#83dca9">prepared ≠ accepted ≠ decided</text></g>
  <path class="line" d="M803 218C850 218 846 246 885 246M803 294C850 294 846 246 885 246"/>
  <g transform="translate(885 181)"><rect width="270" height="130" rx="18" fill="#0b141f" stroke="url(#pulse)" stroke-width="2"/><text x="24" y="31" class="k" fill="#ff7c99">EXACT GRAPH</text><text x="24" y="65" class="h ink">PASS</text><text x="24" y="90" class="m muted">every node · every clock</text><text x="24" y="108" class="m muted">every owner · real receipt</text><circle cx="234" cy="56" r="17" fill="#54d18b"/><path d="M225 56l6 6 12-14" fill="none" stroke="#07111f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="46" y="423" class="m muted">MEDICAL DEVICE · DRUG SUPPLY · MORTGAGE · HEALTH PAYMENT · CYBER DISCLOSURE · RESIDENT RIGHTS · NUCLEAR</text>
  <text x="1154" y="423" text-anchor="end" class="n" fill="#ff7c99">224 COMMITTED SCENARIOS</text>
</svg>

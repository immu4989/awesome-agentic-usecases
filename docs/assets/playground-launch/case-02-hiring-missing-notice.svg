  <text x="875" y="409" fill="#91abb1" font-family="ui-monospace,monospace" font-size="13" font-weight="700">FAILURE SHAPE</text>
  <text x="875" y="443" fill="#eefcff" font-family="system-ui,sans-serif" font-size="20" font-weight="700">Absence detection</text>

  <text x="104" y="166" fill="#ffc857" font-family="ui-monospace,monospace" font-size="15" font-weight="800" letter-spacing="1.5">HIRING / ABSENCE DETECTION</text>
  <text x="104" y="240" fill="#eefcff" font-family="system-ui,sans-serif" font-size="62" font-weight="800" letter-spacing="-2.5"><tspan x="104" dy="0">The rule passed. The</tspan><tspan x="104" dy="68">receipt did not arrive.</tspan></text>
  <text x="104" y="454" fill="#a7bdc1" font-family="system-ui,sans-serif" font-size="22" font-weight="500"><tspan x="104" dy="0">The hiring rule passed. The required notice was declared—but</tspan><tspan x="104" dy="29">no delivery receipt exists. Trust the agent, verify the</tspan><tspan x="104" dy="29">evidence, or block the workflow?</tspan></text>
  <text x="104" y="551" fill="#ffc857" font-family="ui-monospace,monospace" font-size="16" font-weight="800">OPEN THE TRACE → ?case=hiring-missing-notice</text>

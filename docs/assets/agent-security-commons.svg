<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">AAU Agent Security Commons</title>
  <desc id="desc">A temporary human-issued authority lease moves through identity, task, tool, destination, peer, monitoring, and recovery gates. Decisions become incident regressions, defender kits, control evidence, and public-value pilots.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101513"/><stop offset="1" stop-color="#18201d"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7cc0ad"/><stop offset="1" stop-color="#d8b870"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="500" rx="28" fill="url(#bg)"/>
  <path d="M0 92H1200M0 405H1200" stroke="#fff" stroke-opacity=".06"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="62" y="55" fill="#86c5b3" font-size="14" font-weight="700" letter-spacing="3">AAU / OPEN CONFORMANCE INFRASTRUCTURE</text>
    <text x="62" y="105" fill="#f4f0e6" font-size="38" font-weight="700">Agent Security Commons</text>
    <text x="62" y="139" fill="#aeb9b4" font-size="18">Authorization is a live condition—not a permission remembered from the beginning.</text>
    <g transform="translate(62 185)" filter="url(#shadow)">
      <rect width="1076" height="118" rx="18" fill="#0b0f0e" stroke="#fff" stroke-opacity=".12"/>
      <path d="M103 60H968" stroke="url(#line)" stroke-width="3"/>
      <g font-size="12" text-anchor="middle">
        <g transform="translate(103 60)"><circle r="20" fill="#7cc0ad"/><text y="5" fill="#0b0f0e" font-weight="800">ID</text><text y="48" fill="#d6dfdb">IDENTITY</text></g>
        <g transform="translate(247 60)"><circle r="20" fill="#7cc0ad"/><text y="5" fill="#0b0f0e" font-weight="800">T</text><text y="48" fill="#d6dfdb">TASK</text></g>
        <g transform="translate(391 60)"><circle r="20" fill="#7cc0ad"/><text y="5" fill="#0b0f0e" font-weight="800">↗</text><text y="48" fill="#d6dfdb">TOOL</text></g>
        <g transform="translate(535 60)"><circle r="20" fill="#d8b870"/><text y="5" fill="#17130a" font-weight="800">@</text><text y="48" fill="#d6dfdb">DESTINATION</text></g>
        <g transform="translate(679 60)"><circle r="20" fill="#d8b870"/><text y="5" fill="#17130a" font-weight="800">P</text><text y="48" fill="#d6dfdb">PEER</text></g>
        <g transform="translate(823 60)"><circle r="20" fill="#d8b870"/><text y="5" fill="#17130a" font-weight="800">M</text><text y="48" fill="#d6dfdb">MONITOR</text></g>
        <g transform="translate(968 60)"><circle r="20" fill="#f0ebe0"/><text y="5" fill="#101513" font-weight="800">H</text><text y="48" fill="#d6dfdb">RECOVERY</text></g>
      </g>
    </g>
    <g transform="translate(62 340)">
      <g><rect width="245" height="96" rx="14" fill="#f4f0e6"/><text x="18" y="30" fill="#52625c" font-size="11" font-weight="700" letter-spacing="1.5">01 / REPLAY</text><text x="18" y="57" fill="#121714" font-size="18" font-weight="700">Incident regression</text><text x="18" y="78" fill="#64716c" font-size="13">Public lesson → executable test</text></g>
      <g transform="translate(267)"><rect width="245" height="96" rx="14" fill="#f4f0e6"/><text x="18" y="30" fill="#52625c" font-size="11" font-weight="700" letter-spacing="1.5">02 / PROTECT</text><text x="18" y="57" fill="#121714" font-size="18" font-weight="700">Essential services</text><text x="18" y="78" fill="#64716c" font-size="13">Five offline defender kits</text></g>
      <g transform="translate(534)"><rect width="245" height="96" rx="14" fill="#f4f0e6"/><text x="18" y="30" fill="#52625c" font-size="11" font-weight="700" letter-spacing="1.5">03 / COMPARE</text><text x="18" y="57" fill="#121714" font-size="18" font-weight="700">Control evidence</text><text x="18" y="78" fill="#64716c" font-size="13">Matched arms, no universal score</text></g>
      <g transform="translate(801)"><rect width="275" height="96" rx="14" fill="#f4f0e6"/><text x="18" y="30" fill="#52625c" font-size="11" font-weight="700" letter-spacing="1.5">04 / SERVE</text><text x="18" y="57" fill="#121714" font-size="18" font-weight="700">Public-value pilot</text><text x="18" y="78" fill="#64716c" font-size="13">Real gaps remain visible</text></g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Can You Trust This Agent?</title>
  <desc id="desc">AAU interactive evidence playground with five real model traces and Trust, Verify, or Block reviewer actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061216"/>
      <stop offset="0.62" stop-color="#0a1a1f"/>
      <stop offset="1" stop-color="#071114"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.68">
      <stop offset="0" stop-color="#65e7ff" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#65e7ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#65e7ff" stroke-opacity="0.055"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <g fill="none" stroke="#65e7ff" stroke-opacity="0.13">
    <circle cx="1090" cy="70" r="215"/>
    <circle cx="1090" cy="70" r="165"/>
    <circle cx="1090" cy="70" r="105"/>
  </g>

  <g transform="translate(62 58)">
    <rect width="210" height="302" fill="#061115" fill-opacity="0.8" stroke="#65e7ff"/>
    <path d="M-8 18V-8H18M192 310H218V284" fill="none" stroke="#65e7ff" stroke-width="2"/>
    <text x="24" y="36" fill="#65e7ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.6">AAU / FIELD TEST 01</text>
    <text x="24" y="118" fill="#eefcff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-2.6">
      <tspan x="24">TRUST</tspan><tspan x="24" dy="37">UNDER</tspan><tspan x="24" dy="37">PRESSURE</tspan>
    </text>
    <rect x="24" y="250" width="47" height="22" fill="#9df8bd"/>
    <text x="34" y="265" fill="#061114" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9" font-weight="800" letter-spacing="1.2">LIVE</text>
  </g>

  <g transform="translate(332 67)">
    <text x="0" y="18" fill="#65e7ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2">INTERACTIVE EVIDENCE PLAYGROUND / ZERO INSTALL</text>
    <text x="0" y="112" fill="#eefcff" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-5">Can you trust</text>
    <text x="0" y="187" fill="#65e7ff" font-family="Georgia, Times New Roman, serif" font-size="83" font-style="italic" letter-spacing="-4">this agent?</text>
    <text x="2" y="233" fill="#a9c0c5" font-family="Inter, Arial, sans-serif" font-size="19">Five industries. Five real model traces. One decision:</text>

    <g transform="translate(0 270)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
      <rect width="168" height="58" fill="#65e7ff"/>
      <text x="25" y="24" fill="#051215" font-size="10" font-weight="800" letter-spacing="1.4">01 / TRUST</text>
      <text x="25" y="42" fill="#17353b" font-size="8" font-weight="700" letter-spacing="0.8">ACCEPT THE OUTPUT</text>
      <rect x="180" width="168" height="58" fill="#08171a" stroke="#ffc857"/>
      <text x="205" y="24" fill="#ffc857" font-size="10" font-weight="800" letter-spacing="1.4">02 / VERIFY</text>
      <text x="205" y="42" fill="#a88c4e" font-size="8" font-weight="700" letter-spacing="0.8">REQUEST EVIDENCE</text>
      <rect x="360" width="168" height="58" fill="#08171a" stroke="#ff6e7f"/>
      <text x="385" y="24" fill="#ff8d99" font-size="10" font-weight="800" letter-spacing="1.4">03 / BLOCK</text>
      <text x="385" y="42" fill="#a9656d" font-size="8" font-weight="700" letter-spacing="0.8">REJECT THE OUTPUT</text>
    </g>
  </g>

  <g transform="translate(62 411)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <path d="M0 0H1076" stroke="#29434a"/>
    <g transform="translate(0 30)">
      <rect width="1076" height="105" fill="#071316" stroke="#29434a"/>
      <g transform="translate(20 19)">
        <text fill="#65e7ff" font-size="10" font-weight="800">01</text>
        <text y="25" fill="#eefcff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">GRID</text>
        <text y="48" fill="#78949a" font-size="8">SAFETY GATE</text>
      </g>
      <g transform="translate(222 19)">
        <text fill="#65e7ff" font-size="10" font-weight="800">02</text>
        <text y="25" fill="#eefcff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">HIRING</text>
        <text y="48" fill="#78949a" font-size="8">MISSING RECEIPT</text>
      </g>
      <g transform="translate(424 19)">
        <text fill="#65e7ff" font-size="10" font-weight="800">03</text>
        <text y="25" fill="#eefcff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">PHARMA</text>
        <text y="48" fill="#78949a" font-size="8">TRANSFER TRAP</text>
      </g>
      <g transform="translate(626 19)">
        <text fill="#65e7ff" font-size="10" font-weight="800">04</text>
        <text y="25" fill="#eefcff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">APPEALS</text>
        <text y="48" fill="#78949a" font-size="8">URGENT CLOCK</text>
      </g>
      <g transform="translate(828 19)">
        <text fill="#65e7ff" font-size="10" font-weight="800">05</text>
        <text y="25" fill="#eefcff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">SECURITY</text>
        <text y="48" fill="#78949a" font-size="8">POISONED TOOL</text>
      </g>
      <path d="M202 0V105M404 0V105M606 0V105M808 0V105" stroke="#29434a"/>
      <path d="M0 102H202" stroke="#65e7ff" stroke-width="3"/>
    </g>
  </g>

  <text x="62" y="593" fill="#9df8bd" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="800" letter-spacing="1.7">REAL EVIDENCE · SHAREABLE CASES · LOCAL PROGRESS · $0</text>
  <text x="1138" y="593" fill="#78949a" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" font-weight="700">AWESOME AGENTIC USE CASES</text>
</svg>

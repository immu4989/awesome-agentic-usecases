<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">AAU Boundary Lab — change one deciding fact</title>
  <desc id="desc">A source-locked counterfactual laboratory with 8 verified boundaries across 8 industries and 16 committed source scenarios.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b0d"/><stop offset=".62" stop-color="#111619"/><stop offset="1" stop-color="#090c0f"/></linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#d9ff62" stroke-opacity=".055"/></pattern>
    <radialGradient id="glow"><stop stop-color="#ff5ccf" stop-opacity=".18"/><stop offset="1" stop-color="#ff5ccf" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="800" fill="url(#bg)"/><rect width="1600" height="800" fill="url(#grid)"/><circle cx="1450" cy="60" r="430" fill="url(#glow)"/>
  <rect x="26" y="26" width="1548" height="748" fill="none" stroke="#465148"/><path d="M26 76H1574" stroke="#465148"/>
  <text x="64" y="60" class="micro lime">AWESOME AGENTIC USE CASES / FIELD TEST 02 / SOURCE-LOCKED</text>
  <text x="1518" y="60" class="micro" text-anchor="end">ZERO INSTALL · $0 TO REPRODUCE</text>
  <text x="65" y="194" class="headline">CHANGE ONE FACT.</text>
  <text x="65" y="273" class="headline italic">WATCH THE CONTRACT MOVE.</text>
  <text x="68" y="321" class="deck">COUNTERFACTUAL PAIRS · HIDDEN ORACLES · PORTABLE REGRESSION TESTS</text>
  <g transform="translate(68 382)">
    <rect width="318" height="178" fill="#0c1113" stroke="#536053"/><text x="24" y="36" class="micro">BEFORE / SCENARIO A</text>
    <text x="24" y="82" class="card">FACT PRESENT</text><path d="M24 108H294" stroke="#354037"/><text x="24" y="144" class="result lime">TRUST</text>
  </g>
  <g transform="translate(494 382)">
    <rect width="318" height="178" fill="#0c1113" stroke="#536053"/><text x="24" y="36" class="micro">AFTER / SCENARIO B</text>
    <text x="24" y="82" class="card">FACT CHANGED</text><path d="M24 108H294" stroke="#354037"/><text x="24" y="144" class="result pink">BLOCK</text>
  </g>
  <circle cx="440" cy="471" r="39" fill="#d9ff62" stroke="#ff5ccf" stroke-width="4"/><text x="440" y="486" class="delta" text-anchor="middle">Δ</text>
  <text x="68" y="635" class="metric">8</text><text x="132" y="620" class="micro">VERIFIED</text><text x="132" y="642" class="micro">BOUNDARIES</text>
  <text x="300" y="635" class="metric">8</text><text x="364" y="620" class="micro">PUBLIC-INTEREST</text><text x="364" y="642" class="micro">INDUSTRIES</text>
  <text x="594" y="635" class="metric">16</text><text x="684" y="620" class="micro">COMMITTED</text><text x="684" y="642" class="micro">SCENARIOS</text>
  <path d="M842 112V718" stroke="#465148"/><text x="870" y="160" class="section">THE BOUNDARY QUEUE</text><text x="870" y="201" class="aside">Review both sides. Reveal the oracle. Export the test.</text>
  <g transform="translate(870 285)"><rect width="302" height="66" rx="4" fill="#111619" stroke="#354037"/><rect width="6" height="66" fill="#d9ff62"/><text x="24" y="25" class="micro">BOUNDARY 01</text><text x="24" y="47" class="industry">Pharmaceutical Manufacturing</text></g><g transform="translate(1200 285)"><rect width="302" height="66" rx="4" fill="#111619" stroke="#354037"/><rect width="6" height="66" fill="#ff5ccf"/><text x="24" y="25" class="micro">BOUNDARY 02</text><text x="24" y="47" class="industry">Health Insurance Appeals</text></g><g transform="translate(870 373)"><rect width="302" height="66" rx="4" fill="#111619" stroke="#354037"/><rect width="6" height="66" fill="#d9ff62"/><text x="24" y="25" class="micro">BOUNDARY 03</text><text x="24" y="47" class="industry">Human Resources</text></g><g transform="translate(1200 373)"><rect width="302" height="66" rx="4" fill="#111619" stroke="#354037"/><rect width="6" height="66" fill="#ff5ccf"/><text x="24" y="25" class="micro">BOUNDARY 04</text><text x="24" y="47" class="industry">Grid Operations</text></g><g transform="translate(870 461)"><rect width="302" height="66" rx="4" fill="#111619" stroke="#354037"/><rect width="6" height="66" fill="#d9ff62"/><text x="24" y="25" class="micro">BOUNDARY 05</text><text x="24" y="47" class="industry">Home and Field Services</text></g><g transform="translate(1200 461)"><rect width="302" height="66" rx="4" fill="#111619" stroke="#354037"/><rect width="6" height="66" fill="#ff5ccf"/><text x="24" y="25" class="micro">BOUNDARY 06</text><text x="24" y="47" class="industry">Social Security Disability</text></g><g transform="translate(870 549)"><rect width="302" height="66" rx="4" fill="#111619" stroke="#354037"/><rect width="6" height="66" fill="#d9ff62"/><text x="24" y="25" class="micro">BOUNDARY 07</text><text x="24" y="47" class="industry">Medical Device Safety</text></g><g transform="translate(1200 549)"><rect width="302" height="66" rx="4" fill="#111619" stroke="#354037"/><rect width="6" height="66" fill="#ff5ccf"/><text x="24" y="25" class="micro">BOUNDARY 08</text><text x="24" y="47" class="industry">Security Operations</text></g>
  <rect x="870" y="658" width="632" height="60" fill="#d9ff62"/><text x="900" y="696" class="cta">FLIP THE FIRST DECIDING FACT →</text>
  <style>

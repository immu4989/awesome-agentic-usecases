<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">Collective Cyber Defense evidence loop</title>
  <desc id="desc">A public advisory flows through a verified fix, containment drill, essential-service continuity gate, portable evidence receipt, and independent reproduction gap.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1"><stop stop-color="#f6f5f1"/><stop offset="1" stop-color="#ecefeb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#10231d" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1440" height="560" rx="34" fill="url(#paper)"/>
  <path d="M120 280H1320" stroke="#bdc8c3" stroke-width="2" stroke-dasharray="5 11"/>
  <g fill="none" stroke="#2e6f61" stroke-width="2.5"><path d="m323 280 34-17v34z" fill="#2e6f61"/><path d="m563 280 34-17v34z" fill="#2e6f61"/><path d="m803 280 34-17v34z" fill="#2e6f61"/><path d="m1043 280 34-17v34z" fill="#2e6f61"/></g>
  <g filter="url(#shadow)">
    <g transform="translate(55 155)"><rect width="250" height="250" rx="22" fill="#fff"/><circle cx="42" cy="42" r="18" fill="#dcebe5"/><path d="M36 42h12m-6-6v12" stroke="#2e6f61" stroke-width="2"/><text x="28" y="91" fill="#2e6f61" font-family="monospace" font-size="13" font-weight="700">01 / PUBLIC SIGNAL</text><text x="28" y="132" fill="#17231f" font-family="system-ui" font-size="25" font-weight="750">Advisory</text><text x="28" y="164" fill="#68736f" font-family="system-ui" font-size="15">Source, scope, action,</text><text x="28" y="186" fill="#68736f" font-family="system-ui" font-size="15">and evidence boundary</text><path d="M28 215h194" stroke="#d9dfdc"/><text x="28" y="237" fill="#8a6b32" font-family="monospace" font-size="12">PUBLIC / SYNTHETIC</text></g>
    <g transform="translate(365 155)"><rect width="250" height="250" rx="22" fill="#17231f"/><circle cx="42" cy="42" r="18" fill="#2e6f61"/><path d="m34 42 6 6 11-14" fill="none" stroke="#fff" stroke-width="2"/><text x="28" y="91" fill="#8fc4b5" font-family="monospace" font-size="13" font-weight="700">02 / VERIFY</text><text x="28" y="132" fill="#fff" font-family="system-ui" font-size="25" font-weight="750">Fix + stop</text><text x="28" y="164" fill="#bac5c0" font-family="system-ui" font-size="15">Regression, twin, service,</text><text x="28" y="186" fill="#bac5c0" font-family="system-ui" font-size="15">rollback, containment</text><path d="M28 215h194" stroke="#35443e"/><text x="28" y="237" fill="#d2b06d" font-family="monospace" font-size="12">DETERMINISTIC RECEIPT</text></g>
    <g transform="translate(675 155)"><rect width="250" height="250" rx="22" fill="#fff"/><circle cx="42" cy="42" r="18" fill="#f0e6d2"/><path d="M34 48V37h16v11M38 37v-5h8v5" fill="none" stroke="#8a6b32" stroke-width="2"/><text x="28" y="91" fill="#8a6b32" font-family="monospace" font-size="13" font-weight="700">03 / PRESERVE</text><text x="28" y="132" fill="#17231f" font-family="system-ui" font-size="25" font-weight="750">Service</text><text x="28" y="164" fill="#68736f" font-family="system-ui" font-size="15">Continuity budget, rollback,</text><text x="28" y="186" fill="#68736f" font-family="system-ui" font-size="15">and accountable approval</text><path d="M28 215h194" stroke="#d9dfdc"/><text x="28" y="237" fill="#2e6f61" font-family="monospace" font-size="12">NO AUTOMATIC CHANGE</text></g>
    <g transform="translate(985 155)"><rect width="250" height="250" rx="22" fill="#fff"/><circle cx="42" cy="42" r="18" fill="#dcebe5"/><path d="M33 37h18v12H33zm4-5h10v5" fill="none" stroke="#2e6f61" stroke-width="2"/><text x="28" y="91" fill="#2e6f61" font-family="monospace" font-size="13" font-weight="700">04 / EXCHANGE</text><text x="28" y="132" fill="#17231f" font-family="system-ui" font-size="25" font-weight="750">Evidence</text><text x="28" y="164" fill="#68736f" font-family="system-ui" font-size="15">Hashes and aggregate signals,</text><text x="28" y="186" fill="#68736f" font-family="system-ui" font-size="15">not sensitive raw logs</text><path d="M28 215h194" stroke="#d9dfdc"/><text x="28" y="237" fill="#a34f42" font-family="monospace" font-size="12">REPRODUCTION: OPEN GAP</text></g>
  </g>
  <g transform="translate(1260 175)"><circle cx="52" cy="105" r="52" fill="#17231f"/><path d="m29 106 14 14 33-39" fill="none" stroke="#8fc4b5" stroke-width="5"/><text x="52" y="181" text-anchor="middle" fill="#17231f" font-family="system-ui" font-size="14" font-weight="700">LEARN</text></g>
  <text x="55" y="66" fill="#17231f" font-family="system-ui" font-size="30" font-weight="750">Collective defense needs a proof loop—not a claim loop.</text>
  <text x="55" y="98" fill="#68736f" font-family="system-ui" font-size="16">Every layer is inspectable. Every evidence level stays visible. Every consequential action remains human-accountable.</text>
  <text x="55" y="505" fill="#68736f" font-family="monospace" font-size="13">AAU / COLLECTIVE CYBER DEFENSE LAB / ZERO UPLOAD / NO LIVE TARGETS / NO CERTIFICATION</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="780" height="309" viewBox="0 0 780 309" role="img" aria-label="Animated terminal: verify any result in this repo — one command, no API key">
<style>.t{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;font-size:13px;dominant-baseline:middle}.ink{fill:#1a1a19}.muted{fill:#85837b}.dim{fill:#a8a69d}.good{fill:#0a7d33;font-weight:700}.bad{fill:#c62828;font-weight:700}.acc{fill:#4a3aa7;font-weight:700}.rule{fill:#e6e5de}@keyframes type{0%{transform:translateX(0)}13.107%,100%{transform:translateX(var(--w))}}.cover{transform:translateX(var(--w));animation:type 10.3s steps(30,end) infinite}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cursor{animation:blink 1s step-end infinite}@media (prefers-reduced-motion:reduce){.cover,.cursor,[class^='l']{animation:none!important}.cursor{opacity:0}}@keyframes r1{0%,14.563%{opacity:0}15.763%,100%{opacity:1}}.l1{animation:r1 10.3s ease-out infinite}@keyframes r2{0%,19.903%{opacity:0}21.102999999999998%,100%{opacity:1}}.l2{animation:r2 10.3s ease-out infinite}@keyframes r3{0%,25.243%{opacity:0}26.442999999999998%,100%{opacity:1}}.l3{animation:r3 10.3s ease-out infinite}@keyframes r4{0%,30.583%{opacity:0}31.782999999999998%,100%{opacity:1}}.l4{animation:r4 10.3s ease-out infinite}@keyframes r5{0%,35.922%{opacity:0}37.122%,100%{opacity:1}}.l5{animation:r5 10.3s ease-out infinite}@keyframes r6{0%,41.262%{opacity:0}42.462%,100%{opacity:1}}.l6{animation:r6 10.3s ease-out infinite}@keyframes r7{0%,46.602%{opacity:0}47.802%,100%{opacity:1}}.l7{animation:r7 10.3s ease-out infinite}@keyframes r8{0%,51.942%{opacity:0}53.142%,100%{opacity:1}}.l8{animation:r8 10.3s ease-out infinite}@keyframes r9{0%,57.282%{opacity:0}58.482%,100%{opacity:1}}.l9{animation:r9 10.3s ease-out infinite}@keyframes r10{0%,62.621%{opacity:0}63.821000000000005%,100%{opacity:1}}.l10{animation:r10 10.3s ease-out infinite}</style>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">One deciding fact moves the required action</title>
  <desc id="desc">A source-derived grid operations example changes from all protective tags removed and Trust to one tag remaining and Block, then passes twelve structural gates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b10"/><stop offset=".65" stop-color="#121a21"/><stop offset="1" stop-color="#0a0d13"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#ffde59" stroke-opacity=".045"/></pattern>
    <radialGradient id="glow"><stop stop-color="#6df5d2" stop-opacity=".18"/><stop offset="1" stop-color="#6df5d2" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/><circle cx="795" cy="485" r="510" fill="url(#glow)"/>
  <rect x="30" y="30" width="1540" height="840" fill="none" stroke="#46545e"/><path d="M30 98H1570" stroke="#46545e"/>
  <text x="72" y="73" class="micro mint">AAU BOUNDARY BUILDER / SOURCE-DERIVED WORKED EXAMPLE</text><text x="1528" y="73" class="micro" text-anchor="end">GRID OPERATIONS / DECISION GATE</text>
  <text x="72" y="180" class="headline">CHANGE ONE DECIDING FACT.</text>
  <text x="72" y="247" class="headline italic">WATCH THE REQUIRED ACTION MOVE.</text>

  <g transform="translate(72 320)">
    <rect width="610" height="308" rx="6" fill="#0b1117" stroke="#4a5962"/>
    <rect width="10" height="308" fill="#6df5d2"/>
    <text x="38" y="46" class="micro mint">BASELINE / BEFORE</text>
    <text x="38" y="115" class="case">All protective tags</text><text x="38" y="160" class="case">have been removed.</text>
    <path d="M38 196H570" stroke="#3a4851"/>
    <text x="38" y="235" class="micro">REQUIRED REVIEWER ACTION</text>
    <text x="38" y="282" class="action mint">TRUST</text>
  </g>
  <g transform="translate(918 320)">
    <rect width="610" height="308" rx="6" fill="#0b1117" stroke="#4a5962"/>
    <rect width="10" height="308" fill="#ff7ac8"/>
    <text x="38" y="46" class="micro pink">CHANGED / AFTER</text>
    <text x="38" y="115" class="case">One protective tag</text><text x="38" y="160" class="case">still remains.</text>
    <path d="M38 196H570" stroke="#3a4851"/>
    <text x="38" y="235" class="micro">REQUIRED REVIEWER ACTION</text>
    <text x="38" y="282" class="action pink">BLOCK</text>
  </g>
  <g transform="translate(800 474)"><circle r="75" fill="#ffde59" stroke="#ff7ac8" stroke-width="5"/><text y="20" class="delta" text-anchor="middle">Δ</text></g>
  <text x="800" y="672" class="boundary" text-anchor="middle">PROTECTIVE-TAG CONDITION</text>

  <g transform="translate(72 720)">
    <rect width="1456" height="108" fill="#0a0f14" stroke="#46545e"/>
    <rect width="378" height="108" fill="#6df5d2"/>
    <text x="28" y="35" class="micro dark">STRUCTURAL RELEASE GATE</text><text x="28" y="78" class="passed">12/12 PASSED</text>
    <text x="420" y="43" class="micro yellow">STATUS / ADAPTATION_REQUIRED</text>
    <text x="420" y="75" class="note">Structure checked locally. Sources, domain truth and production safety still require qualified review.</text>
  </g>
  <text x="72" y="855" class="url">Try it: immu4989.github.io/awesome-agentic-usecases/#boundary-builder</text>

  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f5f3ea}.micro{font:800 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.45px;fill:#99a8b1}.mint{fill:#6df5d2}.pink{fill:#ff7ac8}.yellow{fill:#ffde59}.dark{fill:#090b11}.headline{font-size:62px;font-weight:950;letter-spacing:-3.6px}.italic{font-family:Georgia,serif;font-size:59px;font-style:italic;font-weight:400;fill:#6df5d2}.case{font-size:36px;font-weight:850;letter-spacing:-1.1px}.action{font:950 51px ui-monospace,SFMono-Regular,Menlo,monospace}.delta{font:950 64px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#090b11}.boundary{font:850 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2.3px;fill:#ffde59}.passed{font:950 33px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#090b11}.note{font-size:16px;fill:#c1c8cd}.url{font:750 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.8px;fill:#7d8a92}
  </style>
</svg>

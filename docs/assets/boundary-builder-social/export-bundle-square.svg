<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Boundary Builder eight-file contribution draft</title>
  <desc id="desc">A local-first workflow that validates a boundary and exports eight files for evaluation, evidence review, Forge adaptation, testing, and visual communication.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b10"/><stop offset=".62" stop-color="#111922"/><stop offset="1" stop-color="#0a0c12"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#6df5d2" stroke-opacity=".055"/></pattern>
    <radialGradient id="glow"><stop stop-color="#ff7ac8" stop-opacity=".2"/><stop offset="1" stop-color="#ff7ac8" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/><rect width="1200" height="1200" fill="url(#grid)"/><circle cx="1120" cy="80" r="420" fill="url(#glow)"/>
  <rect x="28" y="28" width="1144" height="1144" fill="none" stroke="#46545e"/><path d="M28 92H1172" stroke="#46545e"/>
  <text x="65" y="68" class="micro mint">AAU BOUNDARY BUILDER / LOCAL-FIRST EXPORT</text><text x="1135" y="68" class="micro" text-anchor="end">ADAPTATION REQUIRED</text>

  <text x="65" y="182" class="headline">ONE WORKFLOW.</text>
  <text x="65" y="255" class="headline italic">EIGHT USEFUL FILES.</text>
  <text x="67" y="307" class="deck">FROM A DECLARED BOUNDARY TO A CONTRIBUTION DRAFT.</text>

  <g transform="translate(65 365)">
    <g><rect width="510" height="84" fill="#0c1218" stroke="#42515a"/><rect width="8" height="84" fill="#ffde59"/><text x="31" y="36" class="file">README.md</text><text x="31" y="61" class="detail">Boundary story + protected authority</text></g>
    <g transform="translate(550 0)"><rect width="510" height="84" fill="#0c1218" stroke="#42515a"/><rect width="8" height="84" fill="#6df5d2"/><text x="31" y="36" class="file">boundary-pair.json</text><text x="31" y="61" class="detail">Portable before / after contract</text></g>
    <g transform="translate(0 101)"><rect width="510" height="84" fill="#0c1218" stroke="#42515a"/><rect width="8" height="84" fill="#ff7ac8"/><text x="31" y="36" class="file">evals/scenarios.jsonl</text><text x="31" y="61" class="detail">Synthetic scenario twins</text></g>
    <g transform="translate(550 101)"><rect width="510" height="84" fill="#0c1218" stroke="#42515a"/><rect width="8" height="84" fill="#ffde59"/><text x="31" y="36" class="file">tests/test_boundary.py</text><text x="31" y="61" class="detail">Structural regression checks</text></g>
    <g transform="translate(0 202)"><rect width="510" height="84" fill="#0c1218" stroke="#42515a"/><rect width="8" height="84" fill="#6df5d2"/><text x="31" y="36" class="file">evidence/PRIMARY_SOURCES.md</text><text x="31" y="61" class="detail">Qualified-review source ledger</text></g>
    <g transform="translate(550 202)"><rect width="510" height="84" fill="#0c1218" stroke="#42515a"/><rect width="8" height="84" fill="#ff7ac8"/><text x="31" y="36" class="file">evaluation-brief.json</text><text x="31" y="61" class="detail">Forge-compatible handoff</text></g>
    <g transform="translate(0 303)"><rect width="510" height="84" fill="#0c1218" stroke="#42515a"/><rect width="8" height="84" fill="#ffde59"/><text x="31" y="36" class="file">CONTRIBUTION_CHECKLIST.md</text><text x="31" y="61" class="detail">Draft-to-evidence path</text></g>
    <g transform="translate(550 303)"><rect width="510" height="84" fill="#0c1218" stroke="#42515a"/><rect width="8" height="84" fill="#6df5d2"/><text x="31" y="36" class="file">assets/boundary-card.svg</text><text x="31" y="61" class="detail">Original visual handoff card</text></g>
  </g>

  <g transform="translate(65 803)">
    <rect width="1060" height="132" fill="#0a0f14" stroke="#46545e"/>
    <g transform="translate(28 27)"><text class="metric" y="48">6</text><text x="70" y="26" class="micro">EVALUATION</text><text x="70" y="49" class="micro">SHAPES</text></g>
    <path d="M264 18V114" stroke="#394750"/>
    <g transform="translate(298 27)"><text class="metric" y="48">12</text><text x="109" y="26" class="micro">LOCAL</text><text x="109" y="49" class="micro">GATES</text></g>
    <path d="M608 18V114" stroke="#394750"/>
    <g transform="translate(642 27)"><text class="metric" y="48">0</text><text x="70" y="26" class="micro">FORM VALUES</text><text x="70" y="49" class="micro">UPLOADED</text></g>
    <rect x="866" y="26" width="165" height="80" fill="#6df5d2"/><text x="948" y="58" class="micro dark" text-anchor="middle">RELEASE</text><text x="948" y="86" class="pass" text-anchor="middle">12/12</text>
  </g>

  <text x="65" y="1000" class="flow">DRAFT</text><text x="222" y="1000" class="arrow">→</text><text x="279" y="1000" class="flow">FORGE</text><text x="424" y="1000" class="arrow">→</text><text x="480" y="1000" class="flow">DOMAIN REVIEW</text><text x="708" y="1000" class="arrow">→</text><text x="763" y="1000" class="flow">EVIDENCE</text><text x="921" y="1000" class="arrow">→</text><text x="974" y="1000" class="flow mint">VERIFIED</text>
  <rect x="65" y="1050" width="1060" height="75" fill="#ffde59"/><text x="595" y="1096" class="cta" text-anchor="middle">BUILD YOUR BOUNDARY → immu4989.github.io/awesome-agentic-usecases</text>
  <text x="65" y="1153" class="small">STRUCTURE CHECKED LOCALLY · SOURCES NOT VERIFIED · HUMAN AUTHORITY PROTECTED</text>

  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f5f3ea}.micro{font:800 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.3px;fill:#99a8b1}.mint{fill:#6df5d2}.dark{fill:#090b11}.headline{font-size:65px;font-weight:950;letter-spacing:-3.4px}.italic{font-family:Georgia,serif;font-size:67px;font-style:italic;font-weight:400;fill:#6df5d2}.deck{font:800 14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.3px;fill:#a8b3ba}.file{font:850 18px ui-monospace,SFMono-Regular,Menlo,monospace}.detail{font-size:13px;fill:#9eabb3}.metric{font:950 57px ui-monospace,SFMono-Regular,Menlo,monospace}.pass{font:950 27px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#090b11}.flow{font:900 16px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px}.arrow{font-size:24px;fill:#75828a}.cta{font:900 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#090b11}.small{font:720 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:#75828a}
  </style>
</svg>

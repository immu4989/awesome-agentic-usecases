<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AAU Boundary Builder launch card</title>
  <desc id="desc">Bring a workflow, leave with a fork. Six evaluation shapes, twelve local gates, eight files, and zero form values uploaded.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b10"/><stop offset=".58" stop-color="#111922"/><stop offset="1" stop-color="#0a0c12"/></linearGradient>
    <radialGradient id="pink"><stop stop-color="#ff7ac8" stop-opacity=".24"/><stop offset="1" stop-color="#ff7ac8" stop-opacity="0"/></radialGradient>
    <radialGradient id="mint"><stop stop-color="#6df5d2" stop-opacity=".15"/><stop offset="1" stop-color="#6df5d2" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#6df5d2" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1480" cy="80" r="500" fill="url(#pink)"/><circle cx="120" cy="840" r="380" fill="url(#mint)"/>
  <rect x="30" y="30" width="1540" height="840" fill="none" stroke="#46545e"/>
  <path d="M30 96H1570M955 96V718" fill="none" stroke="#46545e"/>

  <text x="72" y="72" class="micro mint">AWESOME AGENTIC USE CASES / NEW FIELD TOOL / LIVE NOW</text>
  <text x="1528" y="72" class="micro" text-anchor="end">LOCAL-FIRST · OPEN SOURCE · ZERO INSTALL</text>

  <text x="72" y="205" class="headline">BRING A WORKFLOW.</text>
  <text x="72" y="290" class="headline italic">LEAVE WITH A FORK.</text>
  <text x="74" y="344" class="deck">TURN ONE DECIDING FACT INTO A TESTABLE AI-AGENT BOUNDARY.</text>

  <g transform="translate(72 414)">
    <rect width="790" height="254" rx="5" fill="#0a0f15" stroke="#46545e"/>
    <text x="30" y="42" class="micro">LIVE COUNTERFACTUAL PREVIEW</text>
    <g transform="translate(30 68)"><rect width="315" height="132" fill="#10171e" stroke="#41505a"/><rect width="7" height="132" fill="#6df5d2"/><text x="28" y="34" class="micro mint">BEFORE</text><text x="28" y="73" class="fact">All protective tags removed</text><text x="28" y="111" class="action mint">TRUST</text></g>
    <circle cx="395" cy="134" r="34" fill="#ffde59" stroke="#ff7ac8" stroke-width="4"/><text x="395" y="146" class="delta" text-anchor="middle">Δ</text>
    <g transform="translate(445 68)"><rect width="315" height="132" fill="#10171e" stroke="#41505a"/><rect width="7" height="132" fill="#ff7ac8"/><text x="28" y="34" class="micro pink">AFTER</text><text x="28" y="73" class="fact">One protective tag remains</text><text x="28" y="111" class="action pink">BLOCK</text></g>
    <text x="30" y="230" class="small">ONE DECLARED SEMANTIC BOUNDARY · DIFFERENT REQUIRED ACTION</text>
  </g>

  <g transform="translate(1002 144)">
    <text x="0" y="0" class="section">FROM QUESTION</text><text x="0" y="45" class="section mint">TO CONTRIBUTION.</text>
    <g transform="translate(0 88)"><rect width="510" height="76" fill="#11171d" stroke="#42505a"/><rect width="76" height="76" fill="#ffde59"/><text x="38" y="49" class="stepnum" text-anchor="middle">01</text><text x="102" y="33" class="label">WORKFLOW</text><text x="102" y="55" class="detail">Name the protected work</text></g>
    <g transform="translate(0 178)"><rect width="510" height="76" fill="#11171d" stroke="#42505a"/><rect width="76" height="76" fill="#151f25"/><text x="38" y="49" class="stepnum mint" text-anchor="middle">02</text><text x="102" y="33" class="label">DECIDING FACT</text><text x="102" y="55" class="detail">Make the required action move</text></g>
    <g transform="translate(0 268)"><rect width="510" height="76" fill="#11171d" stroke="#42505a"/><rect width="76" height="76" fill="#151f25"/><text x="38" y="49" class="stepnum mint" text-anchor="middle">03</text><text x="102" y="33" class="label">EVIDENCE</text><text x="102" y="55" class="detail">Declare proof and source routes</text></g>
    <g transform="translate(0 358)"><rect width="510" height="76" fill="#11171d" stroke="#42505a"/><rect width="76" height="76" fill="#151f25"/><text x="38" y="49" class="stepnum pink" text-anchor="middle">04</text><text x="102" y="33" class="label">EXPORT</text><text x="102" y="55" class="detail">Take the eight-file draft</text></g>
    <rect y="458" width="510" height="90" fill="#6df5d2"/><text x="28" y="492" class="micro dark">RELEASE GATE</text><text x="28" y="531" class="pass">12/12 PASSED</text><text x="482" y="511" class="arrow" text-anchor="end">→</text>
  </g>

  <g transform="translate(30 718)">
    <rect width="1540" height="152" fill="#090d12" stroke="#46545e"/>
    <g transform="translate(42 28)"><text class="metric" y="49">6</text><text x="70" y="27" class="micro">EVALUATION</text><text x="70" y="50" class="micro">SHAPES</text></g>
    <path d="M320 18V134" stroke="#394750"/>
    <g transform="translate(355 28)"><text class="metric" y="49">12</text><text x="112" y="27" class="micro">LOCAL</text><text x="112" y="50" class="micro">GATES</text></g>
    <path d="M680 18V134" stroke="#394750"/>
    <g transform="translate(718 28)"><text class="metric" y="49">8</text><text x="70" y="27" class="micro">FILES PER</text><text x="70" y="50" class="micro">BUNDLE</text></g>
    <path d="M980 18V134" stroke="#394750"/>
    <g transform="translate(1018 28)"><text class="metric" y="49">0</text><text x="70" y="27" class="micro">FORM VALUES</text><text x="70" y="50" class="micro">UPLOADED</text></g>
    <rect x="1265" y="34" width="235" height="72" fill="#ffde59"/><text x="1382" y="64" class="micro dark" text-anchor="middle">TRY IT FREE</text><text x="1382" y="89" class="cta" text-anchor="middle">OPEN THE BUILDER ↗</text>
  </g>
  <text x="72" y="850" class="url">immu4989.github.io/awesome-agentic-usecases/#boundary-builder</text>

  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f5f3ea}.micro{font:800 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.45px;fill:#9facb5}.mint{fill:#6df5d2}.pink{fill:#ff7ac8}.dark{fill:#090b11}.headline{font-size:72px;font-weight:950;letter-spacing:-4px}.italic{font-family:Georgia,serif;font-size:75px;font-style:italic;font-weight:400;fill:#6df5d2}.deck{font:800 16px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.4px;fill:#aab5bc}.fact{font-size:18px;font-weight:800}.action{font:900 28px ui-monospace,SFMono-Regular,Menlo,monospace}.delta{font:900 33px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#090b11}.small{font:760 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:#8f9da6}.section{font-size:34px;font-weight:900;letter-spacing:-1.7px}.stepnum{font:900 25px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#090b11}.label{font:900 14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.6px}.detail{font-size:13px;fill:#aab4bb}.pass{font:950 30px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#090b11}.arrow{font-size:48px;font-weight:300;fill:#090b11}.metric{font:950 62px ui-monospace,SFMono-Regular,Menlo,monospace}.cta{font:900 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#090b11}.url{font:750 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.8px;fill:#74828a}
  </style>
</svg>

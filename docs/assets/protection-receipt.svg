<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">Protection Receipt Contract</title>
  <desc id="desc">Six exact obligations connect a real-world request to a protected, truthful receipt: subject, rule, gates, clock and channel, owner, and receipt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#19100f"/><stop offset="1" stop-color="#0c1415"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff6b4a"/><stop offset=".52" stop-color="#ffc34d"/><stop offset="1" stop-color="#36c6d3"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1200" height="410" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="410" rx="18" fill="url(#grid)"/>
  <path d="M61 241H1139" stroke="#4c3937" stroke-width="2"/>
  <path d="M61 241H1139" stroke="url(#line)" stroke-width="2" stroke-dasharray="6 12" filter="url(#glow)"/>
  <g font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
    <text x="60" y="55" fill="#ff6b4a" font-size="12" font-weight="800" letter-spacing="2.2">PUBLIC PROTECTION / EXECUTED TRUTH</text>
    <text x="60" y="105" fill="#ffffff" font-size="42" font-weight="760" letter-spacing="-1.5">The action sounds right. Where is the receipt?</text>
    <text x="60" y="139" fill="#b7b5ae" font-size="17">Six obligations must remain joined. One false stage means the protection is not proved.</text>
    <g font-size="11" font-weight="800" letter-spacing="1.2">
      <g transform="translate(60 195)"><circle cx="34" cy="46" r="34" fill="#241817" stroke="#ff6b4a"/><text x="34" y="51" text-anchor="middle" fill="#ff8a70">01</text><text x="34" y="101" text-anchor="middle" fill="#ffffff">SUBJECT</text><text x="34" y="121" text-anchor="middle" fill="#77746f" font-size="9">EXACT ID</text></g>
      <g transform="translate(245 195)"><circle cx="34" cy="46" r="34" fill="#211a13" stroke="#ff9e52"/><text x="34" y="51" text-anchor="middle" fill="#ffb071">02</text><text x="34" y="101" text-anchor="middle" fill="#ffffff">RULE</text><text x="34" y="121" text-anchor="middle" fill="#77746f" font-size="9">CURRENT PATH</text></g>
      <g transform="translate(430 195)"><circle cx="34" cy="46" r="34" fill="#211d12" stroke="#ffc34d"/><text x="34" y="51" text-anchor="middle" fill="#ffd170">03</text><text x="34" y="101" text-anchor="middle" fill="#ffffff">GATES</text><text x="34" y="121" text-anchor="middle" fill="#77746f" font-size="9">ALL CONJUNCTS</text></g>
      <g transform="translate(615 195)"><circle cx="34" cy="46" r="34" fill="#14211c" stroke="#7ecb5b"/><text x="34" y="51" text-anchor="middle" fill="#9ede80">04</text><text x="34" y="101" text-anchor="middle" fill="#ffffff">CLOCK</text><text x="34" y="121" text-anchor="middle" fill="#77746f" font-size="9">+ CHANNEL</text></g>
      <g transform="translate(800 195)"><circle cx="34" cy="46" r="34" fill="#101f21" stroke="#36c6d3"/><text x="34" y="51" text-anchor="middle" fill="#65dce5">05</text><text x="34" y="101" text-anchor="middle" fill="#ffffff">OWNER</text><text x="34" y="121" text-anchor="middle" fill="#77746f" font-size="9">HUMAN AUTHORITY</text></g>
      <g transform="translate(985 195)"><circle cx="34" cy="46" r="34" fill="#19182a" stroke="#b99afa"/><text x="34" y="51" text-anchor="middle" fill="#cbb6ff">06</text><text x="34" y="101" text-anchor="middle" fill="#ffffff">RECEIPT</text><text x="34" y="121" text-anchor="middle" fill="#77746f" font-size="9">EXECUTED STAGE</text></g>
    </g>
    <g transform="translate(60 355)">
      <rect width="1080" height="34" rx="17" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".09"/>
      <text x="18" y="22" fill="#aaa7a0" font-size="10" font-weight="700" letter-spacing="1">APPOINTMENT ≠ REPAIR</text>
      <text x="235" y="22" fill="#aaa7a0" font-size="10" font-weight="700" letter-spacing="1">DRAFT ≠ FILED</text>
      <text x="409" y="22" fill="#aaa7a0" font-size="10" font-weight="700" letter-spacing="1">DISPUTE ≠ WON</text>
      <text x="590" y="22" fill="#aaa7a0" font-size="10" font-weight="700" letter-spacing="1">CORRECTION ≠ ERASURE</text>
      <text x="842" y="22" fill="#ff8a70" font-size="10" font-weight="800" letter-spacing="1">ALL SIX = PROTECTED</text>
    </g>
  </g>
</svg>
